# 2026-10-29 기획 통합. F1–F6 기존 코드, F7–F14 계획·미구현. done은 수용 조건이다.
# 군말·긴장 사례는 제품 방향 예시이며 E1의 실제 경험으로 추가하지 않는다.
# 영상 불러오기·선택 글자 변환(9d2a10b)은 코드가 있으나 기능 번호 미배정이라 features에 넣지 않았다(docs/import-feature.md).
statement: 발표를 준비하는 대학생은 혼자 시간 초과·미달과 반복 표현을 점검할 때, 고칠 구간을 찾는 것뿐 아니라 문제가 생기는 조건과 바꿔 볼 준비 방법을 정하고 재연습에서 도움이 됐는지 확인하는 데 어려움을 겪을 수 있다.
canvas:
  context: 수업이나 팀 프로젝트 발표를 앞두고 집이나 빈 강의실에서 혼자 연습할 때 발생한다. 내용 전달에 집중하거나 긴장하면 말하기 속도와 시간을 함께 관리하기 어렵고, 제한 시간을 초과하거나 지정된 시간을
    채우지 못할 수 있다. 연습 후에는 직접 녹음하고 웹캠으로 녹화한 내용을 다시 보며 고칠 부분을 점검한다.
  customer: 수업이나 팀 프로젝트에서 발표를 맡은 대학생이다. 특히 발표 경험이 충분하지 않고, 다른 사람의 도움을 받기 어려운 상황에서 정해진 시간에 맞춰 혼자 연습하고 개선해야 하는 사람을 핵심 대상으로 한다.
  root_problem: 녹음·영상과 측정값만으로는 반복이 생긴 상황과 이유를 충분히 알기 어렵고, 무엇을 바꾸고 다시 확인할지는 사용자가 직접 판단해야 한다. 관찰·본인 설명·조건 변경·재연습을 연결하는 지원이 필요하다는
    문제 가설이다.
  impact:
    feeling: “되게 시간이 오래 걸렸어.” 직접 녹음·녹화하고 다시 확인하는 과정에서 시간 부담을 느꼈다.
    measurable: 본인은 대사 암기와 직접 녹음·웹캠 녹화 및 반복 점검 등을 포함한 발표 준비 전반에 약 10시간이 들었다고 기억한다. 정확히 측정한 시간이 아니며 영상 검토에만 든 시간이나 전부 자동화로
      줄일 수 있는 시간을 뜻하지 않는다. 시간 초과와 미달을 모두 경험했지만 정확한 종료 시각과 실제 감점 여부는 확인되지 않았다.
  alternatives:
  - how_used: 직접 녹음하고 웹캠으로 녹화한 뒤 다시 재생하며 점검한다.
    shortcoming: 검토할 구간을 직접 찾고 수정 전후의 차이를 확인하는 데 시간이 든다. 본인의 경험으로 확인한 부담이다.
    why_ours: 검토할 위치·근거·수정 항목을 연결해 전체 재생과 수동 비교 부담을 줄이는 것을 목표로 한다. 절감 효과는 아직 실측하지 않았다.
  - how_used: 타이머·스톱워치로 전체 시간을 재고 대사를 외우며 대본 분량과 속도를 조절한다.
    shortcoming: 총 시간은 알 수 있지만 어떤 내용을 줄이거나 보완할지와 수정 효과는 직접 판단해야 한다.
    why_ours: 전체 시간과 구간 기록에 대본 버전·필수 내용을 연결하고 수정 후 재연습으로 확인하도록 설계한다.
  - how_used: PT샌드백으로 장표별 시간 설정·대본 편집·발표 연습을 한다.
    shortcoming: 직접 확인한 무료 경로에서 목표 시간을 1분에서 2분으로 바꾸고 균등 배분해도 대본은 그대로였다. AI·유료 기능 전체의 자동 수정 가능 여부는 미확인이다.
    why_ours: 개인 실측을 반영한 문장 수정과 필수 내용 보존 검사까지 제품 범위로 정했다. 경쟁사 전체 기능의 부재나 우월성을 입증한 것은 아니다.
  - how_used: Talkli로 속도·반복 등을 점검하고 녹음 회차를 비교한다.
    shortcoming: 회차 비교는 이미 공식 기능이다. 목표 시간 기반 자동 대본 수정의 제공 여부와 앱 내부 품질은 이번 조사에서 확인하지 못했다.
    why_ours: 단순 회차 비교를 고유 차별점으로 내세우지 않고, 수정 항목·대본 버전·필수 내용의 근거를 연결하는 과업에 집중한다.
  - how_used: SayNow의 말하기 훈련·성장 기록과 웹 피치·시간 도구를 사용한다.
    shortcoming: 웹 피치 도구에 긴 가상 내용을 입력했을 때 30초 버전이 예상 49초가 되어 사용자가 답변을 줄이라고 안내했다. 이 결과를 모바일 앱 전체의 한계로 확대하지 않는다.
    why_ours: 실제 연습과 연결된 문장 수정 제안·내용 보존·항목별 재점검을 계획한다. 앱 전체에 해당 기능이 없다는 주장은 하지 않는다.
personas:
- id: P1
  description: 수업이나 팀 프로젝트 발표를 준비하는 대학생 본인이다. 혼자 연습하면서 발표 내용, 말하기 속도, 제한 시간을 함께 관리해야 했다.
  source: 이 저장소의 본인 경험 E1과 사용자가 제공한 대화. 다른 대학생 인터뷰를 수행한 것으로 보지 않는다.
experiences:
- id: E1
  when: 대학교 응용 프로젝트 발표를 준비하고 실제 발표할 때. 정해진 발표 시간에 맞춰 내용을 전달해야 했다.
  what_happened: '긴장하면 말이 빨라지고 내용 전달에 집중하느라 경과 시간과 남은 시간을 함께 확인하기 어려웠다. 실제 발표에서 제한 시간을 초과한 적도, 지정된 시간을 채우지 못한 적도 있었다.

    연습할 때 직접 녹음하고 웹캠으로 녹화한 뒤 다시 재생해 보며 점검했다. 이 과정이 오래 걸렸고 대사 암기 등 준비 전반에 대략 10시간이 들었다고 기억한다.'
  workaround: 대사를 외우고 타이머·스톱워치로 시간을 재며 반복 연습했다. 직접 녹음하고 웹캠으로 녹화한 뒤 재생하며 점검했다.
  feeling: 녹음·녹화 후 직접 확인하는 과정의 시간 부담을 느꼈다.
  quote: 되게 시간이 오래 걸렸어
  source: 사용자가 제공한 본인 발표 준비·발표 경험 대화. 준비 시간은 회고이며 정확한 종료 시간·감점·활동별 시간은 미확인. 기존 문서의 10~11분 규칙과 10분 30초 목표는 docs/decisions.md에
    보존하고 재확인 대상으로 구분했다.
sources:
