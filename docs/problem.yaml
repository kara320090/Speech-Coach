# 종이 문제정의 기록(앞면 캔버스·뒷면)을 옮긴 파일. 종이에 없는 칸은 null 또는 []로 비워 둔다.
# 근본 문제(canvas.root_problem)는 팀 결정에 따라 앞면 ③ 문장을 쓴다.
# 참고: 종이 뒷면 5 Whys 아래 적힌 근본 문제 문장 — "발표자는 긴장한 상태에서 내용을 전달하면서 말하기 속도와 남은 시간을 파악하고 조절하는 데 어려움을 겪는다."
statement: |-
  발표를 준비하는 대학생은 혼자 연습할 때 어떤 구간을 어떻게 고쳐야 하는지 파악하기 어려워 같은 실수를 반복하고 준비 시간을 낭비한다. 지금은 녹음 재생과 타이머로 점검하지만, 문제 구간을 직접 찾아야 하고 연습 전후의 개선 정도도 확인하기 어렵다.
canvas:
  context: |-
    수업이나 팀 프로젝트 발표를 앞두고 집이나 빈 강의실에서 혼자 연습할 때 발생한다. 정해진 시간에 맞춰 내용을 전달해야 하지만, 연습할 때마다 말이 빨라지거나 불필요한 표현을 반복하고 제한 시간을 초과하거나 지정된 시간을 채우지 못한다. 연습한 내용을 직접 녹음하고 웹캠으로 녹화한 뒤 다시 재생해 보며 점검해야 해서 번거롭고 시간이 오래 걸린다.
  customer: |-
    팀 프로젝트에서 발표를 맡은 대학생이다. 발표 경험이 충분하지 않고, 짧은 준비 시간 안에 다른 사람의 도움 없이 발표를 점검하고 개선해야 하는 사람을 핵심 대상으로 한다.
  root_problem: |-
    말하는 동안에는 내용 전달에 집중하기 때문에 자신의 말버릇과 속도를 동시에 점검하기 어렵다. 연습 후에도 녹음·시간 측정·피드백이 따로 남아, 고쳐야 할 구간과 개선 여부를 직접 찾아 비교해야 한다.
  impact:
    feeling: |-
      “계속 연습했는데 어디를 고쳐야 할지 모르겠어요.” 준비가 충분한지 확신하지 못해 답답함과 불안감을 느낀다.
    measurable: |-
      대사 암기, 직접 녹음·웹캠 녹화와 반복 점검 등 발표 준비에 약 10시간이 들었다. 정확히 측정한 기록이 아니라 기억에 따른 대략적인 시간이며, 녹음·녹화 영상을 다시 보는 시간만을 뜻하지 않는다. 그렇게 준비하고도 실제 발표에서 제한 시간을 초과한 적도, 지정된 시간을 채우지 못한 적도 있었다.
  alternatives:
    - how_used: 휴대전화로 발표를 녹음한 뒤 처음부터 끝까지 다시 듣고 고칠 부분을 메모한다.
      shortcoming: 문제 구간을 직접 찾아야 하며, 반복 표현과 속도 변화를 일일이 기록하고 이전 연습과 비교하기 번거롭다.
      why_ours: null
    - how_used: 타이머를 켜고 발표 전체 시간을 측정하면서 대본을 줄이거나 말하는 속도를 조절한다.
      shortcoming: 전체 시간은 알 수 있지만 어느 구간을 줄여야 하는지 알기 어렵고, 시간에 맞추려고 말만 빨라질 수 있다.
      why_ours: null
    - how_used: 친구나 팀원 앞에서 발표하고 말투·속도·시간에 대한 의견을 받는다.
      shortcoming: 상대방과 시간을 맞춰야 하며, “조금 빠르다” 같은 총평만 받으면 구체적인 수정으로 연결하기 어렵다.
      why_ours: null
personas:
  - id: P1
    description: 10분 이상 11분 미만으로 발표를 마쳐야 하는 대학생. 발표할 때 긴장하며, 내용을 전달하면서 말하기 속도와 시간을 함께 관리하기 어렵다.
    source: null
experiences:
  - id: E1
    when: |-
      대학교 응용 프로젝트 발표를 준비할 때. 10분보다 짧거나 11분 이상이면 감점이어서, 내용을 잘 전달하면서 정해진 시간 안에 끝내야 했다.
    what_happened: |-
      긴장하니 말이 빨라졌다. 발표 내용에 집중하다 보니 시간이 얼마나 지났고 얼마나 남았는지 확인하기 어려웠다.
      연습할 때와 실제 발표할 때의 말하는 속도가 달랐다. 시간을 확인하려고 화면이나 시계를 보면 설명하던 흐름이 끊겼고, 남은 시간을 알아도 어느 부분에서 속도를 조절해야 할지 바로 판단하기 어려웠다.
      실제 발표에서 제한 시간을 초과한 적도 있었고, 지정된 시간보다 짧게 끝낸 적도 있었다. 긴장해서 말이 빨라지면 10분을 채우지 못했고, 내용을 자세히 설명하다 보면 11분을 넘기기도 했다. 연습할 때 시간을 맞춰도 실제 발표에서는 말하는 속도와 설명하는 분량이 달라져서, 정해진 시간에 맞춰 마무리하기 어려웠다.
      연습할 때는 직접 녹음하고 웹캠으로 녹화한 뒤 다시 재생해 보며 점검했는데, 이 과정이 번거롭고 시간이 오래 걸렸다. 대사 암기 등 발표 준비를 포함해 대략 10시간이 들었다고 기억한다.
    workaround: |-
      휴대폰 스톱워치를 켜고 발표 대본을 읽으면서 시간을 쟀다. 10분 30초 정도를 목표로 잡고, 시간이 길면 설명을 줄이고 짧으면 필요한 내용을 보충하는 방식으로 연습했다. 또 직접 일일이 녹음하고 웹캠으로 녹화한 뒤, 다시 재생해 보며 점검했다.
    feeling: 준비한 내용을 너무 일찍 끝내는 건 아닌지 신경이 쓰였다.
    quote: null
    source: 본인의 발표 경험
sources: []
five_whys:
  symptom: null
  whys:
    - 긴장하면 말이 빨라지고 발표 내용에 집중하느라 시간 확인을 놓친다.
    - 내용 전달, 말하기 속도 조절, 시간 확인을 동시에 수행하기 어렵다. (?)
    - 시간을 확인해도 남은 발표 내용과 비교하여 속도와 분량을 직접 판단해야 한다. (?)
    - 남은 시간만으로는 현재 발표 진행이 계획보다 빠른지 느린지 바로 판단하기 어렵다. (?)
    - 준비한 시간 계획과 실제 진행 상태를 발표 중에 쉽게 비교할 기준이 부족하다. (?)
solution_paths:
  - path: 발표 중 남은 시간과 말하기 속도를 한 화면에 표시하고, 시간 임박이나 설정 속도 초과를 색상으로 알려준다.
    status: chosen
    reason: 발표 흐름을 크게 끊지 않고 현재 상태를 확인하고 조절하도록 돕는다.
  - path: 발표가 끝난 뒤 녹음을 분석해 말버릇, 속도 변화, 시간 초과 여부를 보고서로 제공한다.
    status: deferred
    reason: 다음 연습에는 도움이 되지만 발표 도중 시간 확인이 어렵다는 문제를 즉시 해결하지는 못한다.
insight:
  claim: 발표자는 긴장할 때 말이 빨라지며, 내용을 전달하는 동안 시간까지 확인하고 조절하기 어렵다.
  evidence: 10분 이상 11분 미만으로 끝내야 하는 발표 상황에서 긴장으로 말이 빨라지고, 내용에 집중하느라 경과 시간과 남은 시간을 확인하기 어려웠다는 본인의 경험이다.
  design_decision: 남은 시간과 말하기 속도를 쉽게 보여주고 필요한 순간에 색상으로 알려주는 발표 보조 기능을 우선 만든다. 음성 알림과 표정·자세 분석은 첫 버전에서 제외한다.
