# 종이 문제정의 기록(앞면 캔버스·뒷면)을 옮긴 뒤, 2026-10-29 학생의 방향 변경 지시로 다시 쓴 파일이다.
# - 종이 원본에서는 해법 경로 1(실시간 발표 보조)만 선택하고 경로 2(연습 후 분석)는 보류였다.
# - 2026-10-29 학생이 '실시간 보조를 먼저 만들고, 직접 녹음·녹화해 다시 확인하는 수동 점검 부담을 줄이는 자동 점검을 이어서 만든다'로 바꾸라고 지시했고, 앞·뒷면 문구도 그에 맞게 다시 쓰라고 해서 이 파일에 반영했다.
#   이 변경은 종이에 있던 합의가 아니라 이때 새로 정한 결정이다.
# - 근거가 확인되지 않은 칸은 null 또는 []로 비워 둔다. 확인이 더 필요한 원인에는 (?)를 붙였다.
# - 종이 뒷면 5 Whys 아래 적혀 있던 이전 근본 문제 문장(참고): "발표자는 긴장한 상태에서 내용을 전달하면서 말하기 속도와 남은 시간을 파악하고 조절하는 데 어려움을 겪는다."
statement: |-
  발표를 준비하는 대학생은 혼자 연습할 때 발표 중 시간과 말하기 속도를 조절하고 연습 후 고칠 구간과 개선 여부를 파악하기 어려워, 녹음·영상을 반복해서 확인하며 많은 준비 시간과 노력을 들인다.
canvas:
  context: |-
    수업이나 팀 프로젝트 발표를 앞두고 집이나 빈 강의실에서 혼자 연습할 때 발생한다. 긴장하거나 내용 전달에 집중하면 말하기 속도와 시간을 함께 관리하기 어려워 제한 시간을 초과하거나 지정된 시간을 채우지 못한다. 연습 후에는 녹음·영상을 직접 다시 확인하며 고칠 부분을 찾아야 한다.
  customer: |-
    수업이나 팀 프로젝트에서 발표를 맡은 대학생이다. 특히 발표 경험이 충분하지 않고, 다른 사람의 도움을 받기 어려운 상황에서 정해진 시간에 맞춰 혼자 연습하고 개선해야 하는 사람을 핵심 대상으로 한다.
  root_problem: |-
    발표 중에는 내용 전달에 집중하므로 자신의 말하기 속도와 시간 사용을 동시에 점검하기 어렵다. 연습 후에도 녹음·영상, 시간 기록, 수정할 내용이 따로 남아 문제 구간을 찾고 이전 연습과 비교하는 일을 직접 해야 한다.
  impact:
    feeling: |-
      “되게 시간이 오래 걸렸어.” 직접 녹음·녹화하고 다시 확인하는 과정에서 시간 부담을 느꼈다.
    measurable: |-
      본인 경험에서는 대사 암기, 직접 녹음·웹캠 녹화와 반복 점검 등 발표 준비 전반에 약 10시간이 들었다. 정확히 측정한 기록이 아니라 기억에 따른 대략적인 시간이며, 영상 검토에만 걸린 시간은 아니다. 그렇게 준비한 뒤에도 실제 발표에서 시간 초과와 미달을 경험했다.
  alternatives:
    - how_used: 발표를 직접 녹음하고 웹캠으로 녹화한 뒤, 다시 재생하며 고칠 부분을 찾는다.
      shortcoming: 고칠 구간을 직접 찾아야 하고, 이전 연습과 무엇이 달라졌는지 비교하는 데 시간이 든다.
      why_ours: null
    - how_used: 타이머나 스톱워치로 전체 발표 시간을 재고 대본 분량이나 말하기 속도를 조절한다.
      shortcoming: 전체 시간은 알 수 있지만 어느 구간에서 시간이 부족하거나 남는지, 무엇을 조절해야 하는지 파악하기 어렵다.
      why_ours: null
    - how_used: 대사를 외우고 반복 연습하며 발표 내용과 흐름을 익힌다.
      shortcoming: 내용을 익히는 데는 도움이 되지만, 반복만으로는 말하기 속도·시간 사용의 문제를 발견하고 개선 여부를 확인하기 어렵다.
      why_ours: null
personas:
  - id: P1
    description: 수업이나 팀 프로젝트 발표를 준비하는 대학생 본인이다. 혼자 연습하면서 발표 내용, 말하기 속도, 제한 시간을 함께 관리해야 했다.
    source: null
experiences:
  - id: E1
    when: |-
      대학교 응용 프로젝트 발표를 준비할 때. 10분보다 짧거나 11분 이상이면 감점이어서, 내용을 잘 전달하면서 정해진 시간 안에 끝내야 했다.
    what_happened: |-
      긴장하니 말이 빨라졌다. 발표 내용에 집중하다 보니 시간이 얼마나 지났고 얼마나 남았는지 확인하기 어려웠다.
      연습할 때와 실제 발표할 때의 말하는 속도가 달랐다. 시간을 확인하려고 화면이나 시계를 보면 설명하던 흐름이 끊겼고, 남은 시간을 알아도 어느 부분에서 속도를 조절해야 할지 바로 판단하기 어려웠다.
      실제 발표에서 제한 시간을 초과한 적도 있었고, 지정된 시간보다 짧게 끝낸 적도 있었다. 긴장해서 말이 빨라지면 10분을 채우지 못했고, 내용을 자세히 설명하다 보면 11분을 넘기기도 했다. 연습할 때 시간을 맞춰도 실제 발표에서는 말하는 속도와 설명하는 분량이 달라져서, 정해진 시간에 맞춰 마무리하기 어려웠다.
      연습할 때는 직접 녹음하고 웹캠으로 녹화한 뒤 다시 재생해 보며 점검했는데, 이 과정이 번거롭고 시간이 오래 걸렸다. 대사 암기 등 발표 준비를 포함해 대략 10시간이 들었다고 기억한다.
    workaround: |-
      대사를 외우고 휴대폰 스톱워치를 켜고 발표 대본을 읽으면서 시간을 쟀다. 10분 30초 정도를 목표로 잡고, 시간이 길면 설명을 줄이고 짧으면 필요한 내용을 보충하는 방식으로 연습했다. 또 직접 일일이 녹음하고 웹캠으로 녹화한 뒤, 다시 재생해 보며 점검했다.
    feeling: 준비한 내용을 너무 일찍 끝내는 건 아닌지 신경이 쓰였다.
    quote: null
    source: 본인의 발표 준비 및 발표 경험에 대한 회고. 준비 시간은 대략적인 기억이며, 실제 발표 종료 시간과 감점 여부는 확인되지 않았다.
sources: []
five_whys:
  symptom: 혼자 발표를 연습할 때 고칠 구간을 찾고 개선 여부를 확인하는 데 왜 많은 시간과 노력이 드는가?
  whys:
    - 고칠 부분을 찾기 위해 녹음·영상을 직접 다시 확인해야 하기 때문이다.
    - 녹음·영상과 전체 발표 시간만으로는 언제 어떤 문제가 생겼는지 바로 파악하기 어렵기 때문이다. (?)
    - 구간별 말하기 속도, 시간 사용, 수정할 내용이 서로 연결된 기록으로 정리되어 있지 않기 때문이다. (?)
    - 연습 기록과 점검 결과를 따로 관리하며, 이전 연습과 같은 기준으로 비교하는 일을 직접 해야 하기 때문이다. (?)
    - 연습 전 시간 계획, 연습 중 상태 확인, 연습 후 점검이 하나의 일관된 과정으로 연결되어 있지 않기 때문이다. (?)
solution_paths:
  - path: 목표 발표 시간과 필요한 구간별 시간 계획을 설정하고, 연습 중 경과 시간·남은 시간·측정된 말하기 속도를 한 화면에 표시한다. 설정한 기준을 벗어나면 색상으로 안내한다. 구간별 계획이 있는 경우 실제 진행과 비교한다.
    status: chosen
    reason: 발표 내용을 전달하면서 시간과 속도를 함께 관리해야 하는 부담을 줄이고, 연습 도중 자신의 상태를 확인하고 조절하도록 돕는다. (1차 구현)
  - path: 연습 음성을 기록하고, 웹캠 영상은 선택적으로 기록한다. 시간 사용, 긴 침묵, 반복 표현, 속도 변화 등 측정 가능한 항목을 분석해 검토할 구간을 표시한다. 해당 구간을 바로 재생하고 이전 연습의 같은 지표와 비교할 수 있게 한다.
    status: chosen
    reason: 녹음·영상을 처음부터 다시 확인하며 문제 구간을 찾는 수고를 줄이고, 실제 수정과 재연습에 집중하도록 돕는다. 종이 원본에서는 보류였지만 2026-10-29 수동 점검 부담까지 해결하기 위해 후속 구현 범위에 포함하기로 바꿨다. (2차 구현)
insight:
  claim: 발표 준비에 많은 시간을 들여도 발표 중 시간·속도를 관리하는 어려움과 연습 후 고칠 부분을 직접 찾는 부담이 남았다. 연습을 반복하는 것과 개선 여부를 확인하는 것은 별도의 작업이었다.
  evidence: 본인은 대사 암기, 녹음·웹캠 녹화와 반복 점검 등 발표 준비에 약 10시간을 사용했다고 기억한다. 실제 발표에서는 긴장으로 말이 빨라지고 시간을 확인하기 어려웠으며, 시간 초과와 미달을 모두 경험했다. 이는 본인 한 사람의 경험으로, 다른 대학생에게도 같은 문제가 나타나는지는 추가 확인이 필요하다.
  design_decision: 실시간 시간·속도 안내를 먼저 만들고, 연습 후 검토 구간 표시·해당 구간 재생·이전 연습과의 비교 기능을 이어서 만든다. 사용자가 직접 녹음·영상을 전부 확인하는 부담을 줄이는 데 집중한다. 웹캠 녹화는 선택 사항으로 두고, 음성 알림과 표정·자세 분석은 첫 버전에서 제외한다.
# 아래 기능은 위 해법 경로에서 나온 것이고, 각 완료 조건은 e2e/ 검사(주최 측 방식 4개 흐름, 가짜 마이크·웹캠 검사)와 tests/ 단위 테스트로 확인했다.
# 실제 마이크·카메라·음성 인식 서비스로는 아직 확인하지 않았다(progress.md '제한').
features:
  - id: F1
    name: 연습 준비(목표·기준·계획·기록 방법 설정)
    input: 목표 시간(분·초), 허용 오차(초), 임박 알림(남은 초), 목표 속도 범위(선택), 구간별 시간 계획(선택), 소리 기록·웹캠 영상 기록·음성 인식 분석 선택
    output: 설정에 맞는 연습 화면이 열린다. 목표 시간은 특정 값으로 정해져 있지 않고 매번 직접 입력한다.
    done: 목표 시간을 비우거나 구간 계획 줄 형식이 틀리면 연습이 시작되지 않고 이유와 줄 번호가 보인다. 올바르게 입력하면 연습이 시작된다.
  - id: F2
    name: 실시간 발표 보조
    input: 연습 시작·일시정지·다시 시작·종료 버튼
    output: 경과 시간과 남은 시간, 시간 상태(여유·임박·초과, 색과 글자), 음성 인식을 켠 경우 최근 20초 기준 말하기 속도(분당 한글 음절)와 목표 속도 범위 비교가 보인다.
    done: 목표 2초로 시작하면 2초가 지난 뒤 '목표 시간 초과'와 남은 시간 칸의 '초과 +'가 보인다. 일시정지한 시간은 연습 시간에서 빠진다. 음성 인식을 켜지 않았거나 지원되지 않으면 속도 칸에 '측정 안 함/측정 불가'와 이유가 보이고 숫자는 보이지 않는다.
  - id: F3
    name: 구간별 시간 계획 비교
    input: 구간 이름과 시간 계획, 연습 중 '다음 구간' 버튼
    output: 연습 중 현재 구간의 계획 대비 진행과 앞 구간까지의 누적 차이, 결과 화면의 구간별 계획·실제·차이 표
    done: 구간 계획이 없으면 진행이 빠른지 느린지 판단하지 않는다고 표시한다. 계획이 있으면 '다음 구간'을 누른 시점으로 구간 실제 시간을 계산하고, 연습을 끝낼 때까지 진행한 구간은 '연습 종료까지'로, 시작하지 못한 구간은 '진행 안 함'으로 표시한다.
  - id: F4
    name: 소리·웹캠 영상 기록
    input: 마이크 권한(웹캠은 선택)
    output: 연습 소리(WAV)와 선택한 경우 웹캠 영상이 이 브라우저 안에만 저장된다. 서버로 보내지 않는다.
    done: 권한이 거부되거나 장치가 없으면 '녹음 없이 시간만 측정해요' 안내가 뜨고 연습은 계속되며, 결과에 기록이 없다고 알린다. 기록한 연습은 결과 화면에서 다시 재생할 수 있고 재생 길이가 연습 시간과 맞는다.
  - id: F5
    name: 자동 점검 구간 표시와 구간 재생
    input: 연습 종료
    output: 긴 침묵(소리 기반), 반복 표현·속도 변화(음성 인식을 켠 경우), 구간 시간 차이를 시간 위치·측정값·근거와 함께 목록으로 보여 주고, 항목을 누르면 녹음·영상의 그 위치로 이동한다.
    done: 5초 무음이 든 녹음에서 '긴 침묵'이 해당 위치(±1초)·약 5초로 표시되고 항목을 누르면 재생 위치가 그 시각으로 이동한다. 소리가 거의 없는 녹음은 침묵 구간 대신 '소리가 거의 없다'고 알린다. 표시할 구간이 없을 때는 그 사실만 알리고 평가하지 않는다.
  - id: F6
    name: 연습 결과와 같은 조건 비교
    input: 같은 목표 시간·구간 계획으로 한 이전 연습 기록
    output: 총 연습 시간, 목표와의 차이(초과·일찍 끝남·허용 오차 안), 측정된 평균 속도, 검토 구간 수를 이전 연습과 나란히 보여 준다. 점수·개선율은 만들지 않는다.
    done: 비교할 이전 기록이 없으면 '아직 비교할 이전 기록이 없어요'가 보인다. 같은 조건으로 두 번째 연습을 끝내면 이전·이번 총 연습 시간과 변화가 표로 나온다. 측정하지 못한 값(예를 들어 속도)은 '비교 불가'와 이유로 표시한다.
