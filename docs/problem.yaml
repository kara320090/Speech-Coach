# 2026-10-29 기획 통합. F1–F6은 구현됨(실제 장치 검증 필요), F7–F14는 개발 예정. done은 수용 조건이다.
# E1·P1·대안의 종이 기록 내용은 27eebf1의 학생 확인 기록을 기준으로 복원했다. 실제 종료 시각·감점 여부는 미확인.
# 5 Whys 1–3은 E1에서 확인된 원인, 4–5의 (?)는 추가 확인이 필요한 원인이다.
# 군말·긴장 사례는 제품 방향 예시이며 E1의 실제 경험으로 추가하지 않는다.
# 영상 불러오기·선택 글자 변환(9d2a10b)은 코드가 있으나 기능 번호 미배정이라 features에 넣지 않았다(docs/import-feature.md).
statement: 발표를 준비하는 대학생은 혼자 연습할 때 내용을 전달하면서 시간과 말하기 속도를 함께 관리하기 어렵고, 연습 후에는 녹음·영상을 처음부터 다시 보며 고칠 구간을 직접 찾아야 한다. 고칠 구간을 찾아도 그 순간 무엇이 어려웠는지, 다음 연습에서 무엇을 바꿔야 하는지 정하기 어려워 같은 실수를 반복하고, 오래 준비하고도 실제 발표에서 시간 초과·미달을 겪는다.
canvas:
  context: 수업이나 팀 프로젝트 발표를 앞두고 집이나 빈 강의실에서 혼자 연습할 때 발생한다. 정해진 시간에 맞춰 내용을 전달해야 하지만, 긴장하면 말이 빨라지거나 불필요한 표현을 반복하고, 시간을 확인하려고 화면이나 시계를 보면 설명하던 흐름이 끊긴다. 그 결과 제한 시간을 초과하거나 지정된 시간을 채우지 못한다. 연습한 내용을 직접 녹음하고 웹캠으로 녹화한 뒤 다시 재생해 보며 점검해야 해서 번거롭고 시간이 오래 걸린다.
  customer: 수업이나 팀 프로젝트에서 발표를 맡은 대학생이다. 특히 발표 경험이 충분하지 않고, 다른 사람의 도움을 받기 어려운 상황에서 정해진 시간에 맞춰 혼자 연습하고 개선해야 하는 사람을 핵심 대상으로 한다.
  root_problem: 발표 중에는 내용 전달에 집중하기 때문에 말하기 속도와 시간을 동시에 점검하기 어렵고, 시간을 확인하는 행동 자체가 설명의 흐름을 끊는다. 연습 후에도 녹음·시간 기록·고칠 내용이 따로 남아 문제 구간을 직접 찾아야 하며, 그 순간의 어려움에 맞춰 준비 방식이나 연습 조건을 바꾸고 다시 확인하는 방법이 없어 같은 어려움이 반복된다.
  impact:
    feeling: “되게 시간이 오래 걸렸어.” 직접 녹음·녹화하고 다시 확인하는 과정에서 시간 부담을 느꼈다. 실제 발표를 앞두고는 준비한 내용을 너무 일찍 끝내는 건 아닌지 신경이 쓰였다.
    measurable: 본인은 대사 암기와 직접 녹음·웹캠 녹화 및 반복 점검 등을 포함한 발표 준비 전반에 약 10시간이 들었다고 기억한다. 정확히 측정한 시간이 아니며 영상 검토에만 든 시간이나 전부 자동화로 줄일 수 있는 시간을 뜻하지 않는다. 10분 이상 11분 미만이어야 감점되지 않는 발표에서, 그렇게 준비하고도 제한 시간을 초과한 적과 10분을 채우지 못한 적이 모두 있었다. 실제 종료 시각과 감점 여부는 기록되어 있지 않다.
  alternatives:
  - how_used: 직접 녹음하고 웹캠으로 녹화한 뒤 다시 재생하며 점검한다.
    shortcoming: 검토할 구간을 직접 찾고 수정 전후의 차이를 확인하는 데 시간이 든다. 본인의 경험으로 확인한 부담이다.
    why_ours: 검토할 구간을 재생 위치·근거와 함께 표시해 처음부터 다시 볼 부담을 줄이고(구현됨), 그 구간에서 겪은 어려움을 확인한 뒤 바꿀 준비·연습 조건을 정해 재연습으로 확인하게 한다(개발 예정). 절감 효과는 아직 실측하지 않았다.
  - how_used: 타이머·스톱워치로 전체 시간을 재고 대사를 외우며 대본 분량과 속도를 조절한다.
    shortcoming: 총 시간은 알 수 있지만 어떤 내용을 줄이거나 보완할지와 수정 효과는 직접 판단해야 한다.
    why_ours: 전체 시간뿐 아니라 구간별 계획과 실제를 연습 중·후에 보여 주고(구현됨), 시간 확인이 흐름을 끊는 경우 표시 방식 자체를 바꿔 시험할 수 있게 한다(개발 예정).
  - how_used: 친구나 팀원 앞에서 발표하고 말투·속도·시간에 대한 의견을 받는다.
    shortcoming: 상대방과 시간을 맞춰야 하며, “조금 빠르다” 같은 총평만 받으면 구체적인 수정으로 연결하기 어렵다. (종이 문제정의 기록)
    why_ours: 혼자 연습할 때도 구간별 근거를 남기고, 사용자가 원하면 익숙한 상대 앞 연습을 하나의 연습 조건으로 선택해 기록·비교할 수 있게 한다(개발 예정). 서비스가 다른 사람에게 연락하지는 않는다.
  - how_used: PT샌드백으로 장표별 시간 설정·대본 편집·발표 연습을 한다.
    shortcoming: 직접 확인한 무료 경로에서 목표 시간을 1분에서 2분으로 바꾸고 균등 배분해도 대본은 그대로였다. AI·유료 기능 전체의 자동 수정 가능 여부는 미확인이다.
    why_ours: 시간 배분 도구와 경쟁하기보다, 연습에서 관찰된 구간의 당시 상황을 확인하고 준비·연습 조건을 하나씩 바꿔 재연습으로 비교하는 과업에 집중한다. 목표 시간에 맞춘 대본 수정은 그중 필요할 때 고르는 조치다. 경쟁사 전체 기능의 부재나 우월성을 입증한 것은 아니다.
  - how_used: Talkli로 속도·반복 등을 점검하고 녹음 회차를 비교한다.
    shortcoming: 회차 비교는 이미 공식 기능이다. 목표 시간 기반 자동 대본 수정의 제공 여부와 앱 내부 품질은 이번 조사에서 확인하지 못했다.
    why_ours: 회차 비교를 고유 차별점으로 내세우지 않고, 무엇을 바꿔서 연습했는지(바뀐 조건·유지한 조건)와 그 결과를 함께 남기는 비교에 집중한다.
  - how_used: SayNow의 말하기 훈련·성장 기록과 웹 피치·시간 도구를 사용한다.
    shortcoming: 웹 피치 도구에 긴 가상 내용을 입력했을 때 30초 버전이 예상 49초가 되어 사용자가 답변을 줄이라고 안내했다. 이 결과를 모바일 앱 전체의 한계로 확대하지 않는다.
    why_ours: 점수 추적보다 사용자가 설명한 어려움에 맞춘 준비물(핵심어 카드·전환 문장 등)과 연습 조건 시험을 제공하는 것을 목표로 한다. 앱 전체에 해당 기능이 없다는 주장은 하지 않는다.
personas:
- id: P1
  description: 10분 이상 11분 미만으로 발표를 마쳐야 하는 수업·팀 프로젝트의 대학생 본인이다. 발표할 때 긴장하며, 혼자 연습하면서 발표 내용·말하기 속도·제한 시간을 함께 관리해야 했다.
  source: 종이 문제정의 기록과 본인 경험(E1). 다른 대학생 인터뷰는 아직 수행하지 않았다.
experiences:
- id: E1
  when: 대학교 응용 프로젝트 발표를 준비할 때. 10분보다 짧거나 11분 이상이면 감점이어서, 내용을 잘 전달하면서 정해진 시간 안에 끝내야 했다.
  what_happened: '긴장하니 말이 빨라졌다. 발표 내용에 집중하다 보니 시간이 얼마나 지났고 얼마나 남았는지 확인하기 어려웠다.

    연습할 때와 실제 발표할 때의 말하는 속도가 달랐다. 시간을 확인하려고 화면이나 시계를 보면 설명하던 흐름이 끊겼고, 남은 시간을 알아도 어느 부분에서 속도를 조절해야 할지 바로 판단하기 어려웠다.

    실제 발표에서 제한 시간을 초과한 적도 있었고, 지정된 시간보다 짧게 끝낸 적도 있었다. 긴장해서 말이 빨라지면 10분을 채우지 못했고, 내용을 자세히 설명하다 보면 11분을 넘기기도 했다. 연습할 때 시간을 맞춰도 실제 발표에서는 말하는 속도와 설명하는 분량이 달라져서, 정해진 시간에 맞춰 마무리하기 어려웠다.

    연습할 때는 직접 녹음하고 웹캠으로 녹화한 뒤 다시 재생해 보며 점검했는데, 이 과정이 번거롭고 시간이 오래 걸렸다. 대사 암기 등 발표 준비를 포함해 대략 10시간이 들었다고 기억한다.'
  workaround: 대사를 외우고 휴대폰 스톱워치를 켜고 발표 대본을 읽으면서 시간을 쟀다. 10분 30초 정도를 목표로 잡고, 시간이 길면 설명을 줄이고 짧으면 필요한 내용을 보충하는 방식으로 연습했다. 또 직접 일일이 녹음하고 웹캠으로 녹화한 뒤, 다시 재생해 보며 점검했다.
  feeling: 준비한 내용을 너무 일찍 끝내는 건 아닌지 신경이 쓰였다. 녹음·녹화 후 직접 확인하는 과정에서 시간 부담을 느꼈다.
  quote: 되게 시간이 오래 걸렸어
  source: 본인의 발표 준비·발표 경험. 종이 문제정의 기록을 옮기고 학생 확인 후 기록했다(27eebf1). 준비 시간 약 10시간은 대략적인 기억이며, 실제 발표 종료 시각과 감점 여부는 확인되지 않았다.
