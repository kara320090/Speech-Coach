  name: '[기존 코드·실사용 검증 필요] 연습 결과와 같은 조건 비교'
  input: 같은 목표 시간·구간 계획으로 한 이전 연습 기록
  output: 총 연습 시간, 목표와의 차이(초과·일찍 끝남·허용 오차 안), 측정된 평균 속도, 검토 구간 수를 이전 연습과 나란히 보여 준다. 점수·개선율은 만들지 않는다.
  done: 비교할 이전 기록이 없으면 '아직 비교할 이전 기록이 없어요'가 보인다. 같은 조건으로 두 번째 연습을 끝내면 이전·이번 총 연습 시간과 변화가 표로 나온다. 측정하지 못한 값(예를 들어 속도)은 '비교
