  input: 연습 종료
  output: 긴 침묵(소리 기반), 반복 표현·속도 변화(음성 인식을 켠 경우), 구간 시간 차이를 시간 위치·측정값·근거와 함께 목록으로 보여 주고, 항목을 누르면 녹음·영상의 그 위치로 이동한다.
  done: 5초 무음이 든 녹음에서 '긴 침묵'이 해당 위치(±1초)·약 5초로 표시되고 항목을 누르면 재생 위치가 그 시각으로 이동한다. 소리가 거의 없는 녹음은 침묵 구간 대신 '소리가 거의 없다'고 알린다. 표시할
