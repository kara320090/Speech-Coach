five_whys:
  symptom: 고칠 구간을 알아도 다음 연습에서 무엇을 바꿔야 할지 정하기 어려운 이유는 무엇인가? (확장 문제 가설)
  whys:
  - 시간·반복 표현의 위치를 알아도 그 순간 어떤 어려움이 있었는지는 측정값만으로 알기 어렵기 때문이다. (?)
  - 같은 반복도 내용 기억, 구간 전환, 시간 확인 등 서로 다른 상황에서 나올 수 있기 때문이다. (?)
  - 사용자가 겪은 상황을 확인하지 않으면 원인과 맞지 않는 교정 지시를 줄 수 있기 때문이다. (?)
  - 확인한 상황에 맞춰 대본·단서·화면·연습 조건을 구체적으로 바꿔 볼 과정이 필요하기 때문이다. (?)
  - 바꾼 조건과 재연습의 결과를 연결해 확인하지 않으면 도움이 되는 방법을 판단하기 어렵기 때문이다. (?)
solution_paths:
- path: 웹에서 목표 시간·구간 계획을 설정하고 경과 시간·남은 시간·측정 가능한 속도를 표시한다.
  status: chosen
  reason: F1–F3 기본 기능. 기존 코드 유지. 타이머 자체를 고유 차별점으로 주장하지 않는다.
- path: 음성과 선택 웹캠 영상을 기록하고 검토 구간의 위치·근거·측정값과 이전 기록 비교를 제공한다.
  status: chosen
  reason: F4–F6 기본 기능. 수동 점검 부담을 줄이는 기반이며 실제 장치 검증은 별도 필요하다.
- path: 대본·필수 내용·목표 범위와 개인 실측을 연결해 수정안을 제시하고, 내용 보존 검사 및 수정 항목별 재연습으로 확인한다.
  status: chosen
  reason: F7–F11 개발 예정. 문장 수정·근거·재점검을 연결하는 제품 방향을 선택했다. 시장 독점성·효과는 미검증이다.
- path: 검토 구간의 관찰을 확인하고 짧은 질문으로 사용자가 겪은 상황을 파악한 뒤, 선택한 준비·화면·연습 조건을 바꾸어 재연습에서 확인한다.
  status: chosen
  reason: F13–F14 및 F11 확장 계획·미구현. 긴장을 자동 원인으로 단정하지 않고 사용자 설명과 실제 관찰을 구분한다. 질문을 건너뛰어도 연습 가능하다.
insight:
  claim: 발표 연습 자체뿐 아니라 녹음·영상에서 점검할 부분을 찾고 수정 후 다시 확인하는 과정에도 부담이 있었다.
  evidence: 본인은 직접 녹음·웹캠 녹화 후 다시 보았고 그 과정에 시간이 오래 걸렸다고 말했다. 대사 암기 등을 포함한 준비 전반은 약 10시간으로 기억하며 시간 초과·미달을 경험했다. 한 사람의 회고다.
  design_decision: 설치 없는 PC·노트북 웹으로 개발한다. 관찰 확인→사용자 설명→연습 조건 선택→재연습 비교를 핵심 흐름으로 계획한다. 개인 실측 기반 대본 수정·필수 내용 보존은 선택 가능한 조치로
    연결한다. 군말과 긴장의 예시는 사용자가 제시한 제품 방향이며 실제 원인이 확인된 경험으로 추가하지 않는다. 신규 기능은 미구현이며 감정 자동 판정·설치형 앱은 제외한다.
features:
- id: F1
  name: '[기존 코드·실사용 검증 필요] 연습 준비(목표·기준·계획·기록 방법 설정)'
  input: 목표 시간(분·초), 허용 오차(초), 임박 알림(남은 초), 목표 속도 범위(선택), 구간별 시간 계획(선택), 소리 기록·웹캠 영상 기록·음성 인식 분석 선택
  output: 설정에 맞는 연습 화면이 열린다. 목표 시간은 특정 값으로 정해져 있지 않고 매번 직접 입력한다.
  done: 목표 시간을 비우거나 구간 계획 줄 형식이 틀리면 연습이 시작되지 않고 이유와 줄 번호가 보인다. 올바르게 입력하면 연습이 시작된다.
- id: F2
  name: '[기존 코드·실사용 검증 필요] 실시간 발표 보조'
  input: 연습 시작·일시정지·다시 시작·종료 버튼
  output: 경과 시간과 남은 시간, 시간 상태(여유·임박·초과, 색과 글자), 음성 인식을 켠 경우 최근 20초 기준 말하기 속도(분당 한글 음절)와 목표 속도 범위 비교가 보인다.
  done: 목표 2초로 시작하면 2초가 지난 뒤 '목표 시간 초과'와 남은 시간 칸의 '초과 +'가 보인다. 일시정지한 시간은 연습 시간에서 빠진다. 음성 인식을 켜지 않았거나 지원되지 않으면 속도 칸에 '측정 안
    함/측정 불가'와 이유가 보이고 숫자는 보이지 않는다.
- id: F3
  name: '[기존 코드·실사용 검증 필요] 구간별 시간 계획 비교'
  input: 구간 이름과 시간 계획, 연습 중 '다음 구간' 버튼
  output: 연습 중 현재 구간의 계획 대비 진행과 앞 구간까지의 누적 차이, 결과 화면의 구간별 계획·실제·차이 표
  done: 구간 계획이 없으면 진행이 빠른지 느린지 판단하지 않는다고 표시한다. 계획이 있으면 '다음 구간'을 누른 시점으로 구간 실제 시간을 계산하고, 연습을 끝낼 때까지 진행한 구간은 '연습 종료까지'로, 시작하지
    못한 구간은 '진행 안 함'으로 표시한다.
- id: F4
  name: '[기존 코드·실사용 검증 필요] 소리·웹캠 영상 기록'
  input: 마이크 권한(웹캠은 선택)
  output: 연습 소리(WAV)와 선택한 경우 웹캠 영상이 이 브라우저 안에만 저장된다. 서버로 보내지 않는다. 선택한 브라우저 음성 인식은 제공 업체의 외부 서비스로 전송될 수 있어 별도 안내한다.
  done: 권한이 거부되거나 장치가 없으면 '녹음 없이 시간만 측정해요' 안내가 뜨고 연습은 계속되며, 결과에 기록이 없다고 알린다. 기록한 연습은 결과 화면에서 다시 재생할 수 있고 재생 길이가 연습 시간과 맞는다.
