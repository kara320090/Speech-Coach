five_whys:
  symptom: 연습을 반복해도 실제 발표에서 막힘과 시간 초과·미달이 되풀이되고, 연습 점검에 오래 걸리는 이유는 무엇인가?
  whys:
  - 긴장하면 말이 빨라지고, 내용 전달에 집중하느라 경과 시간과 남은 시간을 확인하지 못한다. (E1)
  - 시간을 확인하려고 화면이나 시계를 보면 설명 흐름이 끊기고, 남은 시간을 알아도 어느 부분에서 조절할지 바로 판단하기 어렵다. (E1)
  - 연습 후에는 녹음·영상을 처음부터 다시 보며 문제 구간을 직접 찾아야 해서 점검에 시간이 오래 걸린다. (E1)
  - 문제 구간을 찾아도 그 순간 무엇이 어려웠는지(대본을 숙지하지 못했는지, 다음 내용이 떠오르지 않았는지, 시간을 신경 썼는지)는 녹음과 측정값만으로 알 수 없고, 바꿔 본 것이 실제로 도움이 됐는지 같은 기준으로 전후를 비교하는 과정도 없어 "다음엔 잘 외워야지" 같은 다짐에 기대고 같은 연습을 반복한다. (E1·E2)
  - AI 도구로 만든 대본은 "대본이 있다"와 "내 말로 소화했다"가 다른 문제인데, 이해했다는 스스로의 판단을 실제 설명으로 확인하고 설명이 원문과 다른 부분을 짚어 주는 과정이 없어, 숙지하지 못한 구간이 실제 발표와 질의응답에서 다시 막힌다. (E2, MIT 2025, 안상희 2025)
solution_paths:
- path: >-
    핵심 루프 — 검토 구간을 보여 주고, 그 순간 무엇이 어려웠는지 짧게 묻고(최대 3개, 건너뛰기 가능), 바꿔 볼 조건 하나(핵심어 카드·전환 문장·시간 표시 방식·쉬운 표현 등)를 고른 뒤
    그 구간만 다시 연습해 전후를 나란히 비교한다.
  status: chosen
  reason: >-
    5 Whys 4단계에 직접 대응한다. E1은 "시계를 보면 흐름이 끊겼다"고 했으므로 시간 표시 방식 자체가 바꿔 볼 조건이 되고, A3의 "조금 빠르다" 같은 총평이 수정으로 이어지지 않는 문제를
    "무엇을 바꿨고 무엇이 달라졌나"로 대체한다. 긴장을 자동 원인으로 두지 않고 사용자 설명과 측정된 관찰을 구분한다. 사용자가 "뜻을 모르겠다"고 답하면 아래 이해 확인 경로로 이어진다.
    F13–F14·F11. 질문 3단계·구간 재연습·전후 비교는 S9로 확인한다.
- path: >-
    막힌 구간이나 사용자가 고른 낯선 표현에서 "이 부분을 잘 이해한 게 맞나요?"라고 묻고, "이해했다"는 답은 자기 말 설명과 원문·자료 기반 질문으로 다시 확인한다.
    설명을 반영해 대본을 말하기 쉬운 문장으로 다듬고 필수 수치·조건이 빠지지 않았는지 검사한 뒤, 예상 질문에 답해 보고 원문·설명·수정안·재답변을 나란히 비교한다.
  status: chosen
  reason: >-
    5 Whys 5단계, 즉 E2(AI 도구로 만든 대본을 숙지하지 못한 채 연습하다 막힘)와 MIT 2025 실험(LLM으로 쓴 글을 직후에도 인용하지 못함)에 대응한다. 대본·근거 자료·버전(F7)이 이 경로의 입력이다. "대본이 있다"와 "대본을 내 말로 소화했다"를 구분하는
    유일한 방법은 사용자가 직접 설명해 보게 하는 것이다. 불일치는 "설명과 원문이 다른 부분"으로만 보여 주고 원문에 없는 사실을 추가하지 않는다.
    코칭·전사는 공개 모델을 직접 실행하는 자체 서버(F20)에서 하고 기존 대본·답변·녹음은 외부 AI 제공자에게 보내지 않으며, 텍스트가 브라우저 밖에서 처리된다는 사실을 화면에 안내한다.
    F17(낯선 개념·근거)·F18(자기 말 설명)·F9–F10(쉬운 대본·보존 검사)·F19(예상 질문, 질의응답을 앞둔 부담에 대응·안상희 2025)가 첫 구현이고, 녹음 전사에서 막힌 구간을 자동으로 골라 연결하는 F15 4열 비교는 개발 예정이다.
- path: 연습 중 경과·남은 시간, 여유·임박·초과 상태(색과 글자), 구간별 계획 대비 진행을 한 화면에 보여 주고, 말하기 속도는 녹화 뒤 자체 전사로 계산한다.
  status: chosen
  reason: >-
    E1의 1·2단계(내용에 집중하면 시간을 놓치고, 시계를 보면 흐름이 끊김)에 대응한다. 숫자를 읽지 않아도 색만으로 상태를 알 수 있게 해 시선 이동을 줄이고, 10분 30초 같은 목표를 구간 단위로 쪼개
    어디서 늘고 줄었는지 보이게 한다. F1–F3, 구현됨(S1–S3).
- path: >-
    소리(선택 시 웹캠 영상)를 이 브라우저 안에 기록하고, 긴 침묵·속도 변화·반복 표현·군말 후보·구간 시간 차이·눈 깜빡임 증가를 재생 위치와 근거와 함께 목록으로 보여 주며,
    같은 조건의 이전 연습과 나란히 비교한다.
  status: chosen
  reason: >-
    E1의 3단계(녹음·영상을 처음부터 다시 보며 고칠 구간을 찾는 데 오래 걸림)에 대응한다. 항목을 누르면 그 위치로 바로 이동하므로 발표 길이만큼 다시 볼 필요가 없다.
    녹음·영상은 브라우저에 저장하고 가입·로그인 없이 바로 쓴다. 사용자가 자체 AI 전사를 켠 경우에만 소리 조각을 직접 운영하는 서버로 보내고 영상은 보내지 않는다(F16).
    군말·깜빡임·시선 이탈은 E1의 "시계를 보는 순간"처럼 흐름이 끊긴 자리를 찾아 주는 "관찰값"으로만 표시하고 점수·개선율·긴장 판정은 만들지 않는다. 처음부터 다시 보던 점검 시간을 줄이는 것이 목표이며 절감량은 실측 전이다. F4–F6·F16·F21, 구현됨(S4·S9).
- path: 개인 실측 속도와 최소·최대 발표 시간을 기준으로 대본 길이 조정 제안과 예상 시간을 계산한다.
  status: deferred
  reason: >-
    E1이 "길면 설명을 줄이고 짧으면 보충"하던 수작업에 대응하지만, 대본 길이는 막힘의 여러 원인 중 하나라 핵심 루프 안에서 필요할 때 고르는 조치로 둔다(D13).
    쉬운 표현 수정·보존 검사(F9–F10)는 이미 첫 구현이 있으므로, 실제 연습에서 잰 개인 속도를 예상 시간에 연결하는 F8만 R3로 미룬다.
- path: PPTX 슬라이드 노트 추출, 스캔 PDF의 OCR, 발표 자료 슬라이드 자동 조작으로 대본 입력을 확장한다.
  status: deferred
  reason: >-
    대본 입력은 TXT 불러오기·붙여넣기(화면 연결됨)와 TXT·PDF·DOCX 글자 꺼내기 API(POST /api/scripts/import, 백엔드 구현·화면 연결 전), 주제만 적어 초안을 받는 F22까지 2026-10-29~30에 만들었다(D05·D22).
    PPTX·OCR·슬라이드 조작은 핵심 루프를 검증한 뒤 후속 범위로 분리한다.
- path: 발표 점수·등급을 매기거나 감점·학점을 예측해 보여 준다.
  status: rejected
  reason: >-
    Talkli·SayNow가 이미 회차별 점수 추적을 제공하고(A6), A3의 "조금 빠르다"처럼 총평은 무엇을 바꿔야 할지 알려주지 않는다. 점수는 연습을 점수 올리기로 바꾸고
    내용을 빼서 군말을 줄이는 식의 왜곡을 낳는다. 대신 바꾼 조건과 측정값의 변화만 기록한다.
- path: 표정·자세·목소리·눈 깜빡임에서 긴장·불안 같은 심리 상태를 자동 판정해 원인으로 알려준다.
  status: rejected
  reason: >-
    녹음과 영상만으로는 그 순간 대본을 잊었는지, 시간을 신경 썼는지, 긴장했는지 구분할 수 없다(5 Whys 4단계). 틀린 원인을 단정하면 사용자는 엉뚱한 조건을 바꾸게 된다.
    원인은 사용자에게 묻고, 시선 이탈·군말·깜빡임 같은 측정값은 "관찰"로만 기록한다(D15).
- path: 발표 도중 실시간으로 대본을 고쳐 주거나 "속도를 줄이세요" 같은 지시를 띄운다.
  status: rejected
  reason: E1은 시계를 보는 것만으로도 설명 흐름이 끊겼다. 발표 중 텍스트 지시는 그보다 더 큰 끊김을 만든다. 연습 중 안내는 색과 상태 한 단어로 제한하고, 조정은 연습 뒤 루프에서 한다.
- path: 설치형 모바일·데스크톱 앱으로 만들거나, 사용자의 기존 대본·답변·녹음·영상을 외부 AI 제공자에게 보내 코칭·전사를 처리한다.
  status: rejected
  reason: >-
    연습 장소는 집·빈 강의실의 노트북이고 웹캠·마이크는 브라우저로 충분하다. 설치 없이 주소만 열면 바로 연습할 수 있어야 "연습 전 준비"가 또 하나의 부담이 되지 않는다(D01).
    대본·녹음은 발표 내용 그 자체라 외부 제공자에게 보내지 않고 공개 모델을 직접 실행한다(F20). 예외는 사용자가 직접 적은 발표 주제만 보내 새 초안을 받는 F22이며, 기존 대본·답변·녹음은 포함하지 않는다.
    자체 서버 처리도 브라우저 밖 전송이므로 처리 위치를 안내한다.
insight:
  claim: 시간 초과·미달은 "시간을 지키자"는 다짐과 반복 연습으로 해결되지 않았다. 시간을 확인하는 행동이 오히려 흐름을 끊었고, 연습 뒤에는 문제 구간을 직접 찾는 데 오래 걸렸으며, 찾은 구간에서 무엇을 바꿔 다시 연습할지는 아무 기록 없이
    스스로 정해야 했다. 여기에 AI 도구로 대본을 쉽게 만들 수 있게 되면서 "대본이 있다"와 "대본을 자기 말로 소화했다"가 별개의 문제가 됐다. 그래서 측정값을 보여 주는 데서 멈추지 않고, 막힌 순간의 이유를 사용자에게 묻고 조건 하나를 바꿔
    그 구간만 다시 연습해 전후를 비교하는 루프가 필요하다. 긴장 자체를 고치려 들지는 않는다. 신입생 조사에서 불안의 중심이 청중 평가보다 "내 수행을 통제하지 못할 것 같다"는 예측이었으므로(안상희 2025),
    무엇이 어려웠고 무엇을 바꾸면 달라지는지를 스스로 확인하게 해 통제감을 돌려주는 쪽을 택한다. 대본과 녹음은 발표 내용 그 자체라 외부 AI 제공자에게 기본으로 보내지 않고 공개 모델을 직접 실행한다.
  evidence: 'E1: 10분 이상 11분 미만 발표에서 10분 30초를 목표로 연습했지만 긴장하면 10분을 못 채웠고 자세히 설명하면 11분을 넘겼다. 시계를 보면 흐름이 끊겼고 연습과 실제의 속도가 달랐다. 녹음·웹캠 녹화를 처음부터 다시 보는
    점검이 오래 걸려 준비 전반에 약 10시간이 들었다. E2: 팀원들은 AI 도구로 만든 대본을 숙지하지 못한 채 연습하다 특정 구간에서 막혔고, 이해했다고 생각한 부분도 자기 말로 설명하면 원문과 달라졌다. 공개 조사: 영국 대학생 88%가 과제·평가에
    생성형 AI를 쓰고 18%는 AI 문장을 그대로 넣는다(HEPI 2025). LLM으로 쓴 글은 직후에도 자기 글을 인용하지 못했다(MIT 2025, 54명). 대중 연설 공포는 미국 성인 33.7%(Chapman 2025), 국내 신입생 266명은
    "수행 통제감 부족"이 불안의 중심이었다(안상희 2025). 경쟁 서비스 직접 확인: PT샌드백은 목표 시간을 바꿔도 대본이 그대로였고, SayNow 피치 도구는 30초 요청에 49초 분량을 내놓고 직접 줄이라고 안내했다. 두 서비스 모두 막힌 이유를
    묻고 조건을 바꿔 다시 시험하는 흐름은 확인되지 않았다.'
  design_decision: >-
    설치 없는 PC·노트북 웹으로 만든다. 실시간 시간 안내, 검토 구간 표시·재생, 같은 조건의 이전 연습 비교(F1–F6)와 자체 전사·군말·속도 측정(F16), 눈 깜빡임 측정(F21)은 구현했다.
    핵심 루프는 "관찰 확인 → 그때 무엇이 어려웠는지 질문(최대 3개, 건너뛰기 가능) → 바꿔 볼 조건 하나 선택 → 그 구간만 재연습 → 전후 비교"(F13–F14·F11, S9)다.
    "뜻을 모르겠다"는 답은 이해 확인으로 이어진다. 낯선 개념·근거 확인(F17) → 자기 말 설명(F18) → 쉬운 대본·필수 내용 보존 검사(F9–F10) → 예상 질문 답변(F19)을 첫 구현으로 제공하고,
    녹음 전사에서 막힌 구간을 자동으로 연결하는 4열 비교(F15)와 개인 실측 시간 기준(F8)은 그다음이다. 코칭·전사 모델은 외부 AI 제공자 없이 공개 모델을 직접 실행하며(F20) 텍스트가
    브라우저 밖에서 처리됨을 안내한다. 연습과 실제 발표의 속도 차이는 같은 조건 비교(F6)로 먼저 드러내고, 개인 실측 속도로 예상 시간을 계산하는 F8이 그다음이다. 기록은 사용자가 고른 범위만 JSON으로 내보낸다(F12).
    대본이 아직 없는 사용자는 주제만 적어 초안을 받을 수 있고(F22), 그 초안은 곧바로 이해 확인 루프로 들어온다. AI가 만든 대본을 그대로 외우는 A4의 반복을 막기 위해서이며, 이때도 기존 대본·답변·녹음은 보내지 않는다.
    점수·등급과 감정 자동 판정은 만들지 않고, 사용자의 설명과 측정된 관찰을 항상 구분해 기록한다.
features:
- id: F1
  name: 연습 준비(목표·기준·계획·기록 방법 설정)
  input: 목표 시간(분·초), 허용 오차(초), 임박 알림(남은 초), 목표 속도 범위(선택), 구간별 시간 계획(선택), 소리 기록·웹캠 영상 기록·분석 시 자체 AI 전사 선택
  output: 설정에 맞는 연습 화면이 열린다. 목표 시간은 특정 값으로 정해져 있지 않고 매번 직접 입력한다.
  done: 목표 시간을 비우거나 구간 계획 줄 형식이 틀리면 연습이 시작되지 않고 이유와 줄 번호가 보인다. 올바르게 입력하면 연습이 시작된다. 검증 흐름 — S1–S4·S9의 목표 시간 입력과 녹화 시작.
- id: F2
  name: 실시간 발표 보조
  input: 연습 시작·일시정지·다시 시작·종료 버튼
  output: 경과 시간과 남은 시간, 시간 상태(여유·임박·초과, 색과 글자)를 보여 준다. 말하기 속도는 녹화 종료 후 자체 AI 전사로 F16에서 계산하며, 녹화 중에는 종료 후 측정한다고 안내한다.
  done: 목표 2초를 넘으면 목표 시간 초과가 보이고 일시정지 시간은 연습 시간에서 빠진다. 녹화 중 외부 브라우저 음성 인식을 시작하지 않는다. 검증 흐름 — S1(시간 임박)·S2(목표 시간 초과, 초과 +).
- id: F3
  name: 구간별 시간 계획 비교
  input: 구간 이름과 시간 계획, 연습 중 '다음 구간' 버튼
  output: 연습 중 현재 구간의 계획 대비 진행과 앞 구간까지의 누적 차이, 결과 화면의 구간별 계획·실제·차이 표
  done: 구간 계획이 없으면 진행이 빠른지 느린지 판단하지 않는다고 표시한다. 계획이 있으면 '다음 구간'을 누른 시점으로 구간 실제 시간을 계산하고, 연습을 끝낼 때까지 진행한 구간은 '연습 종료까지'로, 시작하지 못한 구간은 '진행 안 함'으로
    표시한다. 검증 흐름 — S3(도입 0:02·본론 0:03, '다음 구간', 연습 종료까지).
- id: F4
  name: 소리·웹캠 영상 기록
  input: 마이크 권한, 선택 웹캠 영상 기록, 분석 시 자체 AI 전사 선택.
  output: 연습 소리(WAV)와 선택 영상은 브라우저에 저장한다. 자체 AI 전사를 켜고 분석을 누르면 소리 조각만 직접 운영하는 서버로 보내고 영상·얼굴 데이터는 보내지 않는다.
  done: 장치 없음·권한 거부에도 시간 측정을 계속하고, 저장한 기록을 다시 재생할 수 있다. 자체 AI 전사를 끄면 음성 전송이 없으며 전사 실패에도 원본 녹음·기본 결과를 유지한다. 검증 흐름 — S1–S4·S9는 마이크·카메라 없는 환경에서 끝까지 동작한다.
- id: F5
  name: 자동 점검 구간 표시와 구간 재생
  input: 연습 종료
  output: 긴 침묵(소리 기반), 반복 표현·속도 변화(자체 AI 전사를 완료한 경우), 구간 시간 차이를 시간 위치·측정값·근거와 함께 목록으로 보여 주고, 항목을 누르면 녹음·영상의 그 위치로 이동한다.
  done: 5초 무음이 든 녹음에서 '긴 침묵'이 해당 위치(±1초)·약 5초로 표시되고 항목을 누르면 재생 위치가 그 시각으로 이동한다. 소리가 거의 없는 녹음은 침묵 구간 대신 '소리가 거의 없다'고 알린다. 표시할 구간이 없을 때는 그 사실만 알리고
    평가하지 않는다. 검증 흐름 — S9(다시 볼 구간 목록에서 '계획보다 길어진 구간' 도입 항목 선택).
- id: F6
  name: 연습 결과와 같은 조건 비교
  input: 같은 목표 시간·구간 계획으로 한 이전 연습 기록
  output: 총 연습 시간, 목표와의 차이(초과·일찍 끝남·허용 오차 안), 측정된 평균 속도, 검토 구간 수를 이전 연습과 나란히 보여 준다. 점수·개선율은 만들지 않는다.
  done: 비교할 이전 기록이 없으면 '아직 비교할 이전 기록이 없어요'가 보인다. 같은 조건으로 두 번째 연습을 끝내면 이전·이번 총 연습 시간과 변화가 표로 나온다. 측정하지 못한 값(예를 들어 속도)은 '비교 불가'와 이유로 표시한다. 검증 흐름 — S4('아직 비교할 이전 기록이 없어요' → 두 번째 연습 뒤 이전·이번 비교 표).
- id: F7
  name: 대본·근거 자료·필수 내용·버전 관리 (초기 구현)
  input: TXT 파일로 불러오거나 직접 붙여넣은 대본(PDF·DOCX 글자 꺼내기 API는 화면 연결 전, 주제만 적어 받은 F22 초안 포함), 구간명, 필수 전달 항목, 항목의 근거 문장·수치·조건. 대본과 별도로 붙여넣은 근거 자료, 자료 제목·버전·출처 정보(사용자 입력).
  output: '`projectId`, `scriptVersionId`, `sectionId`, `requirementId`를 부여하고 원본 버전을 보존한다. 대본과 근거 자료를 구분하며 자료 문단에도 고정 ID를 부여한다. AI 대본 자체가 사실 검증된
    근거는 아니다.'
  done: TXT 파일 선택 또는 붙여넣기로 넣은 대본이 녹화 기록과 함께 저장되어 새로고침 후에도 파일명·수정 상태가 유지된다. 원문과 수정문을 동시에 조회하고 수정안을 버려도 원문을 복원할 수 있다. 버전을 바꾸면 기존 연습의 연결은 유지된다.
- id: F8
  name: 최소·최대 시간과 개인 실측 기준 (개발 예정)
  input: 최소·최대 발표 시간, 대본 버전, 실제 연습의 구간 시간·전사 및 사용자가 확인한 구간 대응.
  output: 허용 범위, 실제 초과·미달, 개인 기준 예상 시간 및 계산에 사용한 자료를 표시한다.
  done: 최소·최대 경계를 포함해 범위 내/미달/초과를 판정한다. 실측 자료가 없으면 개인화된 예측이라고 표시하지 않는다. 예상과 실제는 별도 필드다.
- id: F9
  name: 쉬운 말·목표에 맞춘 대본 수정 제안 (초기 구현)
  input: F7 대본·근거 자료·필수 항목, 선택한 낯선 개념·본인 설명. 시간 조정 시에만 F8 시간·실측을 추가한다.
  output: 쉬운 단어·짧은 문장·필요한 전문 용어의 풀이, 수정 이유·원문 근거·바뀐 부분을 제안한다. 시간 조정도 선택 가능하다. 원문은 보존하며 자료 없는 사실은 확인 필요로 남긴다.
  done: 사용자가 '쉬운 대본 제안'을 누른 뒤 의미 확인 체크 전에는 '새 버전으로 적용'이 비활성이고, 체크 후 적용하면 새 버전으로 저장되며 '처음 대본으로 되돌리기'가 새로고침 후에도 유지된다(자체 모델 환경). 사용자가 제안을 선택·거절·수정·되돌릴 수 있고, 모든 제안에 근거 구간과 적용 상태가 남는다. 예상 시간 충족만으로 완료 처리하지 않는다.
- id: F10
  name: 필수 내용 보존 검사 (초기 구현)
  input: 수정 전후 대본, 필수 항목 ID, 수치·단위·부정·조건을 포함한 제공 근거.
  output: 항목별 유지/누락/변경 의심/판단 불가, 해당 문장과 근거를 표시한다.
  done: 필수 수치 누락·단위 변경·부정 반전·조건 삭제를 포함한 검증 세트에서 잘못된 제안을 “유지”로 확정하지 않으며, 변경 의심을 숨긴 채 확정 저장하지 않는다.
- id: F11
  name: 수정 항목별 재연습과 전체 확인 (초기 구현)
  input: 이전 연습 ID·수정 항목 ID·선택 대본 버전·재연습 결과. 선택한 연습 조건·시험 ID와 선택적 사용자 부담 응답. 같은 개념·필수 근거의 자기 설명 및 예상 질문 응답 기록, 도움 제공 여부.
  output: 같은 항목의 해결/미해결/판단 불가와 발화 근거, 실제 시간 변화, 필수 내용 전달 상태를 표시한다. 구간 연습 이후 전체 연습을 별도로 수행한다. 조건 시험에서는 변화·부작용·비교 제한을 표시하며 원인 규명이나 극복 완료를 선언하지 않는다.
  done: 무엇을 고친 결과인지 추적되고, 전체 범위 충족은 전체 재연습 실측으로만 확정한다. 자동 판정과 사용자 확인 상태를 구분한다. 바꾸기로 한 조건과 의도하지 않은 조건 차이를 구분하고 한 회차로 인과를 확정하지 않는다. 같은 문장의 암기 재현과
    표현을 바꾼 질문에 대한 답변을 구분한다. 군말 감소만으로 이해 개선을 판정하지 않는다. 검증 흐름 — S9(연습 전후 비교 표에 이유·바꾼 조건·측정값, 점수 없음).
- id: F12
  name: 결과 내보내기와 보관 관리 (JSON 구현, HTML 후속)
  input: 내보낼 프로젝트·버전·연습·검토 결과 선택.
  output: 대본 버전·조건·측정값·근거·미측정 항목을 포함한 HTML/JSON 결과를 사용자가 저장한다. 영상 포함 여부는 별도 선택한다.
  done: 내보낸 문서에서 예상·실제·미검증 상태가 구분되고, 선택하지 않은 영상·음성을 포함하지 않는다. 복원 기능은 별도 구현 전까지 지원한다고 쓰지 않는다. 원인 질문 답변·걱정의 원문은 기본 내보내기에서 제외하고 사용자가 선택한 요약만 포함한다.
- id: F13
  name: 관찰 확인과 상황·원인 질문 (초기 구현, S9)
  input: 검토 구간·재생·전사, 사용자 관찰 확인·교정 및 선택적 상황 설명.
  output: 관찰과 본인 설명을 구분한 기록, 최대 3개의 짧은 질문과 사용자가 확인한 상황 요약. 긴장을 자동 추정하지 않는다. 사용자가 뜻을 모르겠다고 하거나 설명에서 근거와의 차이가 나타나면 F18 이해 확인으로 연결한다. 이해 부족을 자동 원인으로
    확정하지 않는다.
  done: 오탐·문제로 느끼지 않음·모르겠음·건너뛰기를 처리하고 기존 연습을 막지 않는다. 질문 횟수 제한을 지키며 예시를 실제 원인으로 저장하지 않는다. 검증 흐름 — S9(질문 1/3 '표시한 구간이 맞나요' → '다음 내용이 안 떠오름').
- id: F14
  name: 원인에 맞춘 연습 조건 설계와 시험 (초기 구현, S9)
  input: F13의 사용자 설명 또는 원인 미확인 상태, 선택한 조치·기준 연습·발표 환경 제약.
  output: 핵심어 카드·전환 단서·표시 방식 등 선택 가능한 조치, 적용·되돌리기, 바꾼 조건과 유지한 조건의 시험 기록. F11로 재연습 비교. 개념 풀이·쉬운 표현·자료 근거 카드·질문 연습도 선택 조치로 연결한다.
  done: 선택한 조치만 적용하고 원본을 보존한다. 반복 빈도·내용·실제 시간·선택적 부담을 함께 비교하며 무효·악화·판단 불가를 표시한다. 군말 0회나 원인 해결을 보장하지 않는다. 검증 흐름 — S9(제안된 '핵심어 카드' 선택 → '이 구간 다시 연습' → 전후 비교).
- id: F15
  name: 녹음 전사 기반 막힘 구간 자동 연결과 4열 교차검증 (개발 예정 — 이해 확인·다듬기 자체는 F17–F18·F9–F10으로 구현)
  input: F7 대본(사용자가 AI 도구로 만든 대본인지 선택 표시 가능), 연습 전사와 대본 구간 대응, 막힘·긴 침묵·반복·대본과 다른 발화 후보 구간, 이해 확인 질문 응답과 자기 말 설명, 원문 기반 확인 질문 답변.
  output: 녹음 전사와 대본 구간을 자동 대응시켜 막힘·긴 침묵·대본과 다른 발화 후보 구간을 고르고, 그 구간마다 “이 부분을 잘 이해하지 못한 것 같아요. 잘 이해한 게 맞나요?” 교차 확인 질문과 응답 기록. “이해했다”는 응답은 자기 말 설명과 원문 기반 확인 질문(핵심 개념·순서·수치·조건)으로 다시 교차검증해 설명과 원문이 다른
    부분을 표시한다. 응답에 따라 사용자 설명을 반영한 자연스러운 대본 다듬기 제안(원문 유지, 선택 적용) 또는 원문 근거의 핵심 정리. 원문·사용자 설명·수정안·재연습 발화 4열 교차검증 비교표.
  done: 사용자 응답 없이 “이해 부족”으로 저장하지 않는다. “이해했다”는 응답과 설명이 원문과 달라도 사용자가 속였다고 표시하지 않고 “설명과 원문이 다른 부분”으로 보여 준다. 선택하기 전에는 대본을 바꾸지 않고 적용·거절·되돌리기를 지원한다.
    의미 차이는 어느 쪽이 맞다고 단정하지 않고 확인 필요로 표시한다. 수정안은 F10 필수 내용 보존 검사 결과를 함께 보여 준 뒤에만 저장하며 원문에 없는 사실을 추가하지 않는다. 이해·숙지 완료를 보장하지 않는다.
- id: F16
  name: 메인 녹화·파일 불러오기 자체 전사와 군말·속도 측정
  input: 메인 녹화 종료 후 분석 또는 영상·소리 파일 불러오기, 자체 AI 전사 선택.
  output: 소리 조각을 자체 faster-whisper로 전사하고 브라우저에서 평균·구간 속도, 군말 후보 종류·횟수·시간 구간을 계산한다. 녹음·영상·결과는 브라우저에 저장하고 영상·얼굴은 전송하지 않는다.
  done: 합성 한국어 8초 WAV를 불러와 '분석 시작'하면 전사문·평균 속도(음절/분)·군말 후보 횟수·종류가 표시되고 새로고침 후에도 유지된다(자체 모델 환경). 녹음을 먼저 저장한 뒤 전사한다. 진행·취소·장치 없음·서버 꺼짐·한도·부분 실패를 처리하고 기존 결과를 유지한다. 일부만 전사되면 전체 속도·군말 수치를 미측정으로 표시하며, 전사 없음과 후보 0회를 구분한다. 실제 사람의 군말·전사 정확도는 별도 검증한다.
- id: F17
  name: 낯선 개념 후보와 자료 근거 연결 (초기 구현)
  input: 대본·근거 자료·선택 구간·사용자가 표시한 낯선 표현.
  output: 개념 ID, 원문 위치·인용, 근거 문단, 쉬운 풀이 초안과 확인 필요 항목. 어려움은 후보로 표시한다.
  done: 사용자가 '낯선 개념 살펴보기'를 누르면 개념 후보가 원문 인용과 함께 표시되고, 인용은 실제 입력 문장에 존재한다(자체 모델 환경). 인용은 실제 입력 문장에 존재해야 한다. 자료가 없으면 근거 없음으로 남기고 잘 아는 표현은 제외할 수 있다. 모델의 풀이를 검증된 사실로 표시하지 않는다.
- id: F18
  name: 자기 말로 설명하는 이해 확인 (초기 구현)
  input: F17 개념·근거와 사용자의 자기 설명 또는 모르겠음·건너뛰기.
  output: 설명에서 확인된 부분·보완할 부분·근거 문장·다음 한 단계. 상태는 근거와 부합/보완 필요/판단 불가/미응답이다.
  done: 사용자가 '내 말로 설명해 보기'를 고른 뒤 '답변 함께 확인'을 누르면 근거와 검토 초안이 표시되고, '이 검토가 맞아요'를 누르면 '전체 답변 1개'와 '사용자 확인 맞음'이 이력에 남아 새로고침 후에도 유지된다(자체 모델 환경). 군말·속도·표정·답변 길이로 이해를 판정하지 않는다. 뜻을 모르겠다고 하면 쉬운 설명을 바로 제공할 수 있고 질문을 반복 강요하지 않는다. 항목당 후속 질문은 기본 최대 3개이며 오답을 무조건 칭찬하지 않는다.
- id: F19
  name: 자료 기반 예상 질문과 답변 연습 (초기 구현)
  input: 대본·근거 자료·핵심 개념·사용자 답변·이전 연습 기록.
  output: 왜·어떻게·예시·한계 질문, 기준 근거, 답변에서 확인된 내용·빠진 내용·보완 제안. 기준 답변은 답하기 전 기본 숨긴다.
  done: 자료 없는 질문은 답변 불가/추가 자료 필요로 남긴다. 말 바꾼 동등 질문의 결과와 도움 사용 여부를 F11에 연결하며 실제 청중 질문이나 이해 향상을 예측·보장하지 않는다.
- id: F20
  name: 공개 모델 자체 실행과 처리 상태 (초기 구현)
  input: 운영자가 준비한 모델·실행기, 사용자가 처리 요청한 최소 대본·근거·답변. 선택 전사는 음성 조각만 사용.
  output: 자체 실행 모델의 구조화 결과, 모델·프롬프트 버전·처리 위치와 실패 이유. 초기 추가 학습은 없다.
  done: 외부 AI 제공자 호출·클라우드 자동 대체 없이 동작한다. 모델 없음·중단·한도·잘못된 출력에는 원문과 기본 연습을 보존한다. 자체 서버 처리도 브라우저 밖 전송임을 안내한다. 모델 미설치 환경에서도 S1–S4·S9가 끝까지 동작하고 coach 화면은 '모델 미연결'을 안내한다.
- id: F21
  name: 영상 눈 깜빡임 측정
  input: 연습 후 저장된 웹캠 영상 또는 불러온 영상, 사용자의 눈 깜빡임 분석 선택.
  output: 브라우저 내 MediaPipe로 깜빡임 횟수·분당 횟수·10초 구간·얼굴 측정 불가 비율과 이번 영상의 다른 구간 대비 증가 위치·측정값·계산 근거를 표시한다. 영상·얼굴은 전송하지 않는다.
  done: 얼굴 관측 5초·70% 미만이면 횟수 대신 측정 못 함과 이유를 표시한다. 모델 실패·취소에도 기존 결과를 유지한다. 증가 항목을 누르면 영상 위치로 이동한다. 점수·긴장·진단으로 해석하지 않는다. 합성 눈 계수로만 검사했고 실제 얼굴 정확도는 미검증이다.

- id: F22
  name: Gemini로 새 대본 초안 생성 (기존 대본 코칭과 분리)
  input: 사용자가 입력한 발표 주제(3~400자), 선택 근거 자료(최대 2400자), 새 대본 만들기 선택.
  output: Gemini 3.8 Flash가 만든 제목·대본 초안·확인할 내용. 기존 대본·답변·녹음·영상은 Gemini에 보내지 않는다.
  done: 초안 확인과 선택 적용 뒤 기존 대본·답변 이력을 보존한 새 버전으로 저장하고 자체 AI 이해 연습으로 이동한다. 코칭·전사는 Qwen·faster-whisper를 사용하며, Gemini 미설정·실패에도 기존 대본의 자체 AI 연습은 유지한다.
