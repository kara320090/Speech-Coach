five_whys:
  symptom: AI로 작성한 대본을 읽을 수 있어도 자기 말로 설명하거나 질문에 답하기 어려운 이유는 무엇인가? (새 문제 가설)
  whys:
  - 대본의 일부 용어와 주장 근거를 자신의 말로 설명할 만큼 이해하지 못한 경우가 있다. (?)
  - 표현이 어려운 부분을 외우거나 읽는 데 집중하고 뜻·관계·예외를 확인하지 못할 수 있다. (?)
  - 대본을 완성한 뒤 자기 설명과 예상 질문으로 이해를 점검하는 과정이 빠질 수 있다. (?)
  - 녹음의 머뭇거림·군말 위치만으로는 보완할 개념이나 준비 조건을 알기 어렵다. (?)
  - 개념 확인·쉬운 말 수정·근거 보존·질의응답·재확인이 연결되지 않아 다음 행동을 스스로 설계해야 할 수 있다. (?)
solution_paths:
- path: 대본과 근거 자료를 연결하고 낯선 개념 후보를 보여 준 뒤, 본인이 자기 말로 설명해 보도록 돕는다.
  status: chosen
  reason: F7·F17·F18 계획. 설명의 실제 내용과 원문 근거를 비교하고, 군말·표정으로 이해나 감정을 추정하지 않는다.
- path: 핵심 의미·수치·조건을 보존한 쉬운 표현과 예시를 제안하고, 자료에 근거한 예상 질문에 답한 뒤 다시 설명해 본다.
  status: chosen
  reason: F9–F11·F19 계획. 쉬운 대본을 받는 것에서 끝나지 않고 도움 없이 설명·답변한 결과까지 확인한다. 예시는 제공 근거 또는 명시한 가상 예시로 구분한다.
- path: 공개 모델을 개발자 PC 또는 직접 운영하는 서버에서 실행하고 초기에는 추가 학습 없이 프롬프트·자료 연결·검증 규칙을 개발한다.
  status: chosen
  reason: 사용자 선택. F20 및 자체 AI 설계. 외부 AI 제공자 호출과 클라우드 대체 경로 없이 동작해야 한다. 외부 Gateway 코드를 제거하고 자체 전사 worker로 전환했다. 텍스트 코칭 첫 구현은 별도 구현 범위 문서에 기록한다.
- path: 기존 시간·녹음·검토 구간·회차 비교와 짧은 상황 질문·연습 조건 시험을 보조 흐름으로 연결한다.
  status: chosen
  reason: F1–F6 및 F15–F16의 기존 코드 유지, F8·F12–F14 계획. 얼굴·군말 측정은 이해 상태나 정서의 판정 근거로 쓰지 않는다.
insight:
  claim: 대본을 유창한 문장으로 바꾸는 것과 발표자가 내용을 이해하는 것은 별도로 확인해야 한다. 자기 설명과 근거 있는 질문 응답을 통해 보완할 개념을 찾고 재연습으로 확인하는 방향을 선택한다.
  evidence: 사용자가 새 방향으로 “AI가 만든 어려운 대본을 이해하지 못하면 말이 어색해지거나 질문에 답하기 어렵다”는 문제 관찰을 제시했다. 개별 사례·빈도·원인·효과는 미검증이다. 기존 E1은 수동 녹음·웹캠 점검과 시간 관리 부담의 근거이며 AI 대본 이해 문제를 입증하지 않는다.
  design_decision: 설치 없이 쓰는 웹 서비스로, 자료·대본→개념 후보→자기 설명→쉬운 표현·근거 보존→질의응답→재설명·전체 연습을 설계한다. 초기에는 공개 모델을 직접 실행하고 추가 학습을 하지 않는다. 긍정적 피드백은 확인된 부분을 짚고 다음 행동을 제안하되 오답을 정답으로 칭찬하지 않는다. 새 텍스트 흐름과 자체 전사의 첫 구현을 만들었으며 전체 기획 수용 조건과 품질은 후속 검증한다.
features:
- id: F1
  name: 연습 준비(목표·기준·계획·기록 방법 설정)
  input: 목표 시간(분·초), 허용 오차(초), 임박 알림(남은 초), 목표 속도 범위(선택), 구간별 시간 계획(선택), 소리 기록·웹캠 영상 기록·음성 인식 분석 선택
  output: 설정에 맞는 연습 화면이 열린다. 목표 시간은 특정 값으로 정해져 있지 않고 매번 직접 입력한다.
  done: 목표 시간을 비우거나 구간 계획 줄 형식이 틀리면 연습이 시작되지 않고 이유와 줄 번호가 보인다. 올바르게 입력하면 연습이 시작된다.
- id: F2
  name: 실시간 발표 보조
  input: 연습 시작·일시정지·다시 시작·종료 버튼
  output: 경과 시간과 남은 시간, 시간 상태(여유·임박·초과, 색과 글자), 음성 인식을 켠 경우 최근 20초 기준 말하기 속도(분당 한글 음절)와 목표 속도 범위 비교가 보인다. 현재 자체 실행 방식에서는 실시간 브라우저 음성 인식을 끄며, 전사 기반 속도는 파일 불러오기 후 계산한다.
  done: 목표 2초로 시작하면 2초가 지난 뒤 '목표 시간 초과'와 남은 시간 칸의 '초과 +'가 보인다. 일시정지한 시간은 연습 시간에서 빠진다. 음성 인식을 켜지 않았거나 지원되지 않으면 속도 칸에 '측정 안 함/측정 불가'와 이유가 보이고 숫자는 보이지 않는다.
- id: F3
  name: 구간별 시간 계획 비교
  input: 구간 이름과 시간 계획, 연습 중 '다음 구간' 버튼
  output: 연습 중 현재 구간의 계획 대비 진행과 앞 구간까지의 누적 차이, 결과 화면의 구간별 계획·실제·차이 표
  done: 구간 계획이 없으면 진행이 빠른지 느린지 판단하지 않는다고 표시한다. 계획이 있으면 '다음 구간'을 누른 시점으로 구간 실제 시간을 계산하고, 연습을 끝낼 때까지 진행한 구간은 '연습 종료까지'로, 시작하지 못한 구간은 '진행 안 함'으로 표시한다.
- id: F4
  name: 소리·웹캠 영상 기록
  input: 마이크 권한(웹캠은 선택)
  output: 연습 소리(WAV)와 선택한 경우 웹캠 영상이 이 브라우저 안에만 저장된다. 서버로 보내지 않는다. 외부 제공자 처리 가능성이 있는 브라우저 음성 인식은 비활성화한다.
  done: 권한이 거부되거나 장치가 없으면 '녹음 없이 시간만 측정해요' 안내가 뜨고 연습은 계속되며, 결과에 기록이 없다고 알린다. 기록한 연습은 결과 화면에서 다시 재생할 수 있고 재생 길이가 연습 시간과 맞는다.
- id: F5
  name: 자동 점검 구간 표시와 구간 재생
  input: 연습 종료
  output: 긴 침묵(소리 기반), 반복 표현·속도 변화(음성 인식을 켠 경우), 구간 시간 차이를 시간 위치·측정값·근거와 함께 목록으로 보여 주고, 항목을 누르면 녹음·영상의 그 위치로 이동한다.
  done: 5초 무음이 든 녹음에서 '긴 침묵'이 해당 위치(±1초)·약 5초로 표시되고 항목을 누르면 재생 위치가 그 시각으로 이동한다. 소리가 거의 없는 녹음은 침묵 구간 대신 '소리가 거의 없다'고 알린다. 표시할 구간이 없을 때는 그 사실만 알리고 평가하지 않는다.
- id: F6
  name: 연습 결과와 같은 조건 비교
  input: 같은 목표 시간·구간 계획으로 한 이전 연습 기록
  output: 총 연습 시간, 목표와의 차이(초과·일찍 끝남·허용 오차 안), 측정된 평균 속도, 검토 구간 수를 이전 연습과 나란히 보여 준다. 점수·개선율은 만들지 않는다.
  done: 비교할 이전 기록이 없으면 '아직 비교할 이전 기록이 없어요'가 보인다. 같은 조건으로 두 번째 연습을 끝내면 이전·이번 총 연습 시간과 변화가 표로 나온다. 측정하지 못한 값(예를 들어 속도)은 '비교 불가'와 이유로 표시한다.
- id: F7
  name: 대본·필수 내용·버전 관리 (초기 구현·전체 수용 조건은 후속 검증)
  input: 직접 붙여넣은 대본, 구간명, 필수 전달 항목, 항목의 근거 문장·수치·조건. 대본과 별도로 붙여넣은 근거 자료, 자료 제목·버전·출처 정보(사용자 입력).
  output: '`projectId`, `scriptVersionId`, `sectionId`, `requirementId`를 부여하고 원본 버전을 보존한다. 대본과 근거 자료를 구분하며 자료 문단에도 고정 ID를 부여한다. AI 대본 자체가 사실 검증된 근거는 아니다.'
  done: 원문과 수정문을 동시에 조회하고 수정안을 버려도 원문을 복원할 수 있다. 버전을 바꾸면 기존 연습의 연결은 유지된다. 현재 구현 범위와 남은 차이는 docs/local-ai-implementation.md를 따른다.
- id: F8
  name: 최소·최대 시간과 개인 실측 기준 (개발 예정)
  input: 최소·최대 발표 시간, 대본 버전, 실제 연습의 구간 시간·전사 및 사용자가 확인한 구간 대응.
  output: 허용 범위, 실제 초과·미달, 개인 기준 예상 시간 및 계산에 사용한 자료를 표시한다.
  done: 최소·최대 경계를 포함해 범위 내/미달/초과를 판정한다. 실측 자료가 없으면 개인화된 예측이라고 표시하지 않는다. 예상과 실제는 별도 필드다.
- id: F9
  name: 쉬운 말·목표에 맞춘 대본 수정 제안 (초기 구현·전체 수용 조건은 후속 검증)
  input: F7 대본·근거 자료·필수 항목, 선택한 낯선 개념·본인 설명. 시간 조정 시에만 F8 시간·실측을 추가한다.
  output: 쉬운 단어·짧은 문장·필요한 전문 용어의 풀이, 수정 이유·원문 근거·바뀐 부분을 제안한다. 시간 조정도 선택 가능하다. 원문은 보존하며 자료 없는 사실은 확인 필요로 남긴다.
  done: 사용자가 제안을 선택·거절·수정·되돌릴 수 있고, 모든 제안에 근거 구간과 적용 상태가 남는다. 예상 시간 충족만으로 완료 처리하지 않는다. 현재 구현 범위와 남은 차이는 docs/local-ai-implementation.md를 따른다.
- id: F10
  name: 필수 내용 보존 검사 (초기 구현·전체 수용 조건은 후속 검증)
  input: 수정 전후 대본, 필수 항목 ID, 수치·단위·부정·조건을 포함한 제공 근거.
  output: 항목별 유지/누락/변경 의심/판단 불가, 해당 문장과 근거를 표시한다.
  done: 필수 수치 누락·단위 변경·부정 반전·조건 삭제를 포함한 검증 세트에서 잘못된 제안을 “유지”로 확정하지 않으며, 변경 의심을 숨긴 채 확정 저장하지 않는다. 현재 구현 범위와 남은 차이는 docs/local-ai-implementation.md를 따른다.
- id: F11
  name: 수정 항목별 재연습과 전체 확인 (초기 구현·전체 수용 조건은 후속 검증)
  input: 이전 연습 ID·수정 항목 ID·선택 대본 버전·재연습 결과. 선택한 연습 조건·시험 ID와 선택적 사용자 부담 응답. 같은 개념·필수 근거의 자기 설명 및 예상 질문 응답 기록, 도움 제공 여부.
  output: 같은 항목의 해결/미해결/판단 불가와 발화 근거, 실제 시간 변화, 필수 내용 전달 상태를 표시한다. 구간 연습 이후 전체 연습을 별도로 수행한다. 조건 시험에서는 변화·부작용·비교 제한을 표시하며 원인 규명이나 극복 완료를 선언하지 않는다.
  done: 무엇을 고친 결과인지 추적되고, 전체 범위 충족은 전체 재연습 실측으로만 확정한다. 자동 판정과 사용자 확인 상태를 구분한다. 바꾸기로 한 조건과 의도하지 않은 조건 차이를 구분하고 한 회차로 인과를 확정하지 않는다. 같은 문장의 암기 재현과 표현을 바꾼 질문에 대한 답변을 구분한다. 군말 감소만으로 이해 개선을 판정하지 않는다. 현재 구현 범위와 남은 차이는 docs/local-ai-implementation.md를 따른다.
- id: F12
  name: 결과 내보내기와 보관 관리 (초기 구현·전체 수용 조건은 후속 검증)
  input: 내보낼 프로젝트·버전·연습·검토 결과 선택.
  output: 대본 버전·조건·측정값·근거·미측정 항목을 포함한 HTML/JSON 결과를 사용자가 저장한다. 영상 포함 여부는 별도 선택한다.
  done: 내보낸 문서에서 예상·실제·미검증 상태가 구분되고, 선택하지 않은 영상·음성을 포함하지 않는다. 복원 기능은 별도 구현 전까지 지원한다고 쓰지 않는다. 원인 질문 답변·걱정의 원문은 기본 내보내기에서 제외하고 사용자가 선택한 요약만 포함한다. 현재 구현 범위와 남은 차이는 docs/local-ai-implementation.md를 따른다.
- id: F13
  name: 관찰 확인과 상황·원인 질문 (개발 예정)
  input: 검토 구간·재생·전사, 사용자 관찰 확인·교정 및 선택적 상황 설명.
  output: 관찰과 본인 설명을 구분한 기록, 최대 3개의 짧은 질문과 사용자가 확인한 상황 요약. 긴장을 자동 추정하지 않는다. 사용자가 뜻을 모르겠다고 하거나 설명에서 근거와의 차이가 나타나면 F18 이해 확인으로 연결한다. 이해 부족을 자동 원인으로 확정하지 않는다.
  done: 오탐·문제로 느끼지 않음·모르겠음·건너뛰기를 처리하고 기존 연습을 막지 않는다. 질문 횟수 제한을 지키며 예시를 실제 원인으로 저장하지 않는다.
- id: F14
  name: 원인에 맞춘 연습 조건 설계와 시험 (개발 예정)
  input: F13의 사용자 설명 또는 원인 미확인 상태, 선택한 조치·기준 연습·발표 환경 제약.
  output: 핵심어 카드·전환 단서·표시 방식 등 선택 가능한 조치, 적용·되돌리기, 바꾼 조건과 유지한 조건의 시험 기록. F11로 재연습 비교. 개념 풀이·쉬운 표현·자료 근거 카드·질문 연습도 선택 조치로 연결한다.
  done: 선택한 조치만 적용하고 원본을 보존한다. 반복 빈도·내용·실제 시간·선택적 부담을 함께 비교하며 무효·악화·판단 불가를 표시한다. 군말 0회나 원인 해결을 보장하지 않는다.
- id: F15
  name: 영상 눈 깜빡임 측정 (구현·실제 얼굴 정확도 미검증)
  input: 연습 후 저장된 웹캠 영상 또는 불러온 영상, 사용자의 눈 깜빡임 분석 선택.
  output: 브라우저 내 MediaPipe로 깜빡임 횟수·분당 횟수·10초 구간·얼굴 측정 불가 비율과 이번 영상의 다른 구간 대비 증가 위치·측정값·계산 근거를 표시한다. 영상·얼굴은 전송하지 않는다.
  done: 얼굴 관측 5초·70% 미만이면 횟수 대신 측정 못 함과 이유를 표시한다. 모델 실패·취소에도 기존 결과를 유지한다. 증가 항목을 누르면 영상 위치로 이동한다. 점수·긴장·진단으로 해석하지 않는다.
- id: F16
  name: 파일 불러오기·자체 전사·군말 후보 측정 (구현·실제 사람 음성 품질 미검증)
  input: 영상·소리 파일과 목표 시간, 사용자가 선택한 글자 변환. 기존 연습의 음성 인식 전사도 군말 집계에 사용할 수 있다.
  output: 사용자가 켠 음성 조각을 직접 운영하는 전사 worker에서 처리한 뒤, 브라우저에서 군말 후보 종류·횟수·전사 구간을 계산한다. 영상은 보내지 않고 외부 AI 제공자도 호출하지 않는다.
  done: 부분 문자열 제외·0/미측정 구분·구간 이동·크기/누적 길이/실패 처리. 자체 worker가 없으면 전사만 사용할 수 없다. 실제 군말 정답·정서적 원인으로 단정하지 않는다. 실제 worker의 합성 무음 처리만 확인했고 실제 사람 음성 품질은 미검증이다.
- id: F17
  name: 낯선 개념 후보와 자료 근거 연결 (초기 구현·전체 수용 조건은 후속 검증)
  input: 대본·근거 자료·선택 구간·사용자가 표시한 낯선 표현.
  output: 개념 ID, 원문 위치·인용, 근거 문단, 쉬운 풀이 초안과 확인 필요 항목. 어려움은 후보로 표시한다.
  done: 인용은 실제 입력 문장에 존재해야 한다. 자료가 없으면 근거 없음으로 남기고 잘 아는 표현은 제외할 수 있다. 모델의 풀이를 검증된 사실로 표시하지 않는다. 현재 구현 범위와 남은 차이는 docs/local-ai-implementation.md를 따른다.
- id: F18
  name: 자기 말로 설명하는 이해 확인 (초기 구현·전체 수용 조건은 후속 검증)
  input: F17 개념·근거와 사용자의 자기 설명 또는 모르겠음·건너뛰기.
  output: 설명에서 확인된 부분·보완할 부분·근거 문장·다음 한 단계. 상태는 근거와 부합/보완 필요/판단 불가/미응답이다.
  done: 군말·속도·표정·답변 길이로 이해를 판정하지 않는다. 뜻을 모르겠다고 하면 쉬운 설명을 바로 제공할 수 있고 질문을 반복 강요하지 않는다. 항목당 후속 질문은 기본 최대 3개이며 오답을 무조건 칭찬하지 않는다. 현재 구현 범위와 남은 차이는 docs/local-ai-implementation.md를 따른다.
- id: F19
  name: 자료 기반 예상 질문과 답변 연습 (초기 구현·전체 수용 조건은 후속 검증)
  input: 대본·근거 자료·핵심 개념·사용자 답변·이전 연습 기록.
  output: 왜·어떻게·예시·한계 질문, 기준 근거, 답변에서 확인된 내용·빠진 내용·보완 제안. 기준 답변은 답하기 전 기본 숨긴다.
  done: 자료 없는 질문은 답변 불가/추가 자료 필요로 남긴다. 말 바꾼 동등 질문의 결과와 도움 사용 여부를 F11에 연결하며 실제 청중 질문이나 이해 향상을 예측·보장하지 않는다. 현재 구현 범위와 남은 차이는 docs/local-ai-implementation.md를 따른다.
- id: F20
  name: 공개 모델 자체 실행과 처리 상태 (초기 구현·전체 수용 조건은 후속 검증)
  input: 운영자가 준비한 모델·실행기, 사용자가 처리 요청한 최소 대본·근거·답변. 선택 전사는 음성 조각만 사용.
  output: 자체 실행 모델의 구조화 결과, 모델·프롬프트 버전·처리 위치와 실패 이유. 초기 추가 학습은 없다.
  done: 외부 AI 제공자 호출·클라우드 자동 대체 없이 동작한다. 모델 없음·중단·한도·잘못된 출력에는 원문과 기본 연습을 보존한다. 자체 서버 처리도 브라우저 밖 전송임을 안내한다. 모델 미설치 환경에서 기존 S1–S4가 끝까지 동작한다. 현재 구현 범위와 남은 차이는 docs/local-ai-implementation.md를 따른다.
