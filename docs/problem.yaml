# 현재 명세 20개. 제출 S1–S6·S8·S9는 실제 UI·실제 Gateway 결과를 확인하며, 녹화 입력 재생은 별도 미디어 증빙이다.
# 완료 조건은 관찰 가능한 현재 동작이다. 후속 시간 예측·자동 연결/4열 비교는 보류 해법, 해석 범위는 output·decisions.md에 둔다.
statement: 발표를 앞둔 대학생은 혼자 연습할 때 내용을 말하면서 시간과 속도를 함께 살피기 어렵고, 시계를 보는 순간 설명 흐름이 끊긴다. 연습 뒤에는 녹음·영상을 처음부터 다시 보며 고칠 구간을 찾아야 하고, 찾아도 그 순간 왜 막혔는지(대본 숙지·기억·시간 확인)를 알 수 없어 약 10시간을 준비하고도 실제 발표에서
  시간 초과와 미달을 반복한다.
canvas:
  context: 수업·팀 프로젝트 발표를 앞두고 집이나 빈 강의실에서 혼자 연습할 때 생긴다. 발표는 "10분 이상 11분 미만"처럼 범위가 정해져 있고 벗어나면 감점이다. 긴장하면 말이 빨라지고, 내용에 집중하면 시간이 얼마나 지났는지 놓치며, 시간을 보려고 화면이나 시계로 눈을 돌리면 설명하던 흐름이 끊긴다. 연습과
    실제 발표의 말하기 속도가 달라서 연습 때 시간을 맞춰도 실제에서는 초과하거나 일찍 끝난다. 연습 뒤에는 휴대폰 녹음과 웹캠 녹화를 처음부터 다시 틀어 보며 고칠 부분을 찾는다. 최근에는 AI 도구로 발표 자료와 대본을 먼저 만들고 연습하는 경우가 많아, 대본은 금방 생기지만 문장을 숙지하지 못한 채 연습하게 되고 그
    부분에서 말이 막힌다(팀원 진술). 영국 대학생 조사(HEPI 2025)에서는 92%가 생성형 AI를 쓰고 88%가 과제·평가에 쓰며 18%는 AI가 만든 문장을 과제에 그대로 넣었다. 국내에서는 2024년 한 해 검사된 문서 174만 건 중 55.9%에서 챗GPT 사용이 감지됐다(무하유).
  customer: 수업·팀 프로젝트에서 발표를 맡은 대학생이다. 발표 경험이 많지 않고, 짧은 준비 기간 안에 다른 사람 도움 없이 정해진 시간에 맞춰 혼자 점검하고 고쳐야 한다. 특히 AI 도구로 만든 자료·대본을 자기 말로 소화해 발표해야 하는 학생이 핵심 대상이다.
  root_problem: 발표 중에는 내용 전달에 집중하느라 속도와 시간을 동시에 점검할 수 없고, 시간을 확인하는 행동 자체가 흐름을 끊는다. 연습 뒤에는 녹음·시간 기록·고칠 내용이 따로 흩어져 있어 문제 구간을 직접 찾아야 하고, 찾아도 그 순간 어려웠던 이유(대본을 숙지하지 못했는지, 다음 내용이 떠오르지 않았는지,
    시간을 신경 썼는지)가 어디에도 남지 않는다. 그래서 다음 연습에서 무엇을 바꿔야 할지 모른 채 "다시 외우자"는 다짐으로 같은 연습을 반복한다.
  impact:
    feeling: '"되게 시간이 오래 걸렸어." 직접 녹음·녹화하고 다시 돌려 보는 과정이 부담이었고, 발표를 앞두고는 준비한 내용을 너무 일찍 끝내는 건 아닌지 계속 신경이 쓰였다(E1). 대본을 숙지하지 못한 채 발표를 앞두면 긴장이 커지고 자신감이 떨어진다(E2, 팀원 진술).'
    measurable: E1의 발표는 10분 이상 11분 미만을 벗어나면 감점이었다. 10분 30초를 목표로 스톱워치를 켜고 연습했지만 실제 발표에서 11분을 넘긴 적과 10분을 못 채운 적이 모두 있었다. 대사 암기, 녹음·웹캠 녹화, 반복 점검을 포함한 준비에 약 10시간이 들었다고 기억한다(회고 추정). 녹화를 점검할
      때는 영상을 처음부터 끝까지 다시 봐야 했다. 대중 연설은 미국 성인 33.7%가 "두렵다·매우 두렵다"고 답한 공포(Chapman 2025)이고, 국내 대학 신입생 266명 조사(2025)에서는 그 불안이 청중의 평가보다 자기 수행을 통제하지 못할 것이라는 예측에서 더 크게 나왔다. MIT 미디어랩 실험(2025,
      54명)에서 LLM으로 글을 쓴 참가자는 직후에도 자기 글을 정확히 인용하지 못했다. AI로 만든 대본을 "내 말"로 소화하지 못하는 문제의 실험 근거다.
  alternatives:
  - how_used: 휴대폰으로 녹음하고 웹캠으로 녹화한 뒤 처음부터 다시 재생하며 고칠 부분을 메모한다. (A1, E1)
    shortcoming: 고칠 구간을 직접 찾아야 하고, 고친 뒤 나아졌는지는 두 영상을 다시 비교해야 알 수 있다. 발표 길이만큼 다시 보는 시간이 매번 든다.
    why_ours: 긴 침묵·속도 변화·반복 표현·구간 시간 차이를 재생 위치와 근거와 함께 목록으로 보여 주고 누르면 그 위치로 바로 이동한다(F5, 구현됨). 그 구간에서 무엇이 어려웠는지 물은 뒤 조건을 바꿔 그 구간만 다시 연습하고 전후를 나란히 비교한다(F13–F14·F11).
  - how_used: 스톱워치로 전체 시간을 재며 대본을 읽고, 길면 설명을 줄이고 짧으면 보충한다. (A2, E1)
    shortcoming: 총 시간만 알 수 있어 어느 구간에서 늘고 줄었는지 모르고, 시간을 보려고 시계를 볼 때마다 흐름이 끊긴다.
    why_ours: 구간별 계획과 실제를 연습 중·후에 보여 주고(F3, 구현됨), 시계를 보는 행동이 흐름을 끊는 경우 시간 표시 방식 자체를 바꿔 시험할 수 있게 한다(F14).
  - how_used: 친구나 팀원 앞에서 발표하고 말투·속도·시간에 대한 의견을 받는다. (A3, 종이 기록)
    shortcoming: 상대와 시간을 맞춰야 하고, "조금 빠르다" 같은 총평만 받으면 어디를 어떻게 고칠지로 이어지지 않는다.
    why_ours: 혼자 연습해도 구간별 측정값과 근거가 남고, 사람 앞 연습을 원하면 하나의 연습 조건으로 기록해 혼자 연습과 비교할 수 있게 한다(F14).
  - how_used: AI 도구로 발표 자료와 대본을 만든 뒤 그대로 읽거나 외워서 연습한다. (A4, 팀원 진술)
    shortcoming: 대본은 빨리 생기지만 글말이라 소리 내어 말하기 어색하고, 깊이 이해하지 못한 문장에서 막혀도 무엇을 다시 봐야 할지 모른다.
    why_ours: 막힌 구간이나 낯선 표현에서 "이 부분을 잘 이해한 게 맞나요?"라고 확인하고, 이해했다는 답은 자기 말 설명과 원문·자료 기반 질문으로 다시 확인한다(F17–F18). 설명을 반영해 대본을 말하기 쉬운 문장으로 다듬고 필수 내용이 빠지지 않았는지 검사하며(F9–F10), 원문·설명·수정안·재답변을
      나란히 비교한다(F19·F11).
  - how_used: PT샌드백으로 장표별 시간을 설정하고 대본을 편집하며 연습한다. (A5)
    shortcoming: 2026-10-29 직접 확인한 무료 경로에서 목표 시간을 1분에서 2분으로 바꾸고 균등 배분해도 대본은 그대로였다. 시간을 나눠 주지만 연습에서 막힌 이유를 묻거나 조건을 바꿔 다시 시험하는 흐름은 없었다.
    why_ours: 시간 배분 도구와 경쟁하지 않는다. 연습에서 관찰된 구간의 당시 상황을 확인하고 준비·연습 조건을 하나씩 바꿔 재연습으로 비교하는 데 집중한다. 대본 수정은 그중 필요할 때 고르는 조치다.
  - how_used: Talkli·SayNow로 속도·반복을 점검하고 회차별 점수·기록을 비교한다. (A6)
    shortcoming: 회차 비교와 점수 추적은 이미 제공한다. 그러나 SayNow 웹 피치 도구에 30초 분량을 요청했을 때 예상 49초짜리 결과가 나와 사용자가 직접 줄이라고 안내했고, 어느 부분에서 왜 막혔는지를 다루는 흐름은 공식 설명에서 확인하지 못했다.
    why_ours: 점수를 매기지 않는다. 무엇을 바꿔서 연습했는지(바꾼 조건·유지한 조건)와 그 결과를 함께 남기는 비교, 그리고 사용자가 설명한 어려움에 맞춘 준비물(핵심어 카드·전환 문장)을 제공한다.
personas:
- id: P1
  description: 10분 이상 11분 미만으로 끝내야 하는 수업·팀 프로젝트 발표를 맡은 대학생. 발표할 때 긴장하고, 혼자 연습하면서 내용·속도·제한 시간을 함께 관리해야 했다.
  source: 종이 문제정의 기록과 본인 경험(E1), 학생 확인 후 기록(27eebf1).
- id: P2
  description: AI 도구로 발표 자료와 대본을 먼저 만들고 그 대본으로 연습하는 대학생. 대본 문장을 완벽히 숙지하지 못한 채 연습해 특정 구간에서 말이 막히고, 발표를 앞두고 긴장과 자신감 저하를 겪는다.
  source: 2026-10-29 팀원 진술(E2). 생성형 AI 사용 보편화(HEPI 2025, 무하유 2024)와 AI로 쓴 글을 기억하지 못하는 실험 결과(MIT 2025)가 뒷받침한다. 국내 대학생의 발표 대본 기준 비율은 미조사.
experiences:
- id: E1
  when: 대학교 응용 프로젝트 발표를 준비할 때. 10분보다 짧거나 11분 이상이면 감점이어서, 내용을 잘 전달하면서 정해진 범위 안에 끝내야 했다.
  what_happened: 긴장하니 말이 빨라졌다. 발표 내용에 집중하다 보니 시간이 얼마나 지났고 얼마나 남았는지 확인하기 어려웠다. 시간을 확인하려고 화면이나 시계를 보면 설명하던 흐름이 끊겼고, 남은 시간을 알아도 어느 부분에서 속도를 조절해야 할지 바로 판단하기 어려웠다. 연습할 때와 실제 발표할 때 말하는 속도가
    달랐다. 긴장해서 말이 빨라지면 10분을 채우지 못했고, 내용을 자세히 설명하다 보면 11분을 넘겼다. 연습 때 시간을 맞춰도 실제에서는 속도와 설명 분량이 달라져 범위 안에 마무리하기 어려웠다. 연습은 직접 녹음하고 웹캠으로 녹화한 뒤 다시 재생해 보며 점검했는데, 번거롭고 시간이 오래 걸렸다. 대사 암기까지 포함해
    준비에 대략 10시간이 들었다고 기억한다.
  workaround: 대사를 외우고 휴대폰 스톱워치를 켠 채 대본을 읽으며 시간을 쟀다. 10분 30초를 목표로 잡고 길면 설명을 줄이고 짧으면 내용을 보충했다. 녹음·웹캠 녹화를 처음부터 다시 재생하며 점검했다.
  feeling: 준비한 내용을 너무 일찍 끝내는 건 아닌지 신경이 쓰였다. 녹음·녹화 후 직접 확인하는 과정이 시간 부담이었다.
  quote: 되게 시간이 오래 걸렸어
  source: 본인의 발표 준비·발표 경험. 종이 문제정의 기록을 옮기고 학생 확인 후 기록(27eebf1). 준비 시간 약 10시간은 회고 추정이며 실제 종료 시각과 감점 여부는 기록이 없다.
- id: E2
  when: 2026-10-29 해커톤 팀 회의에서 최근 발표 준비 방식을 이야기할 때.
  what_happened: AI 에이전트로 발표 자료와 대본을 만드는 경우가 많아졌다. 자료와 문장은 빨리 완성되지만 대본을 깊이 이해하거나 완벽히 숙지하지 못한 채 연습하게 되고, 숙지하지 못한 부분에서 대본이 떠오르지 않아 말이 막힌다. 대본이 글말이라 소리 내어 말하기도 어색하다. 스스로는 이해했다고 생각해도 막상
    자기 말로 설명하면 원문과 달라지는 경우가 있다.
  workaround: 막힌 부분을 다시 외우거나 대본을 그대로 읽는다.
  feeling: 대본을 숙지하지 못한 채 발표를 앞두면 긴장이 커지고 자신감이 떨어진다.
  quote: null
  source: 2026-10-29 팀원 진술(decisions.md D18·D19). 몇 명 중 몇 명이 겪는지는 조사 전이다.
