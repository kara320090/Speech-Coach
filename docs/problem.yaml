five_whys:
  symptom: 연습을 반복해도 실제 발표에서 막힘과 시간 초과·미달이 되풀이되고, 연습 점검에 오래 걸리는 이유는 무엇인가?
  whys:
  - 긴장하면 말이 빨라지고, 내용 전달에 집중하느라 경과 시간과 남은 시간을 확인하지 못한다. (E1)
  - 시간을 확인하려고 화면이나 시계를 보면 설명 흐름이 끊기고, 남은 시간을 알아도 어느 부분에서 조절할지 바로 판단하기 어렵다. (E1)
  - 연습 후에는 녹음·영상을 처음부터 다시 보며 문제 구간을 직접 찾아야 해서 점검에 시간이 오래 걸린다. (E1)
  - 문제 구간을 찾아도 그 순간 무엇이 어려웠는지(대본을 숙지하지 못했는지, 다음 내용이 떠오르지 않았는지, 시간을 신경 썼는지)는 녹음과 측정값만으로 알 수 없어 무엇을 바꿀지 스스로 정해야 한다. (E1·E2, MIT 2025)
  - 바꿔 본 것이 실제로 도움이 됐는지 같은 기준으로 전후를 비교하는 과정이 없어, "다음엔 잘 외워야지" 같은 다짐에 기대고 같은 연습을 반복한다. (E1·E2)
solution_paths:
- path: 핵심 루프 — 검토 구간을 보여 주고, 그 순간 무엇이 어려웠는지 짧게 묻고(최대 3개, 건너뛰기 가능), 바꿔 볼 조건 하나(핵심어 카드·전환 문장·시간 표시 방식·쉬운 표현 등)를 고른 뒤 그 구간만 다시 연습해 전후를 나란히 비교한다.
  status: chosen
  reason: 5 Whys 4·5단계에 직접 대응한다. E1은 "시계를 보면 흐름이 끊겼다"고 했으므로 시간 표시 방식 자체가 바꿔 볼 조건이 되고, A3의 "조금 빠르다" 같은 총평이 수정으로 이어지지 않는 문제를 "무엇을 바꿨고 무엇이 달라졌나"로 대체한다. 긴장을 자동 원인으로 두지 않고 사용자 설명과 측정된 관찰을
    구분한다. 사용자가 "뜻을 모르겠다"고 답하면 아래 이해 확인 경로로 이어진다. F13–F14·F11. 질문 3단계·구간 재연습·전후 비교는 S9로 확인한다.
- path: 막힌 구간이나 사용자가 고른 낯선 표현에서 "이 부분을 잘 이해한 게 맞나요?"라고 묻고, "이해했다"는 답은 자기 말 설명과 원문·자료 기반 질문으로 다시 확인한다. 설명을 반영해 대본을 말하기 쉬운 문장으로 다듬고 필수 수치·조건이 빠지지 않았는지 검사한 뒤, 예상 질문에 답해 보고 원문·설명·수정안·재답변을
    나란히 비교한다.
  status: chosen
  reason: E2(AI 도구로 만든 대본을 숙지하지 못한 채 연습하다 막힘)와 MIT 2025 실험(LLM으로 쓴 글을 직후에도 인용하지 못함)에 대응한다. "대본이 있다"와 "대본을 내 말로 소화했다"를 구분하는 유일한 방법은 사용자가 직접 설명해 보게 하는 것이다. 불일치는 "설명과 원문이 다른 부분"으로만 보여 주고
    원문에 없는 사실을 추가하지 않는다. 운영자의 설정에 따라 자체 공개 모델 또는 주최 측 Gateway(F20)를 사용하고 실제 모델·처리 위치·전송 범위를 화면에 안내한다. 채점 환경은 Gateway 키로 텍스트를 처리하며 영상·얼굴은 보내지 않는다. F17(낯선 개념·근거)·F18(자기 말 설명)·F9–F10(쉬운
    대본·보존 검사)·F19(예상 질문)가 첫 구현이고, 개념·수정·질문·자기 설명의 기본 흐름은 S8에서 확인하고, 녹음 전사 기반 자동 연결·4열 비교의 확장 범위는 보류 해법에서 다룬다.
- path: 연습 중 경과·남은 시간, 여유·임박·초과 상태(색과 글자), 구간별 계획 대비 진행을 한 화면에 보여 주고, 말하기 속도는 녹화 뒤 자체 전사로 계산한다.
  status: chosen
  reason: E1의 1·2단계(내용에 집중하면 시간을 놓치고, 시계를 보면 흐름이 끊김)에 대응한다. 숫자를 읽지 않아도 색만으로 상태를 알 수 있게 해 시선 이동을 줄이고, 10분 30초 같은 목표를 구간 단위로 쪼개 어디서 늘고 줄었는지 보이게 한다. F1–F3, 구현됨(S1–S3).
- path: 소리(선택 시 웹캠 영상)를 이 브라우저 안에 기록하고, 긴 침묵·속도 변화·반복 표현·군말 후보·구간 시간 차이·눈 깜빡임 증가를 재생 위치와 근거와 함께 목록으로 보여 주며, 같은 조건의 이전 연습과 나란히 비교한다.
  status: chosen
  reason: E1의 3단계(녹음·영상을 처음부터 다시 보며 고칠 구간을 찾는 데 오래 걸림)에 대응한다. 항목을 누르면 그 위치로 바로 이동하므로 발표 길이만큼 다시 볼 필요가 없다. 녹음·영상은 브라우저에 저장하고 가입·로그인 없이 바로 쓴다. 사용자가 자체 AI 전사를 켠 경우에만 소리 조각을 서버에 설정된 전사 제공자로
    보내고 영상은 보내지 않는다(F16). 군말·깜빡임은 "관찰값"으로만 표시하고 점수·개선율·긴장 판정은 만들지 않는다. F4–F6·F16·F21, 구현됨(S4·S6).
- path: 개인 실측 속도와 최소·최대 발표 시간을 기준으로 대본 길이 조정 제안과 예상 시간을 계산한다.
  status: deferred
  reason: E1이 "길면 설명을 줄이고 짧으면 보충"하던 수작업에 대응하지만, 대본 길이는 막힘의 여러 원인 중 하나라 핵심 루프 안에서 필요할 때 고르는 조치로 둔다(D13). 쉬운 표현 수정·보존 검사(F9–F10)는 이미 첫 구현이 있으므로, 실제 연습에서 잰 개인 속도를 예상 시간에 연결하는 범위는 후속으로 미룬다.
    녹음 전사 기반 막힘 자동 연결·원문/설명/수정안/재연습 발화 4열 교차 비교도 기본 흐름을 검증한 뒤 확장한다.
- path: PPTX 슬라이드 노트 추출, 스캔 PDF의 OCR, 발표 자료 슬라이드 자동 조작으로 대본 입력을 확장한다.
  status: deferred
  reason: 대본 입력은 TXT 불러오기·붙여넣기(화면 연결됨)와 TXT·PDF·DOCX 글자 꺼내기(POST /api/scripts/import, 스튜디오 화면 연결됨), 주제만 적어 초안을 받는 F22까지 2026-10-29~30에 만들었다(D05·D22). PPTX·OCR·슬라이드 조작은 핵심 루프를 검증한 뒤 후속
    범위로 분리한다.
- path: 발표 점수·등급을 매기거나 감점·학점을 예측해 보여 준다.
  status: rejected
  reason: Talkli·SayNow가 이미 회차별 점수 추적을 제공하고(A6), A3의 "조금 빠르다"처럼 총평은 무엇을 바꿔야 할지 알려주지 않는다. 점수는 연습을 점수 올리기로 바꾸고 내용을 빼서 군말을 줄이는 식의 왜곡을 낳는다. 대신 바꾼 조건과 측정값의 변화만 기록한다.
- path: 표정·자세·목소리·눈 깜빡임에서 긴장·불안 같은 심리 상태를 자동 판정해 원인으로 알려준다.
  status: rejected
  reason: 녹음과 영상만으로는 그 순간 대본을 잊었는지, 시간을 신경 썼는지, 긴장했는지 구분할 수 없다(5 Whys 4단계). 틀린 원인을 단정하면 사용자는 엉뚱한 조건을 바꾸게 된다. 원인은 사용자에게 묻고, 시선 이탈·군말·깜빡임 같은 측정값은 "관찰"로만 기록한다(D15).
- path: 발표 도중 실시간으로 대본을 고쳐 주거나 "속도를 줄이세요" 같은 지시를 띄운다.
  status: rejected
  reason: E1은 시계를 보는 것만으로도 설명 흐름이 끊겼다. 발표 중 텍스트 지시는 그보다 더 큰 끊김을 만든다. 연습 중 안내는 색과 상태 한 단어로 제한하고, 조정은 연습 뒤 루프에서 한다.
- path: 설치형 앱을 강제하거나, 대본·답변·녹음을 처리 위치 안내와 사용자 선택 없이 외부 AI 제공자에게 보낸다.
  status: rejected
  reason: 설치 없이 주소만 열어 연습하고 영상·얼굴은 브라우저에 보관한다(D01). 자체 모델은 운영 PC에서 실행하며, 사용자가 전송 범위를 확인해 선택하는 Gateway 모드는 채점 환경에서 실제 호출한다(F20). 어느 공급자든 실제 처리 위치를 안내하고 필요한 텍스트·선택 음성만 보낸다. 새 초안 생성(F22)은
    기존 연습 이력을 입력하지 않는다.
insight:
  claim: 시간 초과·미달은 "시간을 지키자"는 다짐과 반복 연습으로 해결되지 않았다. 시간을 확인하는 행동이 오히려 흐름을 끊었고, 연습 뒤에는 문제 구간을 직접 찾는 데 오래 걸렸으며, 찾은 구간에서 무엇을 바꿔 다시 연습할지는 아무 기록 없이 스스로 정해야 했다. 여기에 AI 도구로 대본을 쉽게 만들 수 있게 되면서
    "대본이 있다"와 "대본을 자기 말로 소화했다"가 별개의 문제가 됐다. 그래서 측정값을 보여 주는 데서 멈추지 않고, 막힌 순간의 이유를 사용자에게 묻고 조건 하나를 바꿔 그 구간만 다시 연습해 전후를 비교하는 루프가 필요하다.
  evidence: 'E1: 10분 이상 11분 미만 발표에서 10분 30초를 목표로 연습했지만 긴장하면 10분을 못 채웠고 자세히 설명하면 11분을 넘겼다. 시계를 보면 흐름이 끊겼고 연습과 실제의 속도가 달랐다. 녹음·웹캠 녹화를 처음부터 다시 보는 점검이 오래 걸려 준비 전반에 약 10시간이 들었다. E2: 팀원들은
    AI 도구로 만든 대본을 숙지하지 못한 채 연습하다 특정 구간에서 막혔고, 이해했다고 생각한 부분도 자기 말로 설명하면 원문과 달라졌다. 공개 조사: 영국 대학생 88%가 과제·평가에 생성형 AI를 쓰고 18%는 AI 문장을 그대로 넣는다(HEPI 2025). LLM으로 쓴 글은 직후에도 자기 글을 인용하지 못했다(MIT
    2025, 54명). 대중 연설 공포는 미국 성인 33.7%(Chapman 2025), 국내 신입생 266명은 "수행 통제감 부족"이 불안의 중심이었다(안상희 2025). 경쟁 서비스 직접 확인: PT샌드백은 목표 시간을 바꿔도 대본이 그대로였고, SayNow 피치 도구는 30초 요청에 49초 분량을 내놓고 직접 줄이라고
    안내했다. 두 서비스 모두 막힌 이유를 묻고 조건을 바꿔 다시 시험하는 흐름은 확인되지 않았다.'
  design_decision: 설치 없는 PC·노트북 웹으로 만든다. 실시간 시간 안내, 검토 구간 표시·재생, 같은 조건의 이전 연습 비교(F1–F6)와 자체 전사·군말·속도 측정(F16), 눈 깜빡임 측정(F21)은 구현했다. 핵심 루프는 "관찰 확인 → 그때 무엇이 어려웠는지 질문(최대 3개, 건너뛰기 가능) → 바꿔
    볼 조건 하나 선택 → 그 구간만 재연습 → 전후 비교"(F13–F14·F11, S9)다. "뜻을 모르겠다"는 답은 이해 확인으로 이어진다. 낯선 개념·근거 확인(F17) → 자기 말 설명(F18) → 쉬운 대본·필수 내용 보존 검사(F9–F10) → 예상 질문 답변(F19)을 첫 구현으로 제공하고, 녹음 전사 기반
    자동 연결·4열 교차 비교와 개인 실측 시간 기준은 보류 해법의 후속 범위다. 코칭·전사는 설정된 자체 모델 또는 주최 측 Gateway로 처리하고(F20), 실제 모델·처리 위치와 브라우저 밖 전송 범위를 안내한다. 대본이 아직 없는 사용자는 주제만 적어 초안을 받을 수 있고(F22), 이때도 기존 대본·답변·녹음은
    보내지 않는다. 점수·등급과 감정 자동 판정은 만들지 않고, 사용자의 설명과 측정된 관찰을 항상 구분해 기록한다.
features:
- id: F1
  name: 연습 준비(목표·기준·계획·기록 방법 설정)
  input: 목표 시간(분·초), 허용 오차(초), 임박 알림(남은 초), 목표 속도 범위(선택), 구간별 시간 계획(선택), 소리 기록·웹캠 영상 기록·분석 시 자체 AI 전사 선택
  output: 설정에 맞는 연습 화면이 열린다. 목표 시간은 특정 값으로 정해져 있지 않고 매번 직접 입력한다.
  done: 구현됨(S1). 목표 시간을 입력해 녹화를 시작하면 남은 시간이 줄어들고 종료·분석 뒤 실제 시간과 목표의 차이가 표시된다. 잘못된 시간·구간 계획에는 오류 이유와 줄 번호가 보인다.
- id: F2
  name: 실시간 발표 보조
  input: 연습 시작·일시정지·다시 시작·종료 버튼
  output: 경과 시간과 남은 시간, 시간 상태(여유·임박·초과, 색과 글자)를 보여 준다. 말하기 속도는 녹화 종료 후 자체 AI 전사로 F16에서 계산하며, 녹화 중에는 종료 후 측정한다고 안내한다.
  done: 구현됨(S2). 목표 2초를 넘기면 남은 시간 칸이 '초과 +'로 바뀌고 '목표 시간 초과'가 표시된다. 종료 후 결과에 양수 차이가 보인다.
- id: F3
  name: 구간별 시간 계획 비교
  input: 구간 이름과 시간 계획, 연습 중 '다음 구간' 버튼
  output: 연습 중 현재 구간의 계획 대비 진행과 앞 구간까지의 누적 차이, 결과 화면의 구간별 계획·실제·차이 표
  done: 구현됨(S3). 도입 0:02·본론 0:03 계획을 입력하고 다음 구간을 누른 뒤 종료하면 구간별 계획·실제·차이와 '연습 종료까지' 표시가 나온다.
- id: F4
  name: 소리·웹캠 영상 기록
  input: 마이크 권한, 선택 웹캠 영상 기록, 분석 시 자체 AI 전사 선택.
  output: 연습 소리(WAV)와 선택 영상은 브라우저에 저장한다. 자체 AI 전사를 켜고 분석을 누르면 소리 조각만 직접 운영하는 서버로 보내고 영상·얼굴 데이터는 보내지 않는다.
  done: 구현됨(S6, 별도 녹화 입력 재생 검사). 영상 파일을 분석하면 재생기와 저장된 기록이 보인다. 녹화 입력 재생 검사에서는 두 회차의 소리·영상 Blob 크기가 0보다 크고 두 영상을 재생할 수 있다. 장치가 없는 S5도 시간 측정과 코칭을 마친다.
- id: F5
  name: 자동 점검 구간 표시와 구간 재생
  input: 연습 종료
  output: 긴 침묵(소리 기반), 반복 표현·속도 변화(자체 AI 전사를 완료한 경우), 구간 시간 차이를 시간 위치·측정값·근거와 함께 목록으로 보여 주고, 항목을 누르면 녹음·영상의 그 위치로 이동한다.
  done: 구현됨(S9). 계획보다 길어진 구간이 시각·측정값·기준과 함께 보이고 항목을 누르면 해당 구간의 질문 카드가 열린다. 음성 단위 검사에서는 5초 무음 입력의 위치·길이가 표시되고 무신호 입력은 별도 안내로 나온다.
- id: F6
  name: 연습 결과와 같은 조건 비교
  input: 같은 목표 시간·구간 계획으로 한 이전 연습 기록
  output: 총 연습 시간, 목표와의 차이(초과·일찍 끝남·허용 오차 안), 측정된 평균 속도, 검토 구간 수를 이전 연습과 나란히 보여 준다. 점수·개선율은 만들지 않는다.
  done: 구현됨(S4). 같은 조건으로 첫 연습을 마치면 이전 기록 없음이 보이고 두 번째 연습을 마치면 이전·이번 총 시간과 변화가 표로 나온다. 미측정 항목에는 비교 불가 이유가 보인다.
- id: F7
  name: 대본·근거 자료·버전 관리
  input: 붙여넣은 대본·근거 자료, TXT 불러오기 또는 스튜디오의 TXT·PDF·DOCX 글자 추출, 사용자가 확인한 새 초안.
  output: 대본과 근거 자료를 구분해 브라우저에 저장하고 버전 ID·생성 시각과 원문·수정본을 보관한다. 근거 자료와 AI가 만든 대본을 별도 입력으로 다룬다.
  done: 구현됨(S5·S8). 원문과 수정안을 나란히 보고 확인 후 새 버전으로 적용할 수 있다. 처음 대본으로 되돌리면 입력칸의 문구가 원문과 같고 이전 답변·연습 기록이 남는다.
- id: F9
  name: 말하기 쉬운 대본 수정 제안
  input: F7의 대본·근거 자료, 선택 문단·낯선 개념·본인 설명과 명시적인 수정 요청. 개인 실측 시간에 맞춘 길이 조정은 보류 해법에 둔다.
  output: 쉬운 단어·짧은 문장·수정 이유·입력 자료 인용과 원문 비교를 제안한다. 선택 적용·직접 편집·원문 복원을 제공하고 자료 없는 설명에는 사용자 확인 안내를 표시한다.
  done: 구현됨(S5·S8). 수정 요청 후 비어 있지 않은 수정안과 이유가 나타나며 수치 5분이 유지된다. 사용자는 초안을 직접 편집·닫기·선택 적용할 수 있고 원문으로 되돌릴 수 있다.
- id: F10
  name: 수치·단위와 일부 의미 표현의 보존 검사
  input: 수정 전후 대본, 필수 항목 ID, 수치·단위·부정·조건을 포함한 제공 근거.
  output: 수치·단위 변화는 적용 차단과 함께 표시하고 부정·조건·한계의 일부 변화는 경고와 의미 확인란으로 보여 준다. 자동 검사는 전체 의미 동일성을 보증하지 않는다.
  done: 구현됨(S5·S8). 의미 보존 확인 전에는 적용 버튼이 비활성이고 확인 후 적용할 수 있다. 수치·단위가 달라진 수정안에는 경고가 나타나고 적용 버튼이 비활성으로 유지된다.
- id: F11
  name: 구간 재연습과 전후 비교
  input: 이전 연습 ID·수정 항목 ID·선택 대본 버전·재연습 결과. 선택한 연습 조건·시험 ID와 선택적 사용자 부담 응답. 같은 개념·필수 근거의 자기 설명 및 예상 질문 응답 기록, 도움 제공 여부.
  output: 원본·구간 재연습 영상과 시간·속도·군말·침묵 등 측정 가능한 값을 나란히 표시한다. 고른 이유·조건·대본 버전을 남기며 범위·자료가 다른 비교에는 제한을 안내한다. 한 회차로 원인·이해 향상·극복 완료를 확정하지 않는다.
  done: 구현됨(S5·S9). 수정 또는 선택 조건으로 구간 재연습을 마치면 이전·이번 구간 시간과 측정값이 나란히 보이고 선택한 이유·조건이 함께 표시된다. 원본 대본은 복원 버튼으로 다시 조회할 수 있다.
- id: F12
  name: 대본 코칭 기록 JSON 내보내기
  input: 현재 대본·근거 자료·버전·질문·답변·사용자 확인 기록과 기록 내보내기 선택.
  output: 코칭 기록을 JSON으로 내려받는다. 영상·음성은 JSON에 포함하지 않는다. HTML 보고서·내보낸 파일 복원은 후속 범위다.
  done: 구현됨(코칭 화면의 JSON 내보내기). 기록 내보내기를 누르면 대본·자료·버전·답변 이력이 든 JSON 파일이 내려받아진다. 파일에는 모델 결과와 사용자 확인 상태가 각각 담긴다.
- id: F13
  name: 관찰 확인과 상황·원인 질문 (초기 구현, S9)
  input: 검토 구간·재생·전사, 사용자 관찰 확인·교정 및 선택적 상황 설명.
  output: 관찰과 본인 설명을 구분한 기록, 최대 3개의 짧은 질문과 사용자가 확인한 상황 요약. 긴장을 자동 추정하지 않는다. 사용자가 뜻을 모르겠다고 하거나 설명에서 근거와의 차이가 나타나면 F18 이해 확인으로 연결한다. 이해 부족을 자동 원인으로 확정하지 않는다.
  done: 구현됨(S5·S9). 관찰 확인·상황 선택·사용자 답변이 대화 요약에 표시된다. S9의 질문은 '질문 1 / 3'부터 진행되며 건너뛰기·모르겠음 선택지가 보인다.
- id: F14
  name: 원인에 맞춘 연습 조건 설계와 시험 (초기 구현, S9)
  input: F13의 사용자 설명 또는 원인 미확인 상태, 선택한 조치·기준 연습·발표 환경 제약.
  output: 핵심어 카드·전환 단서·표시 방식 등 선택 가능한 조치와 선택 조건·원본·재연습의 비교를 제공한다. 군말 0회·원인 해결이나 개인의 정서 변화는 보장하지 않는다.
  done: 구현됨(S9). 다음 내용이 떠오르지 않는다고 선택하면 핵심어 카드를 고를 수 있고 구간 재연습 뒤 고른 조건과 이전·이번 값이 비교 표에 보인다.
- id: F16
  name: 녹화·파일 불러오기 전사와 군말·속도 측정
  input: 녹화 뒤 분석 또는 영상·소리 파일 불러오기와 사용자의 소리 전송 선택.
  output: 설정된 자체 전사 또는 주최 측 Gateway로 소리 조각만 전사하고 브라우저에서 평균 속도·군말 후보를 계산한다. 단어 시각이 없는 조각 전사는 세부 위치 대신 전체 범위·평균·집계만 표시한다. 실제 사람의 전사 정확도는 별도 평가 범위다.
  done: 구현됨(S6). 소리 전송을 선택해 영상 파일을 분석하면 실제 전사 API가 HTTP 200과 전사 글을 반환하고 화면에 평균 말하기 속도와 군말 후보 집계가 보인다. 부분 전사·전사 없음·후보 0회는 각각의 상태로 표시된다.
- id: F17
  name: 낯선 개념 후보와 자료 근거 연결 (초기 구현)
  input: 대본·근거 자료·선택 구간·사용자가 표시한 낯선 표현.
  output: 개념 후보·원문 인용·입력 자료 인용과 쉬운 풀이 초안을 보여 준다. 어려움은 후보이며 모델의 풀이를 검증된 사실로 표시하지 않는다.
  done: 구현됨(S8). 낯선 개념 살펴보기를 누르면 개념·원문 인용·쉬운 풀이 카드가 표시된다. 인용은 입력 문장에 존재하고 자료 인용 또는 근거 없음 안내가 보인다.
- id: F18
  name: 자기 말로 설명하는 이해 확인 (초기 구현)
  input: F17 개념·근거와 사용자의 자기 설명 또는 모르겠음·건너뛰기.
  output: 자기 설명에서 확인한 부분·보완할 부분·입력 자료 근거·다음 한 단계를 검토 초안으로 보여 준다. 군말·속도·표정·답변 길이로 이해를 판정하지 않으며 사용자 확인 상태를 별도로 남긴다.
  done: 구현됨(S8). 자기 설명을 입력하고 답변 함께 확인을 누르면 근거와 부합·보완 필요·판단 불가 중 하나의 검토 초안과 다음 행동이 표시되고 답변 이력에 1개가 추가된다.
- id: F19
  name: 자료 기반 예상 질문과 답변 연습 (초기 구현)
  input: 대본·근거 자료·핵심 개념·사용자 답변·이전 연습 기록.
  output: 입력 자료의 개념·작동 방식·한계를 묻는 질문, 답변 검토와 근거를 제공한다. 기준 근거는 열어 보기 전 숨기고 도움 사용 여부·이력을 남긴다. 실제 청중 질문이나 이해 향상은 예측·보장하지 않는다.
  done: 구현됨(S8). 예상 질문 연습을 누르면 실제 생성된 질문이 나타나고 답변 후 검토 초안·자료 근거 또는 추가 자료 안내와 답변 이력이 보인다.
- id: F20
  name: 자체 공개 모델·Gateway 실행과 처리 상태
  input: 운영자가 설정한 자체 모델 또는 주최 측 Gateway 키, 사용자가 요청한 대본·근거·답변과 선택 음성.
  output: 모델·프롬프트 버전·실제 처리 위치·연결 상태·실패 이유를 보여 준다. local은 공개 모델을 직접 실행하며 초기 추가 학습은 없다. gateway는 주최 측 키로 외부 제공자를 사용하고 화면에서 전송 범위를 안내한다. 자동 공급자 전환은 없다.
  done: 구현됨(S5·S8). 연결 상태 화면에 실제 공급자의 모델·처리 위치 안내가 보이고 해당 공급자의 실제 응답이 코칭 화면에 나타난다. 키·모델이 없는 환경에는 설정 안내가 보이며 기본 시간 연습 S1–S4는 계속 실행된다.
- id: F21
  name: 영상 눈 깜빡임 측정
  input: 연습 후 저장된 웹캠 영상 또는 불러온 영상, 사용자의 눈 깜빡임 분석 선택.
  output: 브라우저 내 MediaPipe로 깜빡임 횟수·분당 횟수·10초 구간·측정 불가 비율과 증가 위치·기준을 표시한다. 영상·얼굴은 전송하지 않는다. 관찰값을 점수·긴장·진단으로 해석하지 않으며 실제 사람 정확도 정답 검증은 별도 범위다.
  done: 구현됨(S6). 제공된 실제 영상 파일을 분석하면 총 깜빡임·분당 횟수가 표시된다. 얼굴 관측 시간 5초 또는 비율 70% 기준 미달 입력은 측정 못 함과 이유가 표시된다.
- id: F22
  name: AI로 새 대본 초안 생성
  input: 사용자가 입력한 발표 주제(3~400자), 선택 근거 자료(최대 2400자), 새 대본 만들기 선택.
  output: 설정된 Gemini 또는 Gateway가 만든 제목·대본 초안·확인할 내용을 보여 준다. 기존 답변·녹음·영상은 생성 입력에 포함하지 않고 확인한 초안만 선택 적용한다. 생성과 기존 대본 코칭의 설정·실패는 분리한다.
  done: 구현됨(별도 생성 화면·브라우저 검사). 새 초안을 요청하면 제목·대본·확인할 내용이 표시된다. 초안 확인 후 선택 적용하면 원문·기존 답변을 보존한 새 버전이 생기고 대본 이해 연습으로 이동한다. 미설정·실패 상태에서는 해당 이유가 보인다.
