five_whys:
  symptom: 연습을 반복해도 실제 발표에서 막힘과 시간 초과·미달이 되풀이되고, 연습 점검에 오래 걸리는 이유는 무엇인가?
  whys:
  - 긴장하면 말이 빨라지고, 내용 전달에 집중하느라 경과 시간과 남은 시간을 확인하지 못한다. (E1)
  - 시간을 확인하려고 화면이나 시계를 보면 설명 흐름이 끊기고, 남은 시간을 알아도 어느 부분에서 조절할지 바로 판단하기 어렵다. (E1)
  - 연습 후에는 녹음·영상을 처음부터 다시 보며 문제 구간을 직접 찾아야 해서 점검에 시간이 오래 걸린다. (E1)
  - 문제 구간을 찾아도 그 순간 무엇이 어려웠는지(대본을 숙지하지 못했는지, 다음 내용이 떠오르지 않았는지, 시간을 신경 썼는지)는 녹음과 측정값만으로 알 수 없어 무엇을 바꿀지 스스로 정해야 한다. (E1·E2, MIT 2025)
  - 바꿔 본 것이 실제로 도움이 됐는지 같은 기준으로 전후를 비교하는 과정이 없어, "다음엔 잘 외워야지" 같은 다짐에 기대고 같은 연습을 반복한다. (E1·E2)
solution_paths:
- path: >-
    핵심 루프 — 검토 구간을 보여 주고, 그 순간 무엇이 어려웠는지 짧게 묻고(최대 3개, 건너뛰기 가능), 바꿔 볼 조건 하나(핵심어 카드·전환 문장·시간 표시 방식 등)를 고른 뒤
    그 구간만 다시 연습해 전후를 나란히 비교한다.
  status: chosen
  reason: >-
    5 Whys 4·5단계에 직접 대응한다. E1은 "시계를 보면 흐름이 끊겼다"고 했으므로 시간 표시 방식 자체가 바꿔 볼 조건이 되고, A3의 "조금 빠르다" 같은 총평이 수정으로 이어지지 않는 문제를
    "무엇을 바꿨고 무엇이 달라졌나"로 대체한다. 긴장을 자동 원인으로 두지 않고 사용자 설명과 측정된 관찰을 구분한다. F13–F14·F11. 질문 3단계·구간 재연습·전후 비교의 첫 화면 흐름은 S9로 확인한다.
- path: >-
    막힘·긴 침묵·대본과 다른 발화가 나온 구간에서 "이 부분을 잘 이해한 게 맞나요?"라고 교차 확인하고, "이해했다"는 답은 자기 말 설명과 원문 기반 질문으로 다시 확인한다.
    응답을 반영해 대본을 말하기 쉬운 문장으로 다듬고 원문·설명·수정안·재연습 발화를 나란히 비교한다.
  status: chosen
  reason: >-
    E2(AI 도구로 만든 대본을 숙지하지 못한 채 연습하다 막힘)와 MIT 2025 실험(LLM으로 쓴 글을 직후에도 인용하지 못함)에 대응한다. "대본이 있다"와 "대본을 내 말로 소화했다"를 구분하는 유일한 방법은
    사용자가 직접 설명해 보게 하는 것이다. 불일치는 "설명과 원문이 다른 부분"으로만 보여 주고 원문에 없는 사실을 추가하지 않는다. F15.
- path: 연습 중 경과·남은 시간, 여유·임박·초과 상태(색과 글자), 구간별 계획 대비 진행, 선택한 경우 말하기 속도를 한 화면에 보여 준다.
  status: chosen
  reason: >-
    E1의 1·2단계(내용에 집중하면 시간을 놓치고, 시계를 보면 흐름이 끊김)에 대응한다. 숫자를 읽지 않아도 색만으로 상태를 알 수 있게 해 시선 이동을 줄이고, 10분 30초 같은 목표를 구간 단위로 쪼개
    어디서 늘고 줄었는지 보이게 한다. F1–F3, 구현됨(S1–S3).
- path: 소리(선택 시 웹캠 영상)를 이 브라우저 안에만 기록하고, 긴 침묵·속도 변화·반복 표현·구간 시간 차이를 재생 위치와 근거와 함께 목록으로 보여 주며, 같은 조건의 이전 연습과 나란히 비교한다.
  status: chosen
  reason: >-
    E1의 3단계(녹음·영상을 처음부터 다시 보며 고칠 구간을 찾는 데 오래 걸림)에 대응한다. 항목을 누르면 그 위치로 바로 이동하므로 발표 길이만큼 다시 볼 필요가 없다.
    점수·개선율 대신 측정값의 변화만 보여 준다. F4–F6, 구현됨(S4). 서버로 보내지 않아 가입·로그인 없이 바로 쓴다.
- path: 대본·필수 전달 항목·목표 시간 범위를 연결해 길이 조정 제안을 만들고, 수치·조건·부정이 빠지지 않았는지 보존 검사를 거쳐 선택 적용한다.
  status: deferred
  reason: >-
    E1이 "길면 설명을 줄이고 짧으면 보충"하던 수작업에 대응하지만, 대본 길이는 막힘의 여러 원인 중 하나라 핵심 루프 안에서 필요할 때 고르는 조치로 둔다(D13).
    대본·필수 항목·시간 범위 입력(F7–F8)은 핵심 루프의 입력 자료로 R1에서 먼저 받고, 수정 제안·보존 검사(F9–F10)는 외부 AI 공급자·비용 한도·전송 범위가 정해진 뒤 R3에서 연결한다.
- path: PDF·PPTX에서 대본을 자동 추출하거나 슬라이드를 자동 조작한다.
  status: deferred
  reason: 첫 버전은 TXT 불러오기와 붙여넣기로 충분하고(D05·D22, 2026-10-29 구현), PDF·PPTX 추출·OCR은 핵심 루프를 검증한 뒤 후속 범위로 분리한다.
- path: 발표 점수·등급을 매기거나 감점·학점을 예측해 보여 준다.
  status: rejected
  reason: >-
    Talkli·SayNow가 이미 회차별 점수 추적을 제공하고(A6), A3의 "조금 빠르다"처럼 총평은 무엇을 바꿔야 할지 알려주지 않는다. 점수는 연습을 점수 올리기로 바꾸고
    내용을 빼서 군말을 줄이는 식의 왜곡을 낳는다. 대신 바꾼 조건과 측정값의 변화만 기록한다.
- path: 표정·자세·목소리에서 긴장·불안 같은 심리 상태를 자동 판정해 원인으로 알려준다.
  status: rejected
  reason: >-
    녹음과 영상만으로는 그 순간 대본을 잊었는지, 시간을 신경 썼는지, 긴장했는지 구분할 수 없다(5 Whys 4단계). 틀린 원인을 단정하면 사용자는 엉뚱한 조건을 바꾸게 된다.
    원인은 사용자에게 묻고, 시선 이탈·군말 같은 관찰값은 "관찰"로만 기록한다(D15).
- path: 발표 도중 실시간으로 대본을 고쳐 주거나 "속도를 줄이세요" 같은 지시를 띄운다.
  status: rejected
  reason: E1은 시계를 보는 것만으로도 설명 흐름이 끊겼다. 발표 중 텍스트 지시는 그보다 더 큰 끊김을 만든다. 연습 중 안내는 색과 상태 한 단어로 제한하고, 조정은 연습 뒤 루프에서 한다.
- path: 설치형 모바일·데스크톱 앱으로 만든다.
  status: rejected
  reason: 연습 장소는 집·빈 강의실의 노트북이고 웹캠·마이크는 브라우저로 충분하다. 설치 없이 주소만 열면 바로 연습할 수 있어야 "연습 전 준비"가 또 하나의 부담이 되지 않는다(D01).
insight:
  claim: >-
    시간 초과·미달은 "시간을 지키자"는 다짐과 반복 연습으로 해결되지 않았다. 시간을 확인하는 행동이 오히려 흐름을 끊었고, 연습 뒤에는 문제 구간을 직접 찾는 데 오래 걸렸으며,
    찾은 구간에서 무엇을 바꿔 다시 연습할지는 아무 기록 없이 스스로 정해야 했다. 여기에 AI 도구로 대본을 쉽게 만들 수 있게 되면서 "대본이 있다"와 "대본을 자기 말로 소화했다"가
    별개의 문제가 됐다. 그래서 측정값을 보여 주는 데서 멈추지 않고, 막힌 순간의 이유를 사용자에게 묻고 조건 하나를 바꿔 그 구간만 다시 연습해 전후를 비교하는 루프가 필요하다.
  evidence: >-
    E1: 10분 이상 11분 미만 발표에서 10분 30초를 목표로 연습했지만 긴장하면 10분을 못 채웠고 자세히 설명하면 11분을 넘겼다. 시계를 보면 흐름이 끊겼고 연습과 실제의 속도가 달랐다.
    녹음·웹캠 녹화를 처음부터 다시 보는 점검이 오래 걸려 준비 전반에 약 10시간이 들었다.
    E2: 팀원들은 AI 도구로 만든 대본을 숙지하지 못한 채 연습하다 특정 구간에서 막혔고, 이해했다고 생각한 부분도 자기 말로 설명하면 원문과 달라졌다.
    공개 조사: 영국 대학생 88%가 과제·평가에 생성형 AI를 쓰고 18%는 AI 문장을 그대로 넣는다(HEPI 2025). LLM으로 쓴 글은 직후에도 자기 글을 인용하지 못했다(MIT 2025, 54명). 대중 연설 공포는 미국 성인 33.7%(Chapman 2025), 국내 신입생 266명은 "수행 통제감 부족"이 불안의 중심이었다(안상희 2025).
    경쟁 서비스 직접 확인: PT샌드백은 목표 시간을 바꿔도 대본이 그대로였고, SayNow 피치 도구는 30초 요청에 49초 분량을 내놓고 직접 줄이라고 안내했다. 두 서비스 모두 막힌 이유를 묻고 조건을 바꿔 다시 시험하는 흐름은 확인되지 않았다.
  design_decision: >-
    설치 없는 PC·노트북 웹으로 만든다. 실시간 시간·속도 안내, 검토 구간 표시·재생, 같은 조건의 이전 연습 비교(F1–F6)는 구현했다.
    핵심 루프는 "관찰 확인 → 그때 무엇이 어려웠는지 질문(최대 3개, 건너뛰기 가능) → 바꿔 볼 조건 하나 선택 → 그 구간만 재연습 → 전후 비교"(F13–F14, F11)다.
    여기에 대본 이해·숙지 교차 확인과 말하기 쉬운 문장으로 다듬기(F15)를 핵심 피드백으로 더하고, 대본 길이 조정·필수 내용 보존(F7–F10)은 그 안에서 필요할 때 고르는 조치로 연결한다.
    점수·등급과 감정 자동 판정은 만들지 않고, 사용자의 설명과 측정된 관찰을 항상 구분해 기록한다.
features:
- id: F1
  name: 연습 준비(목표·기준·계획·기록 방법 설정)
  input: 목표 시간(분·초), 허용 오차(초), 임박 알림(남은 초), 목표 속도 범위(선택), 구간별 시간 계획(선택), 소리 기록·웹캠 영상 기록·음성 인식 분석 선택
  output: 설정에 맞는 연습 화면이 열린다. 목표 시간은 특정 값으로 정해져 있지 않고 매번 직접 입력한다.
  done: 목표 시간을 비우거나 구간 계획 줄 형식이 틀리면 연습이 시작되지 않고 이유와 줄 번호가 보인다. 올바르게 입력하면 연습이 시작된다.
- id: F2
  name: 실시간 발표 보조
  input: 연습 시작·일시정지·다시 시작·종료 버튼
  output: 경과 시간과 남은 시간, 시간 상태(여유·임박·초과, 색과 글자), 음성 인식을 켠 경우 최근 20초 기준 말하기 속도(분당 한글 음절)와 목표 속도 범위 비교가 보인다.
  done: 목표 2초로 시작하면 2초가 지난 뒤 '목표 시간 초과'와 남은 시간 칸의 '초과 +'가 보인다. 일시정지한 시간은 연습 시간에서 빠진다. 음성 인식을 켜지 않았거나 지원되지 않으면 속도 칸에 '측정 안 함/측정 불가'와 이유가 보이고 숫자는 보이지 않는다.
- id: F3
  name: 구간별 시간 계획 비교
  input: 구간 이름과 시간 계획, 연습 중 '다음 구간' 버튼
  output: 연습 중 현재 구간의 계획 대비 진행과 앞 구간까지의 누적 차이, 결과 화면의 구간별 계획·실제·차이 표
  done: 구간 계획이 없으면 진행이 빠른지 느린지 판단하지 않는다고 표시한다. 계획이 있으면 '다음 구간'을 누른 시점으로 구간 실제 시간을 계산하고, 연습을 끝낼 때까지 진행한 구간은 '연습 종료까지'로, 시작하지 못한 구간은 '진행 안 함'으로 표시한다.
- id: F4
  name: 소리·웹캠 영상 기록
  input: 마이크 권한(웹캠은 선택)
  output: 연습 소리(WAV)와 선택한 경우 웹캠 영상이 이 브라우저 안에만 저장된다. 서버로 보내지 않는다. 선택한 브라우저 음성 인식은 제공 업체의 외부 서비스로 전송될 수 있어 별도 안내한다.
  done: 권한이 거부되거나 장치가 없으면 '녹음 없이 시간만 측정해요' 안내가 뜨고 연습은 계속되며, 결과에 기록이 없다고 알린다. 기록한 연습은 결과 화면에서 다시 재생할 수 있고 재생 길이가 연습 시간과 맞는다.
- id: F5
  name: 자동 점검 구간 표시와 구간 재생
  input: 연습 종료
  output: 긴 침묵(소리 기반), 반복 표현·속도 변화(음성 인식을 켠 경우), 구간 시간 차이를 시간 위치·측정값·근거와 함께 목록으로 보여 주고, 항목을 누르면 녹음·영상의 그 위치로 이동한다.
  done: 5초 무음이 든 녹음에서 '긴 침묵'이 해당 위치(±1초)·약 5초로 표시되고 항목을 누르면 재생 위치가 그 시각으로 이동한다. 소리가 거의 없는 녹음은 침묵 구간 대신 '소리가 거의 없다'고 알린다. 표시할 구간이 없을 때는 그 사실만 알리고 평가하지 않는다.
- id: F6
  name: 연습 결과와 같은 조건 비교
  input: 같은 목표 시간·구간 계획으로 한 이전 연습 기록
  output: 총 연습 시간, 목표와의 차이(초과·일찍 끝남·허용 오차 안), 측정된 평균 속도, 검토 구간 수를 이전 연습과 나란히 보여 준다. 점수·개선율은 만들지 않는다.
  done: 비교할 이전 기록이 없으면 '아직 비교할 이전 기록이 없어요'가 보인다. 같은 조건으로 두 번째 연습을 끝내면 이전·이번 총 연습 시간과 변화가 표로 나온다. 측정하지 못한 값(예를 들어 속도)은 '비교 불가'와 이유로 표시한다.
- id: F7
  name: 대본·필수 내용·버전 관리 (개발 예정)
  input: UTF-8 TXT 파일(1MB 이하)에서 불러오거나 직접 붙여넣은 뒤 편집한 대본(대본 패널 ‘대본 편집’의 TXT 불러오기·기록 저장은 2026-10-29 구현), 구간명, 필수 전달 항목, 항목의 근거 문장·수치·조건.
  output: '`projectId`, `scriptVersionId`, `sectionId`, `requirementId`를 부여하고 원본 버전을 보존한다.'
  done: 원문과 수정문을 동시에 조회하고 수정안을 버려도 원문을 복원할 수 있다. 버전을 바꾸면 기존 연습의 연결은 유지된다.
- id: F8
  name: 최소·최대 시간과 개인 실측 기준 (개발 예정)
  input: 최소·최대 발표 시간, 대본 버전, 실제 연습의 구간 시간·전사 및 사용자가 확인한 구간 대응.
  output: 허용 범위, 실제 초과·미달, 개인 기준 예상 시간 및 계산에 사용한 자료를 표시한다.
  done: 최소·최대 경계를 포함해 범위 내/미달/초과를 판정한다. 실측 자료가 없으면 개인화된 예측이라고 표시하지 않는다. 예상과 실제는 별도 필드다.
- id: F9
  name: 목표에 맞춘 대본 수정 제안 (개발 예정)
  input: F7 대본·필수 항목, F8 목표 범위·실측 근거, 사용자가 제공한 보완 자료.
  output: 중복 축약 또는 근거 있는 보완 문장, 수정 이유, 바뀐 부분, 예상 시간 변화를 제안한다. 원문에 자동 덮어쓰지 않는다.
  done: 사용자가 제안을 선택·거절·수정·되돌릴 수 있고, 모든 제안에 근거 구간과 적용 상태가 남는다. 예상 시간 충족만으로 완료 처리하지 않는다.
- id: F10
  name: 필수 내용 보존 검사 (개발 예정)
  input: 수정 전후 대본, 필수 항목 ID, 수치·단위·부정·조건을 포함한 제공 근거.
  output: 항목별 유지/누락/변경 의심/판단 불가, 해당 문장과 근거를 표시한다.
  done: 필수 수치 누락·단위 변경·부정 반전·조건 삭제를 포함한 검증 세트에서 잘못된 제안을 “유지”로 확정하지 않으며, 변경 의심을 숨긴 채 확정 저장하지 않는다.
- id: F11
  name: 수정 항목별 재연습과 전체 확인 (개발 예정)
  input: 이전 연습 ID·수정 항목 ID·선택 대본 버전·재연습 결과. 선택한 연습 조건·시험 ID와 선택적 사용자 부담 응답.
  output: 같은 항목의 해결/미해결/판단 불가와 발화 근거, 실제 시간 변화, 필수 내용 전달 상태를 표시한다. 구간 연습 이후 전체 연습을 별도로 수행한다. 조건 시험에서는 변화·부작용·비교 제한을 표시하며 원인 규명이나 극복 완료를 선언하지 않는다.
  done: 무엇을 고친 결과인지 추적되고, 전체 범위 충족은 전체 재연습 실측으로만 확정한다. 자동 판정과 사용자 확인 상태를 구분한다. 바꾸기로 한 조건과 의도하지 않은 조건 차이를 구분하고 한 회차로 인과를 확정하지 않는다.
- id: F12
  name: 결과 내보내기와 보관 관리 (개발 예정)
  input: 내보낼 프로젝트·버전·연습·검토 결과 선택.
  output: 대본 버전·조건·측정값·근거·미측정 항목을 포함한 HTML/JSON 결과를 사용자가 저장한다. 영상 포함 여부는 별도 선택한다.
  done: 내보낸 문서에서 예상·실제·미검증 상태가 구분되고, 선택하지 않은 영상·음성을 포함하지 않는다. 복원 기능은 별도 구현 전까지 지원한다고 쓰지 않는다. 원인 질문 답변·걱정의 원문은 기본 내보내기에서 제외하고 사용자가 선택한 요약만 포함한다.
- id: F13
  name: 관찰 확인과 상황·원인 질문 (개발 예정)
  input: 검토 구간·재생·전사, 사용자 관찰 확인·교정 및 선택적 상황 설명.
  output: 관찰과 본인 설명을 구분한 기록, 최대 3개의 짧은 질문과 사용자가 확인한 상황 요약. 긴장을 자동 추정하지 않는다.
  done: 오탐·문제로 느끼지 않음·모르겠음·건너뛰기를 처리하고 기존 연습을 막지 않는다. 질문 횟수 제한을 지키며 예시를 실제 원인으로 저장하지 않는다.
- id: F14
  name: 원인에 맞춘 연습 조건 설계와 시험 (개발 예정)
  input: F13의 사용자 설명 또는 원인 미확인 상태, 선택한 조치·기준 연습·발표 환경 제약.
  output: 핵심어 카드·전환 단서·표시 방식 등 선택 가능한 조치, 적용·되돌리기, 바꾼 조건과 유지한 조건의 시험 기록. F11로 재연습 비교.
  done: 선택한 조치만 적용하고 원본을 보존한다. 반복 빈도·내용·실제 시간·선택적 부담을 함께 비교하며 무효·악화·판단 불가를 표시한다. 군말 0회나 원인 해결을 보장하지 않는다.
- id: F15
  name: 대본 이해·숙지 교차 확인과 자연스러운 대본 다듬기·교차검증 (개발 예정)
  input: F7 대본(사용자가 AI 도구로 만든 대본인지 선택 표시 가능), 연습 전사와 대본 구간 대응, 막힘·긴 침묵·반복·대본과 다른 발화 후보 구간, 이해 확인 질문 응답과 자기 말 설명, 원문 기반 확인 질문 답변.
  output: 후보 구간마다 “이 부분을 잘 이해하지 못한 것 같아요. 잘 이해한 게 맞나요?” 교차 확인 질문과 응답 기록. “이해했다”는 응답은 자기 말 설명과 원문 기반 확인 질문(핵심 개념·순서·수치·조건)으로 다시 교차검증해 설명과 원문이 다른 부분을 표시한다. 응답에 따라 사용자 설명을 반영한 자연스러운 대본 다듬기 제안(원문 유지, 선택 적용) 또는 원문 근거의 핵심 정리. 원문·사용자 설명·수정안·재연습 발화 4열 교차검증 비교표.
  done: 사용자 응답 없이 “이해 부족”으로 저장하지 않는다. “이해했다”는 응답과 설명이 원문과 달라도 사용자가 속였다고 표시하지 않고 “설명과 원문이 다른 부분”으로 보여 준다. 선택하기 전에는 대본을 바꾸지 않고 적용·거절·되돌리기를 지원한다. 의미 차이는 어느 쪽이 맞다고 단정하지 않고 확인 필요로 표시한다. 수정안은 F10 필수 내용 보존 검사 결과를 함께 보여 준 뒤에만 저장하며 원문에 없는 사실을 추가하지 않는다. 이해·숙지 완료를 보장하지 않는다.
