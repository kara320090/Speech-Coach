# 현재 구현의 핵심 사용자 흐름 8개. 모든 steps와 expected는 문자열이다.
# S1-S4와 기존 S9의 ID·버튼을 보존하고 S5-S7은 대응하는 E2E 파일과 함께 추가했다.
# S6-S7은 외부 AI 키가 아닌 자체 모델을 사용한다. 모델이 준비된 Docker에서 검사하며 실제 장치는 필요 없다.
platform: desktop
platformReason: 긴 대본 입력·웹캠 녹화·구간별 결과와 이전 연습 비교를 함께 사용하는 PC·노트북 웹 서비스다. desktop은 브라우저 화면을 뜻하며 설치형 앱이 아니다. 자동 검사는
  실제 카메라·마이크·외부 AI 키 없이 시간 측정, TXT·음성 파일, 자체 모델로 수행한다.
scenarios:
- id: S1
  title: 학생이 목표 시간을 정해 녹화하고 목표보다 일찍 끝난 결과를 확인한다
  steps:
  - 첫 화면의 온보딩에서 '건너뛰기'를 누른다
  - '''목표 시간 분''에 0, ''목표 시간 초''에 6을 입력한다'
  - '''녹화 시작''을 누른다'
  - 경과 시간이 0:02가 될 때까지 기다린다
  - '''녹화 종료''를 누르고 ''분석''을 누른다'
  expected: 녹화 중에는 남은 시간이 줄어들며 '시간 임박' 같은 상태 문구가 보이고, 결과의 총 연습 시간이 목표 시간(0:06)보다 짧게 나오며 '목표보다 ... 일찍 끝났어요'와 음수 차이가
    표시된다
- id: S2
  title: 학생이 목표 시간을 넘겨 녹화하고 초과 결과를 확인한다
  steps:
  - 첫 화면의 온보딩에서 '건너뛰기'를 누른다
  - '''목표 시간 분''에 0, ''목표 시간 초''에 2를 입력한다'
  - '''녹화 시작''을 누른다'
  - '''목표 시간 초과''가 나타날 때까지 기다린다'
  - '''녹화 종료''를 누르고 ''분석''을 누른다'
  expected: 녹화 중에는 남은 시간 칸이 '초과 +'로 바뀌고 '목표 시간 초과'가 보이며, 결과에는 '목표보다 ... 초과했어요'와 양수 차이가 표시된다
- id: S3
  title: 학생이 구간별 시간 계획으로 녹화하고 계획과 실제를 비교한다
  steps:
  - 첫 화면의 온보딩에서 '건너뛰기'를 누른다
  - '''목표 시간 분''에 0, ''목표 시간 초''에 6을 입력한다'
  - '''연습 설정''을 펼쳐 구간별 시간 계획에 ''도입 0:02'' 줄과 ''본론 0:03'' 줄을 입력한다'
  - '''녹화 시작''을 누른다'
  - 경과 시간이 0:03이 될 때까지 기다린다
  - '''다음 구간''을 누른다'
  - '''녹화 종료''를 누르고 ''분석''을 누른다'
  expected: 결과의 '구간별 계획과 실제' 표에 도입은 계획 0:02와 '다음 구간'을 누른 시점(0:03 이상)으로 잰 실제 시간·그 차이가 표시되고, 본론은 '연습 종료까지'로 계산된 실제
    시간이 표시된다
- id: S4
  title: 학생이 같은 조건으로 두 번 녹화하고 이전 연습과 비교한다
  steps:
  - 첫 화면의 온보딩에서 '건너뛰기'를 누른다
  - '''목표 시간 분''에 0, ''목표 시간 초''에 10을 입력한다'
  - '''녹화 시작''을 누른다'
  - 경과 시간이 0:01이 될 때까지 기다린다
  - '''녹화 종료''를 누르고 ''분석''을 누른다'
  - 결과 아래의 '같은 조건으로 다시 연습'을 누른다
  - '''녹화 시작''을 누른다'
  - 경과 시간이 0:04가 될 때까지 기다린다
  - '''녹화 종료''를 누르고 ''분석''을 누른다'
  expected: 첫 결과에는 '아직 비교할 이전 기록이 없어요'가 보이고, 두 번째 결과의 '이전 연습과 비교' 표에는 이전·이번 총 연습 시간과 그 변화가 나란히 표시된다
- id: S5
  title: 학생이 TXT 대본을 불러와 수정하고 녹화 기록에서 같은 대본을 다시 확인한다
  steps:
  - 첫 화면의 온보딩에서 '건너뛰기'를 누른다
  - 대본 패널의 '대본 편집'을 누른다
  - '''TXT 파일 선택''에서 UTF-8 가상대본.txt를 선택한다. 내용은 ''오늘은 도서관 이용 방법을 소개합니다.''이다'
  - 대본 입력란 끝에 '대출 기간은 2주입니다.'를 덧붙인다
  - '''목표 시간 분''에 0, ''목표 시간 초''에 10을 입력한다'
  - '''녹화 시작''을 누르고 경과 시간이 0:02가 될 때까지 기다린다'
  - '''녹화 종료''를 누르고 ''분석''을 누른다'
  - 브라우저를 새로고침한다
  - '''대본 편집''을 눌러 기록에 저장된 대본과 파일명을 확인한다'
  expected: 결과에 총 연습 시간과 목표 차이가 표시되고, 대본 편집에서 도서관 소개와 '대출 기간은 2주입니다.' 문장이 유지된다. 파일명은 가상대본.txt로 표시되고 수정됨 상태가 보인다.
    마이크가 없어도 녹화 기록과 대본 저장은 완료된다.
- id: S6
  title: 학생이 자체 AI로 개념과 자기 설명을 확인하고 쉬운 대본을 선택 적용한 뒤 원문을 복원한다
  steps:
  - 첫 화면의 온보딩에서 '건너뛰기'를 누르고 '대본 이해 연습' 링크를 누른다
  - 분석할 대본 구간과 근거 자료에 '캐시는 이전 결과를 잠시 저장했다가 같은 요청이 오면 다시 사용하는 공간입니다.'를 각각 입력한다
  - '''자료 저장''을 누른다'
  - '''낯선 개념 살펴보기''를 눌러 자체 AI의 개념 후보·원문 인용을 확인한다'
  - 개념 후보의 '내 말로 설명해 보기'를 누른다
  - 내 설명·답변에 '이전에 얻은 결과를 잠시 저장하고 같은 요청에 다시 사용하는 공간입니다.'를 입력한다
  - '''답변 함께 확인''을 눌러 근거와 검토 초안을 확인한다'
  - '''이 검토가 맞아요''를 누른다'
  - '''쉬운 대본 제안''을 눌러 현재 대본과 수정 초안을 비교한다'
  - '''수치·조건·부정·한계와 핵심 의미를 확인했어요''를 선택한다'
  - '''새 버전으로 적용''을 누른다'
  - '''처음 대본으로 되돌리기''를 누른다'
  expected: 입력 원문에 존재하는 인용과 개념 풀이, 자기 설명에 대한 근거 기반 검토 초안이 표시된다. 사용자 확인이 맞음으로 기록되고 답변 이력은 유지된다. 쉬운 대본은 확인 선택 전 적용할
    수 없으며 적용 후 새 버전으로 저장된다. 되돌리면 원문이 복원되고 기존 답변은 삭제되지 않는다. 이 흐름은 자체 Qwen을 사용하며 Gemini 키를 요구하지 않는다.
- id: S7
  title: 학생이 한국어 음성 파일을 자체 AI로 전사해 말하기 속도와 군말 후보를 확인한다
  steps:
  - 첫 화면의 온보딩에서 '건너뛰기'를 누르고 '영상 불러오기' 링크를 누른다
  - 영상 또는 소리 파일에 e2e/fixtures/korean-synthetic.wav를 선택한다. 개인정보 없는 합성 한국어 음성이다
  - '''목표 시간 분''에 0, ''목표 시간 초''에 20을 입력한다'
  - '''글자로도 바꿔서 말하기 속도·반복 표현 분석''을 선택한다'
  - '''분석 시작''을 누르고 결과가 표시될 때까지 기다린다'
  - '''인식된 글 보기''를 펼친다'
  - 브라우저를 새로고침한다
  - '''인식된 글 보기''를 펼쳐 저장된 전사문을 다시 확인한다'
  expected: 파일의 약 8초 길이와 목표 차이, 자체 전사한 한국어 문장과 시간 구간이 표시된다. 평균 말하기 속도가 양수의 음절/분으로 계산되고 군말 후보 측정에는 전사문에서 센 횟수·종류가
    표시된다. 후보가 없으면 0회로 표시하고 전사 실패와 구분한다. 새로고침 후에도 전사문과 분석 수치가 유지된다. 실제 마이크·카메라·외부 AI 키를 사용하지 않는다.
- id: S9
  title: 학생이 다시 볼 구간에 답하고 제안받은 조건으로 그 구간만 다시 연습해 전후를 비교한다
  steps:
  - 첫 화면의 온보딩에서 '건너뛰기'를 누른다
  - '''목표 시간 분''에 0, ''목표 시간 초''에 6을 입력한다'
  - '''연습 설정''을 펼쳐 구간별 시간 계획에 ''도입 0:01'' 줄과 ''본론 0:04'' 줄을 입력한다'
  - '''녹화 시작''을 누르고 경과 시간이 0:03이 되면 ''다음 구간''을 누른 뒤 ''녹화 종료''와 ''분석''을 누른다'
  - '다시 볼 구간 목록에서 ''계획보다 길어진 구간: 도입''을 누른다'
  - 질문 1 '표시한 구간이 맞나요?'에 '맞아요'를 누른다
  - 질문 2에서 '다음 내용이 안 떠오름'을 고르고 '다음'을 누른다
  - 질문 3에서 제안된 '핵심어 카드'가 선택된 것을 확인하고 '이 구간 다시 연습'을 누른다
  - '''녹화 시작''을 누르고 경과 시간이 0:02가 되면 ''녹화 종료''와 ''분석''을 누른다'
  expected: 질문은 최대 3개이며 연습 전후 비교에 선택한 이유와 핵심어 카드, 이전·다시 연습의 측정값이 나란히 표시된다. 마이크·카메라가 없어서 측정하지 못한 말 속도·군말·침묵·시선은 미측정
    또는 비교 불가로 표시하며 0이나 점수로 대신하지 않는다.
