# 현재 구현 화면(다시봄 한 화면 구성)의 S1–S4와 S9. 주최 측 실행에는 마이크·카메라가 없어 시간 측정·구간 계획으로 흐름을 확인한다.
# S9는 계획 시나리오 S9(상황 확인)와 S10(조건 시험)의 핵심을 한 흐름으로 묶었다. 대본 수정 등 S5–S8과 F15의 S11은 미구현이라 docs/screen-spec.md에 남긴다.
# 첫 화면에는 사용 방법 온보딩이 뜨고, 이 브라우저에서 한 번 건너뛰거나 마치면 다시 뜨지 않는다.
# 번호 미배정 영상 불러오기(/import.html)는 구현됐지만 작성자 결정에 따라 여기에 넣지 않았다(docs/import-feature.md).
platform: desktop
platformReason: 사용자가 설치형 앱을 만들지 말라고 명시했다. 주 사용 환경은 노트북·PC 웹브라우저이며 마이크와 웹캠으로 혼자 발표를 연습한다. desktop은 PC 화면을 뜻하고
  설치형 데스크톱 앱을 뜻하지 않는다. 모바일 네이티브 앱은 개발 범위에 포함하지 않는다.
scenarios:
- id: S1
  title: 학생이 목표 시간을 정해 녹화하고 목표보다 일찍 끝난 결과를 확인한다
  steps:
  - 첫 화면의 온보딩에서 '건너뛰기'를 누른다
  - '''목표 시간 분''에 0, ''목표 시간 초''에 6을 입력한다'
  - '''녹화 시작''을 누른다'
  - 경과 시간이 0:02가 될 때까지 기다린다
  - '''녹화 종료''를 누르고 ''분석''을 누른다'
  expected: 녹화 중에는 남은 시간이 줄어들며 '시간 임박' 같은 상태 문구가 보이고, 결과의 총 연습 시간이 목표 시간(0:06)보다 짧게 나오며 '목표보다 ... 일찍 끝났어요'와 음수
    차이가 표시된다
- id: S2
  title: 학생이 목표 시간을 넘겨 녹화하고 초과 결과를 확인한다
  steps:
  - 첫 화면의 온보딩에서 '건너뛰기'를 누른다
  - '''목표 시간 분''에 0, ''목표 시간 초''에 2를 입력한다'
  - '''녹화 시작''을 누른다'
  - '''목표 시간 초과''가 나타날 때까지 기다린다'
  - '''녹화 종료''를 누르고 ''분석''을 누른다'
  expected: 녹화 중에는 남은 시간 칸이 '초과 +'로 바뀌고 '목표 시간 초과'가 보이며, 결과에는 '목표보다 ... 초과했어요'와 양수 차이가 표시된다
- id: S3
  title: 학생이 구간별 시간 계획으로 녹화하고 계획과 실제를 비교한다
  steps:
  - 첫 화면의 온보딩에서 '건너뛰기'를 누른다
  - '''목표 시간 분''에 0, ''목표 시간 초''에 6을 입력한다'
  - '''연습 설정''을 펼쳐 구간별 시간 계획에 ''도입 0:02'' 줄과 ''본론 0:03'' 줄을 입력한다'
  - '''녹화 시작''을 누른다'
  - 경과 시간이 0:03이 될 때까지 기다린다
  - '''다음 구간''을 누른다'
  - '''녹화 종료''를 누르고 ''분석''을 누른다'
  expected: 결과의 '구간별 계획과 실제' 표에 도입은 계획 0:02와 '다음 구간'을 누른 시점(0:03 이상)으로 잰 실제 시간·그 차이가 표시되고, 본론은 '연습 종료까지'로 계산된
    실제 시간이 표시된다
- id: S4
  title: 학생이 같은 조건으로 두 번 녹화하고 이전 연습과 비교한다
  steps:
  - 첫 화면의 온보딩에서 '건너뛰기'를 누른다
  - '''목표 시간 분''에 0, ''목표 시간 초''에 10을 입력한다'
  - '''녹화 시작''을 누른다'
  - 경과 시간이 0:01이 될 때까지 기다린다
  - '''녹화 종료''를 누르고 ''분석''을 누른다'
  - 결과 아래의 '같은 조건으로 다시 연습'을 누른다
  - '''녹화 시작''을 누른다'
  - 경과 시간이 0:04가 될 때까지 기다린다
  - '''녹화 종료''를 누르고 ''분석''을 누른다'
  expected: 첫 결과에는 '아직 비교할 이전 기록이 없어요'가 보이고, 두 번째 결과의 '이전 연습과 비교' 표에는 이전·이번 총 연습 시간과 그 변화가 나란히 표시된다
- id: S9
  title: 학생이 다시 볼 구간에 답하고 제안받은 조건으로 그 구간만 다시 연습해 전후를 비교한다
  steps:
  - 첫 화면의 온보딩에서 '건너뛰기'를 누른다
  - '''목표 시간 분''에 0, ''목표 시간 초''에 6을 입력한다'
  - '''연습 설정''을 펼쳐 구간별 시간 계획에 ''도입 0:01'' 줄과 ''본론 0:04'' 줄을 입력한다'
  - '''녹화 시작''을 누르고 경과 시간이 0:03이 되면 ''다음 구간''을 누른 뒤 ''녹화 종료''와 ''분석''을 누른다'
  - 다시 볼 구간 목록에서 '계획보다 길어진 구간: 도입'을 누른다
  - 질문 1 '표시한 구간이 맞나요?'에 '맞아요'를 누른다
  - 질문 2에서 '다음 내용이 안 떠오름'을 고르고 '다음'을 누른다
  - 질문 3에서 제안된 '핵심어 카드'가 선택된 것을 확인하고 '이 구간 다시 연습'을 누른다
  - '''녹화 시작''을 누르고 경과 시간이 0:02가 되면 ''녹화 종료''와 ''분석''을 누른다'
  expected: 질문은 '질문 1 / 3'부터 최대 3개로 이어지고, 다시 연습한 뒤 '연습 전후 비교'에 고른 이유와 바꾼 조건(핵심어 카드), 말 속도·군말·긴 침묵·시선 이탈 비율의
    이전·다시 연습 값이 나란히 표시되며 점수는 표시되지 않는다
