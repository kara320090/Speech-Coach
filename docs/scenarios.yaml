# 제출 흐름 8개: S1–S6·S8·S9. 모든 흐름은 첫 화면 /에서 메뉴를 눌러 시작한다.
# S1–S4·S9: '기본 연습 화면' / S5: 스튜디오 / S6: '영상 불러오기' / S8: '대본 이해 연습'.
# S7의 실제 녹화 입력 재생은 e2e/media/의 별도 시연이며 채점 흐름에 포함하지 않는다.
platform: desktop
platformReason: >-
  대본과 웹캠 영상, 분석 결과를 함께 보며 발표를 연습하는 PC·노트북 웹 서비스다. 카메라·마이크가 없는 실행 환경에서도 시간 측정과 저장된 영상 파일 불러오기로 핵심 흐름을 진행한다.
scenarios:
  - id: S1
    title: 학생이 목표 시간을 정해 녹화하고 목표보다 일찍 끝난 결과를 확인한다
    steps:
      - "첫 화면 /에서 '바로 서비스 이용하기'를 누른다"
      - "주 메뉴의 '기본 연습 화면'을 누른다"
      - "기본 연습 화면의 사용 방법에서 '건너뛰기'를 누른다"
      - "'목표 시간 분'에 0, '목표 시간 초'에 6을 입력한다"
      - "'녹화 시작'을 누른다"
      - "경과 시간이 0:02가 될 때까지 기다린다"
      - "'녹화 종료'를 누르고 '분석'을 누른다"
    expected: >-
      '연습 결과'에 목표 시간 0:06과 이보다 짧은 총 연습 시간이 표시된다.
      '목표와의 차이'에는 '일찍 끝났어요'와 음수 시간 차이가 표시된다.

  - id: S2
    title: 학생이 목표 시간을 넘겨 녹화하고 초과 결과를 확인한다
    steps:
      - "첫 화면 /에서 '바로 서비스 이용하기'를 누른다"
      - "주 메뉴의 '기본 연습 화면'을 누른다"
      - "기본 연습 화면의 사용 방법에서 '건너뛰기'를 누른다"
      - "'목표 시간 분'에 0, '목표 시간 초'에 2를 입력한다"
      - "'녹화 시작'을 누른다"
      - "'목표 시간 초과'가 나타날 때까지 기다린다"
      - "'녹화 종료'를 누르고 '분석'을 누른다"
    expected: >-
      녹화 중 남은 시간에 '초과 +'와 '목표 시간 초과'가 표시된다.
      종료 후 '연습 결과'의 '목표와의 차이'에 '초과했어요'와 양수 시간 차이가 표시된다.

  - id: S3
    title: 학생이 구간별 시간 계획으로 녹화하고 계획과 실제를 비교한다
    steps:
      - "첫 화면 /에서 '바로 서비스 이용하기'를 누른다"
      - "주 메뉴의 '기본 연습 화면'을 누른다"
      - "기본 연습 화면의 사용 방법에서 '건너뛰기'를 누른다"
      - "'목표 시간 분'에 0, '목표 시간 초'에 6을 입력한다"
      - "'연습 설정'을 펼친다"
      - "구간별 시간 계획 입력칸에 '도입 0:02'와 '본론 0:03'을 한 줄씩 입력한다"
      - "'녹화 시작'을 누른다"
      - "경과 시간이 0:03이 될 때까지 기다린다"
      - "'다음 구간'을 누른다"
      - "'녹화 종료'를 누르고 '분석'을 누른다"
    expected: >-
      '구간별 계획과 실제' 표에 도입과 본론의 계획·실제·차이가 표시된다.
      도입의 계획은 0:02, 실제는 0:03 이상이며 차이는 실제에서 2초를 뺀 양수다.
      본론의 실제 시간에는 '연습 종료까지'가 표시된다.

  - id: S4
    title: 학생이 같은 조건으로 두 번 녹화하고 이전 연습과 비교한다
    steps:
      - "첫 화면 /에서 '바로 서비스 이용하기'를 누른다"
      - "주 메뉴의 '기본 연습 화면'을 누른다"
      - "기본 연습 화면의 사용 방법에서 '건너뛰기'를 누른다"
      - "'목표 시간 분'에 0, '목표 시간 초'에 10을 입력한다"
      - "'녹화 시작'을 누른다"
      - "경과 시간이 0:01이 될 때까지 기다린다"
      - "'녹화 종료'를 누르고 '분석'을 누른다"
      - "결과 아래의 '같은 조건으로 다시 연습'을 누른다"
      - "'녹화 시작'을 누른다"
      - "경과 시간이 0:04가 될 때까지 기다린다"
      - "'녹화 종료'를 누르고 '분석'을 누른다"
    expected: >-
      첫 결과에 '아직 비교할 이전 기록이 없어요'가 보인다.
      두 번째 결과의 '이전 연습과 비교' 표에 이전·이번 총 연습 시간과 변화가 나란히 표시된다.
      이번 시간은 이전보다 길고 변화는 두 시간의 차이인 양수다.

  - id: S5
    title: 확인한 대본 위치에서 대화하고 수정안을 확인·적용한 뒤 다시 연습한다
    steps:
      - "첫 화면 /에서 '바로 서비스 이용하기'를 누른다"
      - "'발표 대본'에 '캐시는 최근 결과를 5분 동안 저장해 같은 요청에 다시 사용합니다.'와 빈 줄 뒤 '효과는 아직 검증하지 않았습니다.'를 입력한다"
      - "'녹음 소리를 AI로 전사하는 데 동의해요'를 해제한다"
      - "'카메라 확인하기'와 '녹화 시작'을 누르고 약 1초 뒤 '연습 종료'를 누른다"
      - "결과 분석에서 '이 시점의 대본 확인'을 누르고 첫 문장을 선택해 '이 문장으로 할게요'를 누른다"
      - "'AI 코칭 시작'을 누르고 '선택한 대본·근거 자료·답변의 AI 전송에 동의해요.'를 선택한 뒤 '동의하고 대화 시작'을 누른다"
      - "상황 선택지에서 '문장이 말하기 어색했어요'를 누른다"
      - "'답변 입력'에 '문장이 길어서 말하기 힘들었어요.'를 입력하고 '보내기'를 누른다"
      - "'대화 요약'을 확인하고 '이 문단 고치기'를 눌러 '수정안이 준비됐어요'가 표시될 때까지 기다린다"
      - "원문·수정안을 검토하고 '수치·조건·부정 표현과 원래 뜻을 직접 확인했어요.'를 선택해 '수정안 적용하기'를 누른다"
      - "'구간 녹화 시작'을 누르고 약 1초 뒤 '구간 연습 종료'를 눌러 전후 비교를 확인한다"
      - "'수정 전 대본으로 되돌리기'를 누른다"
    expected: >-
      선택한 대본 문장과 사용자가 설명한 상황이 대화 요약에 반영된다.
      실제 AI 수정안은 의미 확인 전에는 적용할 수 없고 확인 후 선택 문단에 적용된다.
      재연습 후 이전·이번 구간 시간과 측정값을 나란히 볼 수 있다.
      마지막에는 '발표 대본' 입력칸이 처음 입력한 두 문장으로 복원된다.
      음성 전사를 끈 상태이며 장치가 없어도 시간 측정과 대본 코칭을 진행한다.

  - id: S6
    title: 실제 영상 파일을 불러와 전사·말하기 속도·군말 후보·눈 깜빡임 결과를 확인한다
    steps:
      - "첫 화면 /에서 '바로 서비스 이용하기'를 누른다"
      - "주 메뉴의 '영상 불러오기'를 누른다"
      - "'영상 또는 소리 파일 (mp4, m4a, mp3, wav, webm)'에서 e2e/fixtures/presentation-review.mp4를 선택한다"
      - "'목표 시간 분'에 0, '목표 시간 초'에 18을 입력한다"
      - "소리 전송 안내를 확인하고 '글자로도 바꿔서 말하기 속도·반복 표현 분석'을 선택한다"
      - "'영상 눈 깜빡임도 이 기기에서 분석 (선택)'을 선택한다"
      - "'분석 시작'을 누르고 '연습 결과'가 표시될 때까지 기다린다"
      - "결과 아래의 '인식된 글 보기'를 펼친다"
    expected: >-
      '연습 결과'에 총 연습 시간 0:17, 목표 시간 0:18과 평균 말하기 속도(음절/분)가 표시된다.
      '군말(음, 어)'에는 후보 횟수가 표시되고 '인식된 글 보기'에는 시간 범위와 실제 전사문이 표시된다.
      불러온 영상을 재생할 수 있으며 '눈 깜빡임 측정'에는 총 횟수와 분당 횟수가 표시된다.
      군말·깜빡임 0회도 유효한 결과다.
      영상·얼굴은 이 기기에서 처리하고 소리만 동의한 전사 서버로 보낸다.

  - id: S8
    title: 학생이 개념·쉬운 대본·예상 질문·자기 설명을 실제 AI로 확인하고 원문을 복원한다
    steps:
      - "첫 화면 /에서 '바로 서비스 이용하기'를 누른다"
      - "주 메뉴의 '대본 이해 연습'을 누른다"
      - "'분석할 대본 구간'에 '캐시는 최근 결과를 5분 동안 저장합니다. 같은 요청에는 저장한 결과를 다시 사용합니다. 효과는 아직 검증하지 않았습니다.'를 입력한다"
      - "'근거 자료 (선택)'에 같은 세 문장을 입력한다"
      - "'낯선 개념 살펴보기'를 누른다"
      - "'쉬운 대본 제안'을 누른다"
      - "'수치·조건·부정·한계와 핵심 의미를 확인했어요'를 선택한다"
      - "'새 버전으로 적용'을 누른다"
      - "'예상 질문 연습'을 누른다"
      - "'내 설명·답변'에 '최근 결과를 5분 보관했다가 같은 요청에 다시 써요. 효과는 아직 확인한 게 아니에요.'를 입력한다"
      - "'답변 함께 확인'을 누른다"
      - "'처음 대본으로 되돌리기'를 누른다"
    expected: >-
      실제 AI가 만든 개념 카드·쉬운 대본·예상 질문·답변 검토 초안이 표시된다.
      수정 제안에는 5분이 유지되고 의미 확인 전에는 '새 버전으로 적용'을 누를 수 없다.
      적용 후 새 대본 버전 저장 안내가 나오고 답변 검토 후 '전체 답변 1개'가 표시된다.
      마지막에는 '분석할 대본 구간'이 처음 입력한 세 문장으로 복원된다.

  - id: S9
    title: 학생이 다시 볼 구간에 답하고 제안받은 조건으로 그 구간만 다시 연습해 전후를 비교한다
    steps:
      - "첫 화면 /에서 '바로 서비스 이용하기'를 누른다"
      - "주 메뉴의 '기본 연습 화면'을 누른다"
      - "기본 연습 화면의 사용 방법에서 '건너뛰기'를 누른다"
      - "'목표 시간 분'에 0, '목표 시간 초'에 6을 입력한다"
      - "'연습 설정'을 펼친다"
      - "구간별 시간 계획 입력칸에 '도입 0:01'과 '본론 0:04'를 한 줄씩 입력한다"
      - "'녹화 시작'을 누르고 경과 시간이 0:03이 되면 '다음 구간'을 누른 뒤 '녹화 종료'와 '분석'을 누른다"
      - "다시 볼 구간 목록에서 '계획보다 길어진 구간: 도입'을 누른다"
      - "질문 1 '표시한 구간이 맞나요?'에 '맞아요'를 누른다"
      - "질문 2에서 '다음 내용이 안 떠오름'을 고르고 '다음'을 누른다"
      - "질문 3에서 제안된 '핵심어 카드'가 선택된 것을 확인하고 '이 구간 다시 연습'을 누른다"
      - "'녹화 시작'을 누르고 경과 시간이 0:02가 되면 '녹화 종료'와 '분석'을 누른다"
    expected: >-
      '질문 1 / 3'부터 관찰 확인·상황 선택·연습 조건 선택 순서로 진행된다.
      '연습 전후 비교'에 '이유: 다음 내용이 안 떠오름'과 '핵심어 카드'가 표시된다.
      표의 말 속도·군말·긴 침묵·시선 이탈 비율이 이전·다시 연습 열에 나란히 표시된다.
      마이크·웹캠이 없는 환경에서 측정하지 못한 항목에는 '측정 못 함'이 표시되며 점수는 표시되지 않는다.
