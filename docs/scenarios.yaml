# 사용자 핵심 흐름. 대시보드와 주최 측 실행이 기본 브랜치의 docs/scenarios.yaml에서 직접 읽는다.
# 주최 측 실행에는 마이크·웹캠이 없으므로, 여기 흐름은 소리 기록 없이도 끝까지 되는 부분(목표 설정 → 연습 → 실시간 표시 → 종료 → 결과 → 비교)이다.
# 마이크·웹캠 기록, 긴 침묵 찾기, 구간 다시 듣기는 e2e/media/ 의 별도 검사(가짜 마이크·카메라 장치)로 확인한다.
# Agent 판단(학생 확인 필요): platform은 학생이 말한 연습 장면(집이나 빈 강의실, 웹캠 녹화)에서 정했다.
platform: desktop
platformReason: |
  대상은 수업이나 팀 프로젝트 발표를 앞두고 집이나 빈 강의실에서 혼자 연습하는 대학생이다. 연습할 때 직접 녹음하고
  웹캠으로 녹화하며 다시 재생해 점검한다고 했으므로, 웹캠과 큰 화면으로 경과 시간·남은 시간을 한눈에 보는 노트북·PC 화면을 주로 쓴다고 본다.
scenarios:
  - id: S1
    title: 학생이 목표 시간을 정해 연습하고 목표보다 일찍 끝난 결과를 확인한다
    steps:
      - 첫 화면의 '목표 시간 분'에 0을 입력한다
      - 첫 화면의 '목표 시간 초'에 6을 입력한다
      - "'연습 시작'을 누른다"
      - 연습 화면의 경과 시간이 0:02가 될 때까지 기다린다
      - "'연습 종료'를 누른다"
    expected: 연습 중에는 남은 시간이 줄어들며 '시간 임박' 같은 상태 문구가 보이고, 결과 화면의 총 연습 시간이 목표 시간(0:06)보다 짧게 나오며 '목표보다 ... 일찍 끝났어요'와 음수 차이가 표시된다
  - id: S2
    title: 학생이 목표 시간을 넘겨 연습하고 초과 결과를 확인한다
    steps:
      - 첫 화면의 '목표 시간 초'에 2를 입력한다
      - "'연습 시작'을 누른다"
      - 연습 화면에 '목표 시간 초과'가 나타날 때까지 기다린다
      - "'연습 종료'를 누른다"
    expected: 연습 중에는 남은 시간 칸이 '초과 +'로 바뀌고 '목표 시간 초과'가 보이며, 결과 화면에는 '목표보다 ... 초과했어요'와 양수 차이가 표시된다
  - id: S3
    title: 학생이 구간별 시간 계획으로 연습하고 계획과 실제를 비교한다
    steps:
      - 첫 화면의 '목표 시간 초'에 6을 입력한다
      - 첫 화면의 '구간별 시간 계획'에 '도입 0:02' 줄과 '본론 0:03' 줄을 입력한다
      - "'연습 시작'을 누른다"
      - 연습 화면의 경과 시간이 0:03이 될 때까지 기다린다
      - "'다음 구간'을 누른다"
      - "'연습 종료'를 누른다"
    expected: 결과 화면의 '구간별 계획과 실제' 표에 도입은 계획 0:02와 '다음 구간'을 누른 시점(0:03 이상)으로 잰 실제 시간·그 차이가 표시되고, 본론은 '연습 종료까지'로 계산된 실제 시간이 표시된다
  - id: S4
    title: 학생이 같은 조건으로 두 번 연습하고 이전 연습과 비교한다
    steps:
      - 첫 화면의 '목표 시간 초'에 10을 입력한다
      - "'연습 시작'을 누른다"
      - 연습 화면의 경과 시간이 0:01이 될 때까지 기다린다
      - "'연습 종료'를 누른다"
      - "결과 화면에서 '같은 조건으로 다시 연습'을 누른다"
      - "'연습 시작'을 누른다"
      - 연습 화면의 경과 시간이 0:04가 될 때까지 기다린다
      - "'연습 종료'를 누른다"
    expected: 첫 연습 결과에는 '아직 비교할 이전 기록이 없어요'가 보이고, 두 번째 결과의 '이전 연습과 비교' 표에는 이전·이번 총 연습 시간과 그 변화가 나란히 표시된다
