# 현재 구현 화면의 S1–S4 유지. 기존 625b942의 CI에서 4개 통과; 실제 장치 검증은 별도.
# F7–F15 확장 시나리오 S5–S11은 미구현이므로 docs/screen-spec.md에 분리한다.
# 번호 미배정 영상 불러오기(/import.html)는 구현됐지만 작성자 결정에 따라 여기에 넣지 않았다(docs/import-feature.md).
platform: desktop
platformReason: 사용자가 설치형 앱을 만들지 말라고 명시했다. 주 사용 환경은 노트북·PC 웹브라우저이며 마이크와 선택 웹캠으로 혼자 발표를 연습한다. desktop은 PC 화면을 뜻하고
  설치형 데스크톱 앱을 뜻하지 않는다. 모바일 네이티브 앱은 개발 범위에 포함하지 않는다.
scenarios:
- id: S1
  title: 학생이 목표 시간을 정해 연습하고 목표보다 일찍 끝난 결과를 확인한다
  steps:
  - 첫 화면의 '목표 시간 분'에 0을 입력한다
  - 첫 화면의 '목표 시간 초'에 6을 입력한다
  - '''연습 시작''을 누른다'
  - 연습 화면의 경과 시간이 0:02가 될 때까지 기다린다
  - '''연습 종료''를 누른다'
  expected: 연습 중에는 남은 시간이 줄어들며 '시간 임박' 같은 상태 문구가 보이고, 결과 화면의 총 연습 시간이 목표 시간(0:06)보다 짧게 나오며 '목표보다 ... 일찍 끝났어요'와 음수
    차이가 표시된다
- id: S2
  title: 학생이 목표 시간을 넘겨 연습하고 초과 결과를 확인한다
  steps:
  - 첫 화면의 '목표 시간 초'에 2를 입력한다
  - '''연습 시작''을 누른다'
  - 연습 화면에 '목표 시간 초과'가 나타날 때까지 기다린다
  - '''연습 종료''를 누른다'
  expected: 연습 중에는 남은 시간 칸이 '초과 +'로 바뀌고 '목표 시간 초과'가 보이며, 결과 화면에는 '목표보다 ... 초과했어요'와 양수 차이가 표시된다
- id: S3
  title: 학생이 구간별 시간 계획으로 연습하고 계획과 실제를 비교한다
  steps:
  - 첫 화면의 '목표 시간 초'에 6을 입력한다
  - 첫 화면의 '구간별 시간 계획'에 '도입 0:02' 줄과 '본론 0:03' 줄을 입력한다
  - '''연습 시작''을 누른다'
  - 연습 화면의 경과 시간이 0:03이 될 때까지 기다린다
  - '''다음 구간''을 누른다'
  - '''연습 종료''를 누른다'
  expected: 결과 화면의 '구간별 계획과 실제' 표에 도입은 계획 0:02와 '다음 구간'을 누른 시점(0:03 이상)으로 잰 실제 시간·그 차이가 표시되고, 본론은 '연습 종료까지'로 계산된
    실제 시간이 표시된다
- id: S4
  title: 학생이 같은 조건으로 두 번 연습하고 이전 연습과 비교한다
  steps:
  - 첫 화면의 '목표 시간 초'에 10을 입력한다
  - '''연습 시작''을 누른다'
  - 연습 화면의 경과 시간이 0:01이 될 때까지 기다린다
  - '''연습 종료''를 누른다'
  - 결과 화면에서 '같은 조건으로 다시 연습'을 누른다
  - '''연습 시작''을 누른다'
  - 연습 화면의 경과 시간이 0:04가 될 때까지 기다린다
  - '''연습 종료''를 누른다'
  expected: 첫 연습 결과에는 '아직 비교할 이전 기록이 없어요'가 보이고, 두 번째 결과의 '이전 연습과 비교' 표에는 이전·이번 총 연습 시간과 그 변화가 나란히 표시된다
