# Basic web deployment only. Model binaries/weights are not installed by this blueprint.
# AI features remain unavailable until self-hosted inference is provisioned on the same host.
services:
  - type: web
    name: speech-coach
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: RELEASE_ID=$RENDER_GIT_COMMIT node server.js
    healthCheckPath: /__health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
