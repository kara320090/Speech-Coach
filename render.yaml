# Render serves web/API and calls the organizer AI Gateway directly.
# The Gateway key is supplied as a secret environment variable; no inference PC is needed.
services:
  - type: web
    name: speech-coach
    runtime: node
    plan: free
    # 대본 파일 읽기(/api/scripts/import)에 쓰는 패키지를 잠금 파일 그대로 설치한다(개발·선택 패키지 제외).
    buildCommand: npm ci --omit=dev --omit=optional
    # /__health의 releaseId에 배포한 commit을 넣는다. PORT는 Render가 넣어 주고 server.js가 읽는다.
    startCommand: RELEASE_ID=$RENDER_GIT_COMMIT node server.js
    healthCheckPath: /__health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: AI_PROVIDER
        value: gateway
      - key: AI_GATEWAY_TEXT_MODEL
        value: google/gemini-3.8-flash
      - key: AI_GATEWAY_TRANSCRIBE_MODEL
        value: google/gemini-3.5-transcribe
      - key: AI_GATEWAY_API_KEY
        sync: false
