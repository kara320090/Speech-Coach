# Render(https://render.com) 배포 설정. 이 저장소를 Render에 연결하면 웹 서비스 하나가 만들어진다.
# 서버 하나(server.js)가 화면(public/)과 백엔드(/api/transcribe, /api/scripts/import, /__health)를 함께 제공하므로 프론트엔드·백엔드를 따로 연결할 필요가 없다.
# 화면은 같은 주소의 /api/transcribe를 부르기 때문에 별도 주소 설정(CORS, API 주소 환경변수)이 없다.
services:
  - type: web
    name: speech-coach
    runtime: node
    plan: free
    # 대본 파일 읽기(/api/scripts/import)에 쓰는 패키지를 잠금 파일 그대로 설치한다(개발·선택 패키지 제외).
    buildCommand: npm ci --omit=dev --omit=optional
    # /__health의 releaseId에 배포한 commit을 넣는다. PORT는 Render가 넣어 주고 server.js가 읽는다.
    startCommand: RELEASE_ID=$RENDER_GIT_COMMIT node server.js
    healthCheckPath: /__health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      # 비밀값이라 파일에 적지 않는다. Render 화면(Environment)에서 직접 넣는다. 비워 두면 글자 변환만 꺼진다.
      - key: AI_GATEWAY_API_KEY
        sync: false
