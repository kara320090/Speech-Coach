# 루프톤 시나리오 검사. 주최 측 실행과 같은 순서로 docker compose 기동 → /__health 대기 → Playwright 실행.
# .github/workflows/scenarios.yml로 복사한다. compose 기동·/__health 응답·시나리오 E2E를 검사한다.
# 주최 측 실행은 e2e/playwright.config.ts 대신 같은 화면 크기·순서의 자체 설정으로 돈다. 여기서 통과하는지로 주최 측 실행 실행을 미리 확인한다.
# 채점 흐름은 실제 Gateway 키를 사용한다. 녹화 입력 재생 검사는 별도 미디어 spec으로 실행한다.
# 기본 브랜치 push와 수동 실행(Actions 탭 → Run workflow)에서 실행한다.
# spec이 하나도 없으면 E2E 단계는 비어 있는 채로 통과하니(--pass-with-no-tests), spec을 넣은 뒤의 결과를 본다.
name: scenarios

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  scenarios:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      E2E_BASE_URL: http://localhost:3000
      AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
      - name: Validate submission scenario YAML
        run: ruby scripts/validate_scenarios.rb
      - name: Require server AI Gateway key
        run: |
          if [ -z "$AI_GATEWAY_API_KEY" ]; then
            echo "Set the repository secret AI_GATEWAY_API_KEY to verify real AI scenarios."
            exit 1
          fi
      - name: Start app and database
        run: RELEASE_ID="$GITHUB_SHA" docker compose up -d --build
      - name: Wait for /__health
        run: |
          # 주최 측 실행은 기동을 시작한 때부터 2분을 기다린다. 여기서도 같은 시간 안에 떠야 한다.
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:3000/__health; then exit 0; fi
            sleep 2
          done
          echo "/__health가 120초 안에 200을 주지 않았다"
          docker compose logs app
          exit 1
      - name: Read seed account from docker-compose.yml
        run: |
          config="$(docker compose config --format json)"
          email="$(echo "$config" | jq -r '.services.app.environment.SEED_USER_EMAIL // empty')"
          password="$(echo "$config" | jq -r '.services.app.environment.SEED_USER_PASSWORD // empty')"
          # 로그인이 없는 서비스면 시드 계정이 없어도 된다.
          if [ -n "$email" ] && [ -n "$password" ]; then
            echo "E2E_USER_EMAIL=$email" >> "$GITHUB_ENV"
            echo "E2E_USER_PASSWORD=$password" >> "$GITHUB_ENV"
          fi
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Check planning contracts and generated canvas
        run: |
          python -m pip install -r tools/requirements-dev.txt
          python tools/check_submission.py
          python tools/render_problem_canvas.py --check
      - name: Run unit tests without provider keys
        env:
          AI_GATEWAY_API_KEY: ''
          GEMINI_API_KEY: ''
        run: |
          npm ci --omit=optional --no-audit --no-fund
          node --test --test-concurrency=1
      - name: Run scenario E2E
        working-directory: e2e
        run: |
          npm install
          npx playwright install --with-deps chromium
          npx playwright test --forbid-only
      - name: Prepare replay capture tools
        run: |
          if ! command -v ffmpeg > /dev/null; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
      - name: Record actual clip input with real Gateway responses (not a grading scenario)
        working-directory: e2e
        env:
          RECORDING_DEMO_PACE_MS: 1500
        run: npx playwright test -c media.config.ts S7-real-recording.spec.ts
      - name: Upload scenario and recording evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-evidence
          path: e2e/test-results/
          if-no-files-found: ignore
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: e2e/playwright-report
      - name: Stop containers
        if: always()
        run: |
          docker compose logs app --tail 200
          docker compose down -v
