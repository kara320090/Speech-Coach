# CPU models and the backend run together inside app. No GPU, PC agent or provider key required.
services:
  app:
    build:
      context: .
      args:
        RELEASE_ID: ${RELEASE_ID:-dev}
    ports:
      - "3000:3000"
    environment:
      RELEASE_ID: ${RELEASE_ID:-dev}
      TRANSCRIBE_TOTAL_SECONDS: ${TRANSCRIBE_TOTAL_SECONDS:-3600}
      # 코칭·전사는 자체 AI. Gemini 키는 새 대본 생성 버튼을 누른 경우에만 사용한다.
      AI_PROVIDER: local
      AI_EXECUTION_MODE: managed
      AI_RUNTIME_CONFIG: /app/local-ai/runtime.docker.json
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.8-flash}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
